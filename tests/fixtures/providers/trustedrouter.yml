# yaml-language-server: $schema=.schema.json
name: TrustedRouter
id: trustedrouter
pricing_urls:
  - https://trustedrouter.com/models
  - https://api.trustedrouter.com/v1/models
api_pattern: 'https://(?:api\.trustedrouter\.com|api-europe-west4\.quillrouter\.com)(?:/|$)'
model_match:
  starts_with: trustedrouter/
provider_match:
  or:
    - contains: trustedrouter
    - contains: trusted-router
price_comments: >-
  OpenAI-compatible inference gateway routing through hardware-attested Confidential Space enclaves
  (US: `https://api.trustedrouter.com/v1`, EU: `https://api-europe-west4.quillrouter.com/v1`). Prices are imported from
  https://api.trustedrouter.com/v1/models, covering token rates, prompt-length tiers, character-priced TTS
  (`input_mchars`), audio-minute transcription (`audio_hours` / `input_audio_hours`), per-request models
  (`requests_kcount`), and `trustedrouter/*` presets (at their published starting rates). Hidden/internal routes,
  dynamic `-1` routes, zero-priced/free routes, per-request minimum-charge floors (`pricing.minimum`), per-image models,
  and per-second video models are excluded.
# we don't include per-model descriptions here since there are 500+ models; see https://api.trustedrouter.com/v1/models
extractors:
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [prompt_tokens_details, cache_write_tokens]
        dest: cache_write_tokens
        required: false
      - path: [prompt_tokens_details, audio_tokens]
        dest: input_audio_tokens
        required: false
      - path: [completion_tokens_details, audio_tokens]
        dest: output_audio_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

  - api_flavor: responses
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: [input_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [input_tokens_details, cache_write_tokens]
        dest: cache_write_tokens
        required: false
      - path: [output_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: output_tokens
        dest: output_tokens

  - api_flavor: embeddings
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens

