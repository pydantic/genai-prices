        <h1 class="astryx-heading level-1 primary x1tgivj0 x1v68xuy x1lliihq p10srzze p1ufwgs ptbrsbv peqlt5" data-level="1" data-color="primary" id="pricing-and-rate-limits"><a to="#pricing-and-rate-limits" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#pricing-and-rate-limits"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Pricing and rate limits</span></a></h1><div class="astryx-stack vertical gap-2 xdt5ytf xak3so x1x7z4sm p1s85apg p9uq8br" data-direction="vertical" data-gap="2"><button type="button" class="astryx-button secondary sm x1n2onr6 x3nfvp2 x6s0dn4 xl56j7k x1txdalj xce4md1 xrrkdod xc342km xng3xce x1jxw6zd xjb2p0i xcr08ib x1kq96og x1e4wzip xuxw1ft x1ypdohk xrafxwg xuedmi6 x12w9bfk xlr8y92 x17x4s8c x1tgivj0 x1ilzqfv xq8i9tn x17nn4n9 xkzo27j x1wfwxd8 x13aywxo x3oybdh xk4oym4 x1gnnqk1 pqcrz7y pn3w4p2" data-variant="secondary" data-size="sm" aria-controls="_R_3av5tl5iv6vdb_" aria-expanded="false"><span class="xjp7ctv"><span class="xb3r6kr xlyipyv xeuugli">Table of contents</span><span class="x3nfvp2 x6s0dn4 x1heor9g"><svg viewBox="0 0 32 32" fill="none" width="16" height="16"><path d="M24.62 12.38a.876.876 0 0 1 0 1.24l-8 8a.876.876 0 0 1-1.24 0l-8-8a.876.876 0 0 1 1.24-1.24L16 19.763l7.38-7.381a.876.876 0 0 1 1.24 0z" fill="currentColor"></path></svg></span></span><span role="status" aria-live="polite" class="x10l6tqk x1i1rx1s xjm9jq1 xkdpibf x1717udv xb3r6kr xzpqnlu xuxw1ft xng3xce x13vifvy x1o0tod x47corl x87ps6o"></span></button><div class="astryx-grid xrvj5dj xqketvx pihq33y pg01cxk p2rcmwa p1erjwpq plr8y92 p12w9bfk" style="--x-gridTemplateColumns:1fr" aria-hidden="true" id="_R_3av5tl5iv6vdb_" inert=""><div class="astryx-stack vertical x78zum5 xdt5ytf p2lwn1j pb3r6kr" data-direction="vertical"><nav aria-label="Table of contents" class="astryx-outline compact x78zum5 x1q0g3np x1n2onr6 x1lsbc85 xh8yej3" data-density="compact"><ul class="x78zum5 xdt5ytf x1lsbc85 x1ghz6dp x1717udv xe8uvvx x98rzlu xeuugli" role="list"></ul><div class="x1n2onr6 xfo62xy x2lah0s x1clqncf" aria-hidden="true"><span class="x10l6tqk x13vifvy x1ey2m1c x1o0tod xfo62xy x1m4xfpy xjspbzw x47corl"></span></div><span class="astryx-outline-indicator x10l6tqk x1o0tod xfo62xy xowkcby xjspbzw x47corl x1vjfegm x1tsffl5 x1ltwjim x1qjb5ga x1xuz8iz xkvfbh3 xlr8y92" aria-hidden="true"></span></nav></div></div></div>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">Use our models with pay-as-you-go billing on Meta Model API and in <a to="/docs/muse-code" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/muse-code"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">Muse Code</span></a>, or in Muse Code with a monthly <a to="/docs/muse-code/subscriptions" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/muse-code/subscriptions"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">subscription</span></a>. This page covers pay-as-you-go: Model API bills text models per token, image generation per image, Muse Voice Transcribe by the hour of audio processed, and Segment Anything Model (SAM) per image or video frame segmented, with no minimums or upfront commitment.</p>
        <h2 class="astryx-heading level-2 primary x1tgivj0 x1xvnhcw x1cpk1wn x12yy4cs x1lliihq p1pc3f07 p13fuv20 p6gwkdc p11xkdxz phrwaqf pep27e5 p1adxfkp pmsqn1h" data-level="2" data-color="primary" id="pricing-modes"><a to="#pricing-modes" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#pricing-modes"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Pricing modes</span></a></h2>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">Some models can be used in two modes. Standard mode uses standard pricing. Contributor mode offers discounted pricing or more usage in exchange for permission to use your content — the prompts, code, files, and context you send, plus the model responses you get back — to train future Meta models.</p>
        <h3 class="astryx-heading level-3 primary x1tgivj0 xii13ha xwjzt0u x1jcxfy8 x1lliihq p13rv44w p1p37lm5" data-level="3" data-color="primary" id="standard-mode"><a to="#standard-mode" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#standard-mode"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Standard mode</span></a></h3>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">In Standard mode, you pay standard prices and your content is not used to train Meta models. Every model on this page is available in Standard mode.</p>
        <h3 class="astryx-heading level-3 primary x1tgivj0 xii13ha xwjzt0u x1jcxfy8 x1lliihq p13rv44w p1p37lm5" data-level="3" data-color="primary" id="contributor-mode"><a to="#contributor-mode" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#contributor-mode"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Contributor mode</span></a></h3>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">On Model API, Contributor mode runs the same models at heavily discounted token prices, in exchange for permission to use your content to train future Meta models. It lowers the barrier to entry for prototyping, testing integrations, and scaling experiments where it&#x27;s acceptable for Meta to use your content to train future Meta models.</p>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">On Model API, use Contributor mode with Muse Spark 1.3 or 1.2 by calling its Contributor-mode variant: <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">muse-spark-1.3-contributor</code> or <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">muse-spark-1.2-contributor</code>. Contributor mode isn&#x27;t available for Muse Wonder on Model API.</p>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">In <a to="/docs/muse-code" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/muse-code"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">Muse Code</span></a>, subscriptions default to Contributor mode, and you can turn it on or off in settings; see <a to="/docs/muse-code/subscriptions#contributor-mode" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/muse-code/subscriptions#contributor-mode"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">Contributor mode in Muse Code</span></a>.</p>
        <h2 class="astryx-heading level-2 primary x1tgivj0 x1xvnhcw x1cpk1wn x12yy4cs x1lliihq p1pc3f07 p13fuv20 p6gwkdc p11xkdxz phrwaqf pep27e5 p1adxfkp pmsqn1h" data-level="2" data-color="primary" id="pricing"><a to="#pricing" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#pricing"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Model pricing</span></a></h2>
        <h3 class="astryx-heading level-3 primary x1tgivj0 xii13ha xwjzt0u x1jcxfy8 x1lliihq p13rv44w p1p37lm5" data-level="3" data-color="primary" id="muse-wonder-pricing"><a to="#muse-wonder-pricing" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#muse-wonder-pricing"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Muse Wonder</span></a></h3>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">Model: <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">muse-wonder-1.0</code>.</p>
        <div class="astryx-card default x2kkz0m x153u1i6 x7giv3 x1p8z4y0 x1de1mus xw28qpl x9f619 xswhm3q x1mzf5mb xj1bl4l xwuefyo x1gu2k80 x91ghl5 x1i3qcxz xkunwnr x1litavf x1y0btm7 x14i3s5s xs19ii7 x12frdag x1nex4ik xbv1mwh p1ie71f1 p193iq5w peuugli ph8yej3" data-variant="default"><div tabindex="0" role="group" aria-label="Table" class="astryx-table-scroll-wrapper xw2csxc x5lxg6s xojxgvx x1fcf3bl xx6qvi6 xkibk3 xlayyun"><table class="astryx-base-table xh8yej3 x1mwwwfo x1gukg7c x1drmoe9 xjb2p0i x1tgivj0 astryx-table"><thead><tr class="astryx-table-row x139im0d"><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Usage</th><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Standard mode (per 1M tokens)</th><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Contributor mode (per 1M tokens)</th></tr></thead><tbody><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Cached input</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">$0.20</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Not available</td></tr><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Input</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">$4.00</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Not available</td></tr><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Output</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">$20.00</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Not available</td></tr></tbody></table></div></div>
        <h3 class="astryx-heading level-3 primary x1tgivj0 xii13ha xwjzt0u x1jcxfy8 x1lliihq p13rv44w p1p37lm5" data-level="3" data-color="primary" id="muse-spark-pricing"><a to="#muse-spark-pricing" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#muse-spark-pricing"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Muse Spark</span></a></h3>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">Models: <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">muse-spark-1.3</code>, <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">muse-spark-1.2</code>, and <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">muse-spark-1.1</code> in Standard mode; <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">muse-spark-1.3-contributor</code> and <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">muse-spark-1.2-contributor</code> in Contributor mode. Muse Spark 1.1 is Standard mode only.</p>
        <div class="astryx-card default x2kkz0m x153u1i6 x7giv3 x1p8z4y0 x1de1mus xw28qpl x9f619 xswhm3q x1mzf5mb xj1bl4l xwuefyo x1gu2k80 x91ghl5 x1i3qcxz xkunwnr x1litavf x1y0btm7 x14i3s5s xs19ii7 x12frdag x1nex4ik xbv1mwh p1ie71f1 p193iq5w peuugli ph8yej3" data-variant="default"><div tabindex="0" role="group" aria-label="Table" class="astryx-table-scroll-wrapper xw2csxc x5lxg6s xojxgvx x1fcf3bl xx6qvi6 xkibk3 xlayyun"><table class="astryx-base-table xh8yej3 x1mwwwfo x1gukg7c x1drmoe9 xjb2p0i x1tgivj0 astryx-table"><thead><tr class="astryx-table-row x139im0d"><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Usage</th><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Standard mode (per 1M tokens)</th><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Contributor mode (per 1M tokens)</th></tr></thead><tbody><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Cached input</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">$0.15</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">$0.002</td></tr><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Input</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">$1.25</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">$0.10</td></tr><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Output</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">$4.25</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">$0.20</td></tr></tbody></table></div></div>
        <h3 class="astryx-heading level-3 primary x1tgivj0 xii13ha xwjzt0u x1jcxfy8 x1lliihq p13rv44w p1p37lm5" data-level="3" data-color="primary" id="token-pricing-notes"><a to="#token-pricing-notes" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#token-pricing-notes"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Token pricing notes</span></a></h3>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">These apply to the token-priced models above, Muse Wonder and Muse Spark.</p>
        <ul role="list" class="astryx-list compact disc x1ghz6dp x1c1uobl x3ct3a4 x78zum5 xdt5ytf x1lsbc85 xif0320 pfo4z36 peuugli p1ewvobj" data-density="compact" data-list-style="disc">
        <li class="astryx-item compact center x78zum5 x6s0dn4 x1n2onr6 x9f619 x1yc453h xh6dtrn xu0wf1k xfrknyr pnjsko4 pzye2dw astryx-list-item" data-density="compact" data-align="center"><span class="xoi2r2e x9f619 x78zum5 x6s0dn4 xl56j7k x2lah0s x12xnipv x1233pnv"><span class="x1v4s8kt xols6we x16rqkct x19aspcf"></span></span><span class="x78zum5 xdt5ytf x98rzlu xeuugli x1yc453h"><span class="x1tgivj0 xjm74w1 xw6l6zx"><div class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq" data-type="body" data-color="primary"><strong>Cached input costs less</strong>: When part of your prompt matches a <a to="/docs/prompt-caching" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/prompt-caching"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">cached prefix</span></a>, you pay the cached-input rate for those tokens. Check <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">cached_tokens</code> in the response to see how many were served from cache.</div></span></span></li>
        <li class="astryx-item compact center x78zum5 x6s0dn4 x1n2onr6 x9f619 x1yc453h xh6dtrn xu0wf1k xfrknyr pnjsko4 pzye2dw astryx-list-item" data-density="compact" data-align="center"><span class="xoi2r2e x9f619 x78zum5 x6s0dn4 xl56j7k x2lah0s x12xnipv x1233pnv"><span class="x1v4s8kt xols6we x16rqkct x19aspcf"></span></span><span class="x78zum5 xdt5ytf x98rzlu xeuugli x1yc453h"><span class="x1tgivj0 xjm74w1 xw6l6zx"><div class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq" data-type="body" data-color="primary"><strong>No long-context premium</strong>: you pay the same rate whether your context window is mostly empty or almost full.</div></span></span></li>
        <li class="astryx-item compact center x78zum5 x6s0dn4 x1n2onr6 x9f619 x1yc453h xh6dtrn xu0wf1k xfrknyr pnjsko4 pzye2dw astryx-list-item" data-density="compact" data-align="center"><span class="xoi2r2e x9f619 x78zum5 x6s0dn4 xl56j7k x2lah0s x12xnipv x1233pnv"><span class="x1v4s8kt xols6we x16rqkct x19aspcf"></span></span><span class="x78zum5 xdt5ytf x98rzlu xeuugli x1yc453h"><span class="x1tgivj0 xjm74w1 xw6l6zx"><div class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq" data-type="body" data-color="primary"><strong>Web search grounding</strong>: <strong>$2.50 per 1,000 search queries</strong>, in addition to the request&#x27;s token cost. This applies to the <a to="/docs/search-grounding" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/search-grounding"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent"><code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">web_search</code> tool</span></a> on text models such as <a to="/docs/models#muse-wonder" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/models#muse-wonder"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">Muse Wonder</span></a> and <a to="/docs/models#muse-spark" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/models#muse-spark"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">Muse Spark</span></a>.</div></span></span></li>
        </ul>
        <div role="status" class="x78zum5 xdt5ytf xjb2p0i x1gnnqk1 p1ie71f1 p193iq5w peuugli"><div class="astryx-banner card info x78zum5 x1cy8zhl x1txdalj x8o8v82 x1pzlopt xgcxg3y x1hviunn" data-container="card" data-status="info"><div class="astryx-banner-icon info x78zum5 x6s0dn4 x2lah0s" data-status="info" aria-hidden="true"><span aria-hidden="true" class="astryx-icon md accent x3nfvp2 x6s0dn4 xl56j7k x2lah0s xqwr325 xwqq7k2 xmll18r x1603h9y" data-size="md" data-color="accent"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 3a9 9 0 100 18 9 9 0 000-18zm0 4a1 1 0 100 2 1 1 0 000-2zm-.75 3.75a.75.75 0 011.5 0v5.5a.75.75 0 01-1.5 0v-5.5z"></path></svg></span></div><div class="x78zum5 xdt5ytf xxhr3t x98rzlu xeuugli"><div class="x1ghz6dp xjb2p0i xcr08ib x2mo6ok x1kq96og x1tgivj0">Muse Image search is included</div><div class="x1ghz6dp xjb2p0i x141an7d x1sodnla x1ltkj2j xv1l7n4"><p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary"><a to="/docs/models#muse-image" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/models#muse-image"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">Muse Image</span></a>&#x27;s built-in web and image search is part of its per-image price and isn&#x27;t charged separately. See <a to="#image-generation" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="#image-generation"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">Muse Image pricing</span></a>.</p></div></div></div></div>
        <h3 class="astryx-heading level-3 primary x1tgivj0 xii13ha xwjzt0u x1jcxfy8 x1lliihq p13rv44w p1p37lm5" data-level="3" data-color="primary" id="image-generation"><a to="#image-generation" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#image-generation"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Muse Image</span></a></h3>
        <div class="astryx-card default x2kkz0m x153u1i6 x7giv3 x1p8z4y0 x1de1mus xw28qpl x9f619 xswhm3q x1mzf5mb xj1bl4l xwuefyo x1gu2k80 x91ghl5 x1i3qcxz xkunwnr x1litavf x1y0btm7 x14i3s5s xs19ii7 x12frdag x1nex4ik xbv1mwh p1ie71f1 p193iq5w peuugli ph8yej3" data-variant="default"><div tabindex="0" role="group" aria-label="Table" class="astryx-table-scroll-wrapper xw2csxc x5lxg6s xojxgvx x1fcf3bl xx6qvi6 xkibk3 xlayyun"><table class="astryx-base-table xh8yej3 x1mwwwfo x1gukg7c x1drmoe9 xjb2p0i x1tgivj0 astryx-table"><thead><tr class="astryx-table-row x139im0d"><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Usage</th><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Price</th></tr></thead><tbody><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Generated image</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">$0.01 per image</td></tr></tbody></table></div></div>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary"><a to="/docs/models#muse-image" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/models#muse-image"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">Muse Image</span></a> is billed at a flat rate per generated image. The price is the same regardless of prompt length, <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">reasoning_strength</code>, or the tools the model uses during generation, including its built-in web and image search, which isn&#x27;t charged separately. A request that returns <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">n</code> images is billed for <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">n</code> images. You&#x27;re billed only for images the model successfully generates and returns: images that fail to generate, or that are removed by safety filtering before they&#x27;re returned, aren&#x27;t counted. Image responses still include a <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">usage</code> object with token counts for reference, but image generation tokens are not included in token-based pricing for other models. See the <a to="/docs/image-generation#images-response" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/image-generation#images-response"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">Image generation</span></a> guide for the response shape.</p>
        <h3 class="astryx-heading level-3 primary x1tgivj0 xii13ha xwjzt0u x1jcxfy8 x1lliihq p13rv44w p1p37lm5" data-level="3" data-color="primary" id="muse-voice-transcribe-pricing"><a to="#muse-voice-transcribe-pricing" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#muse-voice-transcribe-pricing"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Muse Voice Transcribe</span></a></h3>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary"><a to="/docs/speech-to-text" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/speech-to-text"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">Muse Voice Transcribe</span></a> is billed by audio processed, metered in whole seconds.</p>
        <div class="astryx-card default x2kkz0m x153u1i6 x7giv3 x1p8z4y0 x1de1mus xw28qpl x9f619 xswhm3q x1mzf5mb xj1bl4l xwuefyo x1gu2k80 x91ghl5 x1i3qcxz xkunwnr x1litavf x1y0btm7 x14i3s5s xs19ii7 x12frdag x1nex4ik xbv1mwh p1ie71f1 p193iq5w peuugli ph8yej3" data-variant="default"><div tabindex="0" role="group" aria-label="Table" class="astryx-table-scroll-wrapper xw2csxc x5lxg6s xojxgvx x1fcf3bl xx6qvi6 xkibk3 xlayyun"><table class="astryx-base-table xh8yej3 x1mwwwfo x1gukg7c x1drmoe9 xjb2p0i x1tgivj0 astryx-table"><thead><tr class="astryx-table-row x139im0d"><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Usage</th><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Price</th></tr></thead><tbody><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Audio processed</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">$0.18 per hour</td></tr></tbody></table></div></div>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">Streaming and non-streaming transcription are priced the same. Zero data retention (ZDR) is priced at parity with Standard mode. Contributor mode isn&#x27;t available for Muse Voice Transcribe. Audio time is billed as a separate line item from token usage, rounded down to whole seconds; other endpoints aren&#x27;t billed for audio time.</p>
        <h3 class="astryx-heading level-3 primary x1tgivj0 xii13ha xwjzt0u x1jcxfy8 x1lliihq p13rv44w p1p37lm5" data-level="3" data-color="primary" id="sam-pricing"><a to="#sam-pricing" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#sam-pricing"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Segment Anything Model 3.1</span></a></h3>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary"><a to="/docs/models#sam-3" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/models#sam-3"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">SAM 3.1</span></a> segmentation is billed per image and per video frame, not per token. The same prices apply to streaming and non-streaming requests.</p>
        <div class="astryx-card default x2kkz0m x153u1i6 x7giv3 x1p8z4y0 x1de1mus xw28qpl x9f619 xswhm3q x1mzf5mb xj1bl4l xwuefyo x1gu2k80 x91ghl5 x1i3qcxz xkunwnr x1litavf x1y0btm7 x14i3s5s xs19ii7 x12frdag x1nex4ik xbv1mwh p1ie71f1 p193iq5w peuugli ph8yej3" data-variant="default"><div tabindex="0" role="group" aria-label="Table" class="astryx-table-scroll-wrapper xw2csxc x5lxg6s xojxgvx x1fcf3bl xx6qvi6 xkibk3 xlayyun"><table class="astryx-base-table xh8yej3 x1mwwwfo x1gukg7c x1drmoe9 xjb2p0i x1tgivj0 astryx-table"><thead><tr class="astryx-table-row x139im0d"><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Usage</th><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Price</th></tr></thead><tbody><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Image segmentation</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">$2.50 per 1,000 images</td></tr><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Video segmentation</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">$0.20 per 1,000 frames</td></tr></tbody></table></div></div>
        <h2 class="astryx-heading level-2 primary x1tgivj0 x1xvnhcw x1cpk1wn x12yy4cs x1lliihq p1pc3f07 p13fuv20 p6gwkdc p11xkdxz phrwaqf pep27e5 p1adxfkp pmsqn1h" data-level="2" data-color="primary" id="rate-limits"><a to="#rate-limits" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#rate-limits"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Rate limits</span></a></h2>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">Rate limits apply <strong>per team, not per API key</strong>: requests, tokens, and streams from every key in a team count toward the same limits. Each model below has its own limits, so traffic to one model doesn&#x27;t use up another&#x27;s.</p>
