2x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">None</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh"></td></tr><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh"><code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">muse-voice-transcribe-1.0</code></td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">None</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">None</td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">256 concurrent streams; 16,000 streams per hour</td></tr></tbody></table></div></div>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary"><a to="/docs/models#sam-3" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/models#sam-3"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">SAM 3.1</span></a> is <a to="#sam-pricing" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="#sam-pricing"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">billed per image or frame</span></a> and <a to="/docs/models#muse-image" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/models#muse-image"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">Muse Image</span></a> is <a to="#image-generation" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="#image-generation"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">priced per image</span></a>, so neither has a TPM limit.</p>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary"><a to="/docs/speech-to-text" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/speech-to-text"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">Muse Voice Transcribe</span></a> is <a to="#muse-voice-transcribe-pricing" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="#muse-voice-transcribe-pricing"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">billed by audio processed</span></a>, so it&#x27;s limited by streams rather than requests or tokens. <strong>Concurrent streams</strong> caps how many transcription sessions you hold open at once; <strong>streams per hour</strong> caps how many you start. Realtime and file transcription share the same budget.</p>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">Token usage counts only <strong>your</strong> input and output tokens. Meta injects a small amount of steering context into every prompt (a system prompt and related scaffolding); those injected tokens are not billed and are excluded from the token counts reported in your <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">usage</code> and by the <a to="/docs/token-counting#injected-tokens" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/token-counting#injected-tokens"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">token-counting endpoints</span></a>.</p>
        <h3 class="astryx-heading level-3 primary x1tgivj0 xii13ha xwjzt0u x1jcxfy8 x1lliihq p13rv44w p1p37lm5" data-level="3" data-color="primary" id="background-rate-limit"><a to="#background-rate-limit" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#background-rate-limit"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Background responses</span></a></h3>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">Creating <a to="/docs/protocols/responses#using-with-other-features" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/protocols/responses#using-with-other-features"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">background responses</span></a> (<code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">background: true</code>) is limited to <strong>600 submissions per minute, per team</strong>, in addition to the limits above. The cap applies only to starting new background responses: over it, new submissions return <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">HTTP 429 Too Many Requests</code> with a <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">Retry-After</code> header, and responses already running continue unaffected.</p>
        <h2 class="astryx-heading level-2 primary x1tgivj0 x1xvnhcw x1cpk1wn x12yy4cs x1lliihq p1pc3f07 p13fuv20 p6gwkdc p11xkdxz phrwaqf pep27e5 p1adxfkp pmsqn1h" data-level="2" data-color="primary" id="handle-rate-limits"><a to="#handle-rate-limits" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#handle-rate-limits"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Handle rate limits</span></a></h2>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">When you exceed a limit, the API rejects the request. Requests succeed again once usage drops below the limit.</p>
        <h3 class="astryx-heading level-3 primary x1tgivj0 xii13ha xwjzt0u x1jcxfy8 x1lliihq p13rv44w p1p37lm5" data-level="3" data-color="primary" id="rate-limit-behavior"><a to="#rate-limit-behavior" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#rate-limit-behavior"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Retry on 429 responses</span></a></h3>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary"><strong>Retry strategy:</strong> Use exponential backoff with jitter. Start with a short delay such as 500 ms, double it after each consecutive rate-limit response, and add random jitter so concurrent clients don&#x27;t all retry at the same moment. If the response includes a <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">Retry-After</code> header, wait at least that long.</p>
        <h3 class="astryx-heading level-3 primary x1tgivj0 xii13ha xwjzt0u x1jcxfy8 x1lliihq p13rv44w p1p37lm5" data-level="3" data-color="primary" id="rate-limit-headers"><a to="#rate-limit-headers" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#rate-limit-headers"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Read rate-limit headers</span></a></h3>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">Every successful token-based response includes headers that report your current limit and remaining quota:</p>
        <div class="astryx-card default x2kkz0m x153u1i6 x7giv3 x1p8z4y0 x1de1mus xw28qpl x9f619 xswhm3q x1mzf5mb xj1bl4l xwuefyo x1gu2k80 x91ghl5 x1i3qcxz xkunwnr x1litavf x1y0btm7 x14i3s5s xs19ii7 x12frdag x1nex4ik xbv1mwh p1ie71f1 p193iq5w peuugli ph8yej3" data-variant="default"><div tabindex="0" role="group" aria-label="Table" class="astryx-table-scroll-wrapper xw2csxc x5lxg6s xojxgvx x1fcf3bl xx6qvi6 xkibk3 xlayyun"><table class="astryx-base-table xh8yej3 x1mwwwfo x1gukg7c x1drmoe9 xjb2p0i x1tgivj0 astryx-table"><thead><tr class="astryx-table-row x139im0d"><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Header</th><th class="astryx-table-header-cell x2mo6ok xv1l7n4 x1yc453h xce4md1 xrrkdod xcr08ib x9f619 x92x3c3 x1q0q8m5 xw8gpjh xb3r6kr xlyipyv xuxw1ft x1m189uc x9bi00s xpilulx">Description</th></tr></thead><tbody><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh"><code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">x-ratelimit-limit-tokens</code></td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Total token budget for the current window.</td></tr><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh"><code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">x-ratelimit-remaining-tokens</code></td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Tokens remaining before you hit the limit.</td></tr><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh"><code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">x-ratelimit-limit-requests</code></td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Total request budget for the current window.</td></tr><tr class="astryx-table-row x139im0d"><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh"><code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">x-ratelimit-remaining-requests</code></td><td class="astryx-table-cell xce4md1 xrrkdod xjm74w1 x9f619 xb3r6kr x1mzt3pk x13faqbe x1m189uc x9bi00s xpilulx x16dsc37 x92x3c3 x1wp2rvj x1q0q8m5 xw8gpjh">Requests remaining before you hit the limit.</td></tr></tbody></table></div></div>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">Read these headers and slow down before you hit a rate limit instead of reacting after one.</p>
        <h3 class="astryx-heading level-3 primary x1tgivj0 xii13ha xwjzt0u x1jcxfy8 x1lliihq p13rv44w p1p37lm5" data-level="3" data-color="primary" id="muse-voice-transcribe-rate-limits"><a to="#muse-voice-transcribe-rate-limits" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#muse-voice-transcribe-rate-limits"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">Handle Muse Voice Transcribe rejections</span></a></h3>
        <p class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq pfo4z36 p1ewvobj" data-type="body" data-color="primary">A realtime stream rejected for exceeding a stream limit closes with <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">1013</code>. A rejected file-transcription request returns <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">HTTP 429 Too Many Requests</code>. Transcription responses don&#x27;t include the <code class="astryx-code primary x9m5x89 xp03k98 x15bjb6t xwmxj5m x7a5moj x1hp7d8q xx3sua9 x1mzt3pk x13faqbe x1tgivj0" data-color="primary">x-ratelimit-*</code> headers.</p>
        <h2 class="astryx-heading level-2 primary x1tgivj0 x1xvnhcw x1cpk1wn x12yy4cs x1lliihq p1pc3f07 p13fuv20 p6gwkdc p11xkdxz phrwaqf pep27e5 p1adxfkp pmsqn1h" data-level="2" data-color="primary" id="see-also"><a to="#see-also" class="astryx-link primary x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1hl2dhg x4ohgrr x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk x1tgivj0 x4z56r7" data-color="primary" href="#see-also"><span class="astryx-text inherit primary x1tgivj0 x1qlqyl8 x15bjb6t x1pd3egz xt0psk2" data-type="inherit" data-color="primary">See also</span></a></h2>
        <ul role="list" class="astryx-list compact disc x1ghz6dp x1c1uobl x3ct3a4 x78zum5 xdt5ytf x1lsbc85 xif0320 pfo4z36 peuugli p1ewvobj" data-density="compact" data-list-style="disc">
        <li class="astryx-item compact center x78zum5 x6s0dn4 x1n2onr6 x9f619 x1yc453h xh6dtrn xu0wf1k xfrknyr pnjsko4 pzye2dw astryx-list-item" data-density="compact" data-align="center"><span class="xoi2r2e x9f619 x78zum5 x6s0dn4 xl56j7k x2lah0s x12xnipv x1233pnv"><span class="x1v4s8kt xols6we x16rqkct x19aspcf"></span></span><span class="x78zum5 xdt5ytf x98rzlu xeuugli x1yc453h"><span class="x1tgivj0 xjm74w1 xw6l6zx"><div class="astryx-text body primary x1tgivj0 xjm74w1 xw6l6zx xxovm9e x1lliihq" data-type="body" data-color="primary"><a to="/docs/models" class="astryx-link accent x3nfvp2 x6s0dn4 x1lsbc85 xjb2p0i x1qlqyl8 x15bjb6t x1pd3egz x1ypdohk x1mpt4pi xuedmi6 xlr8y92 x17nn4n9 x1wfwxd8 x7s97pk xjse4m1 x17qfo7y x1bvjpef" data-color="accent" href="/docs/models"><span class="astryx-text body accent xjse4m1 xjm74w1 xw6l6zx xxovm9e xt0psk2" data-type="body" data-color="accent">Models</span></a>: every model line, its versions, and where each one is available</div></span></span></li>
