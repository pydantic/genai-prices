      content: |
        # Qwen3 Embedding 8B
        
        - **Type:** Embedding
        
        ## Overview
        
        The Qwen3 Embedding model series is the latest embeddings model in the Qwen family, specifically designed for text embedding and ranking tasks. Building upon the dense foundational models of the Qwen3 series, it provides a comprehensive range of text embeddings and reranking models in various sizes (0.6B, 4B, and 8B). This series inherits the exceptional multilingual capabilities, long-text understanding, and reasoning skills of its foundational model. The Qwen3 Embedding series represents significant advancements in multiple text embedding and ranking tasks, including text retrieval, code retrieval, text classification, text clustering, and bitext mining.
        
        **Exceptional Versatility**: The embedding model has achieved state-of-the-art performance across a wide range of downstream application evaluations. The 8B size embedding model ranks **No.1** in the MTEB multilingual leaderboard (as of June 5, 2025, score **70.58**), while the reranking model excels in various text retrieval scenarios.
        
        **Comprehensive Flexibility**: The Qwen3 Embedding series offers a full spectrum of sizes (from 0.6B to 8B) for both embedding and reranking models, catering to diverse use cases that prioritize efficiency and effectiveness. Developers can seamlessly combine these two modules. Additionally, the embedding model allows for flexible vector definitions across all dimensions, and both embedding and reranking models support user-defined instructions to enhance performance for specific tasks, languages, or scenarios.
        
        **Multilingual Capability**: The Qwen3 Embedding series offer support for over 100 languages, thanks to the multilingual capabilities of Qwen3 models. This includes various programming languages, and provides robust multilingual, cross-lingual, and code retrieval capabilities.
        
        **Qwen3-Embedding-8B** has the following features:
        
        - Model Type: Text Embedding
        - Supported Languages: 100+ Languages
        - Number of Parameters: 8B
        - Context Length: 32k
        - Embedding Dimension: Up to 4096, supports user-defined output dimensions ranging from 32 to 4096
        
        For more details, including benchmark evaluation, hardware requirements, and inference performance, please refer to our [blog](https://qwenlm.github.io/blog/qwen3-embedding/), [GitHub](https://github.com/QwenLM/Qwen3-Embedding).
        
        ## Pricing
        
        | Priority | Input Tokens (per 1M) | Cache Read Tokens (per 1M) | Output Tokens (per 1M) |
        |----------|------------------------|----------------------------|------------------------|
        | Realtime[^realtime-availability] | \$0.04 | \$0.04 | \$0.00 |
        | Async | \$0.03 | \$0.03 | \$0.00 |
        | Batch (24h) | \$0.02 | \$0.02 | \$0.00 |
        
        [^realtime-availability]: Realtime availability is limited. Doubleword is primarily a batch API.
