        # Gemma 4 31B IT
        
        - **Type:** Generation
        - **Capabilities:** `vision`, `reasoning`
        - **Cache read:** \$0.12 per 1M input tokens (1× standard input price). See [prompt caching](/inference-api/prompt-caching).
        
        ## Overview
        
        **Gemma 4 31B** is Google DeepMind’s most capable open model, built for advanced reasoning, coding, and multimodal understanding. It sits in the same general tier as **Claude 4.5 Haiku**
          and **NVIDIA Nemotron 3 Super**, with native function calling and structured JSON output for agentic workflows; strong image and video understanding for tasks like OCR and chart analysis;
          **256K context** for long documents and repositories; and support for **140+ languages**.
        
        ———
        
        **Multimodal Input**
        
        Gemma 4 supports multimodal input, so you can send images or videos together with text in a single request.
        
        *Image Example*
        
        ```
        "messages": [
          {
            "role": "user",
            "content": [
              {
                "type": "image_url",
                "image_url": {
                  "url": "https://example.com/image.jpg"
                }
              },
              {
                "type": "text",
                "text": "Describe this image."
              }
            ]
          }
        ]
        ```
        
        *Video Example*
        
        ```
        "messages": [
          {
            "role": "user",
            "content": [
              {
                "type": "video_url",
                "image_url": {
                  "url": "https://example.com/sample_video.mp4"
                }
              },
              {
                "type": "text",
                "text": "Summarize what happens in this video."
              }
            ]
          }
        ]
        ```
        
        ## Reasoning efforts
        
        - **Supported:** `none`, `minimal`, `low`, `medium`, `high`, `xhigh`, `max`
        
        See the [reasoning effort guide](/inference-api/reasoning-controls) for request examples.
        
