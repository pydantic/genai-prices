        Call hosted LLMs through endpoints compatible with the [OpenAI Chat Completions API](/reference/inference-api/chat-completions) and the [Anthropic Messages API](/reference/inference-api/messages) (beta). Point an existing OpenAI or Anthropic SDK at Baseten's inference endpoint. You do not need to deploy a model.
        
        Model APIs run a supported set of models on infrastructure managed by Baseten. Choose a [dedicated deployment](/development/model/build-your-first-model) when you need another model, dedicated GPUs, or control over hardware and scaling.
        
        ## Supported models
        
        Choose a model below, then [run inference](#run-inference) with its slug.
        
        <Note>
          Context and output limits can differ from a model's advertised maximum. Use the limits in this table when configuring requests. The [`/v1/models`](#list-available-models) catalog can report different values from the limits enforced by the endpoint.
        </Note>
        
        <SupportedModelsTable />
        
        Fast variants use the same weights as their base models with dedicated capacity for higher sustained throughput. They use separate slugs, pricing, and rate limits. When Fast capacity is unavailable, Baseten uses base-model capacity.
        
        ## Feature support
        
        All Model APIs support [tool calling](/inference/function-calling). All except Muse Spark Open support [structured outputs](/inference/structured-outputs) and [JSON mode](/inference/json-mode). The table lists model-specific support for [reasoning](/inference/model-apis/reasoning), [vision](/inference/model-apis/vision), and sampling parameters. Muse Spark Open also supports [audio input](/inference/model-apis/audio). [Web search](/inference/model-apis/web-search) is available in early access on enabled workspaces and models.
        
        <FeatureSupportTable />
        
        ### Defaults and limitations
        
        Muse Spark Open accepts `logprobs` and `top_logprobs` but ignores them and returns no log probabilities. It supports one response per prompt; `n` greater than 1 returns HTTP 400. Neither `seed` nor `temperature: 0` guarantees reproducible output.
        
        ## Run inference
        
        Choose the OpenAI Chat Completions API or the Anthropic Messages API, then set the base URL, API key, and [model slug](#supported-models).
        
        ### Use the OpenAI SDK
        
        The [OpenAI Chat Completions API](/reference/inference-api/chat-completions) is available at `https://inference.baseten.co/v1/chat/completions`.
        
        <Tabs>
          <Tab title="Python">
            **To call a model with the Chat Completions API**:
        
            ```python chat_completions.py theme={"system"}
            from openai import OpenAI
            import os
        
            client = OpenAI(
                base_url="https://inference.baseten.co/v1",
                api_key=[FILTERED]
            )
        
            response = client.chat.completions.create(
                model="zai-org/GLM-5.3",
                extra_headers={"x-session-affinity": "YOUR_SESSION_ID"},
                messages=[
                    {"role": "system", "content": "You are a concise technical writer."},
                    {"role": "user", "content": "What is gradient descent?"},
                    {"role": "assistant", "content": "An optimization algorithm that iteratively adjusts model parameters by moving in the direction of steepest decrease in the loss function."},
                    {"role": "user", "content": "How does the learning rate affect it?"}
                ],
            )
        
            print(response.choices[0].message.content)
            ```
          </Tab>
        
          <Tab title="JavaScript">
            **To call a model with the Chat Completions API**:
        
            ```javascript chat_completions.js theme={"system"}
            import OpenAI from "openai";
        
            const client = new OpenAI({
                baseURL: "https://inference.baseten.co/v1",
                apiKey: process.env.BASETEN_API_KEY,
            });
        
            const response = await client.chat.completions.create({
                model: "zai-org/GLM-5.3",
                messages: [
                    { role: "system", content: "You are a concise technical writer." },
                    { role: "user", content: "What is gradient descent?" },
                    { role: "assistant", content: "An optimization algorithm that iteratively adjusts model parameters by moving in the direction of steepest decrease in the loss function." },
                    { role: "user", content: "How does the learning rate affect it?" }
                ],
            });
        
            console.log(response.choices[0].message.content);
            ```
          </Tab>
        
          <Tab title="cURL">
            **To call a model with the Chat Completions API**:
        
            ```bash Request theme={"system"}
            curl https://inference.baseten.co/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $BASETEN_API_KEY" \
              -d '{
                "model": "zai-org/GLM-5.3",
                "messages": [
                  {"role": "system", "content": "You are a concise technical writer."},
                  {"role": "user", "content": "What is gradient descent?"},
                  {"role": "assistant", "content": "An optimization algorithm that iteratively adjusts model parameters by moving in the direction of steepest decrease in the loss function."},
                  {"role": "user", "content": "How does the learning rate affect it?"}
                ]
              }'
            ```
          </Tab>
        
          <Tab title="Baseten CLI">
            **To call a model with the Chat Completions API**:
        
            With the [Baseten CLI](/reference/cli/baseten/overview) installed and signed in, `--content` sends a single user message and prints the assistant's reply:
        
            ```bash theme={"system"}
            baseten model-api predict --model zai-org/GLM-5.3 --content "What is gradient descent?"
            ```
        
            For multi-message conversations like the examples above, send the full body with `--data`. See [`model-api predict`](/reference/cli/baseten/model-api#predict) for the full flag set.
          </Tab>
        </Tabs>
        
        Replace the example slug with any model from the [supported models](#supported-models) table.
        Reuse the same `x-session-affinity` value for related requests to improve [cached input tokens](/inference/model-apis/pricing-and-limits#cached-input-tokens) reuse.
        We recommend at most \~60 requests/min sent via the same session.
        
        ### Use the Anthropic SDK
        
        The [Anthropic Messages API](/reference/inference-api/messages) is available at `https://inference.baseten.co/v1/messages`.
        
        <Note>
          Anthropic Messages API support is in **beta**. Behavior may change before general availability. For production workloads, use the [OpenAI Chat Completions API](/reference/inference-api/chat-completions).
        </Note>
        
        The Anthropic SDK sends the API key as `x-api-key` by default. Baseten reads `Authorization`, so override `default_headers` as shown.
        
        <Tabs>
          <Tab title="Python">
            **To call a model with the Messages API**:
        
            ```python messages_api.py theme={"system"}
            import anthropic
            import os
        
            API_KEY = os.environ["BASETEN_API_KEY"]
        
            client = anthropic.Anthropic(
                base_url="https://inference.baseten.co",
                api_key=[FILTERED]
                default_headers={"Authorization": f"Bearer {API_KEY}"},
            )
        
            response = client.messages.create(
                model="zai-org/GLM-5.3",
                max_tokens=4096,
                system="You are a concise technical writer.",
                messages=[
                    {"role": "user", "content": "What is gradient descent?"},
                    {"role": "assistant", "content": "An optimization algorithm that iteratively adjusts model parameters by moving in the direction of steepest decrease in the loss function."},
                    {"role": "user", "content": "How does the learning rate affect it?"}
                ],
            )
        
            for block in response.content:
                if block.type == "text":
                    print(block.text)
            ```
          </Tab>
        
          <Tab title="JavaScript">
            **To call a model with the Messages API**:
        
            ```javascript messages_api.js theme={"system"}
            import Anthropic from "@anthropic-ai/sdk";
        
            const apiKey = process.env.BASETEN_API_KEY;
        
            const client = new Anthropic({
                baseURL: "https://inference.baseten.co",
                apiKey: apiKey,
                defaultHeaders: { Authorization: `Bearer ${apiKey}` },
            });
        
            const response = await client.messages.create({
                model: "zai-org/GLM-5.3",
                max_tokens: 4096,
                system: "You are a concise technical writer.",
                messages: [
                    { role: "user", content: "What is gradient descent?" },
                    { role: "assistant", content: "An optimization algorithm that iteratively adjusts model parameters by moving in the direction of steepest decrease in the loss function." },
                    { role: "user", content: "How does the learning rate affect it?" }
                ],
            });
        
            for (const block of response.content) {
                if (block.type === "text") console.log(block.text);
            }
            ```
          </Tab>
        
          <Tab title="cURL">
            **To call a model with the Messages API**:
        
            ```bash Request theme={"system"}
            curl https://inference.baseten.co/v1/messages \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $BASETEN_API_KEY" \
              -d '{
                "model": "zai-org/GLM-5.3",
                "max_tokens": 4096,
                "system": "You are a concise technical writer.",
                "messages": [
                  {"role": "user", "content": "What is gradient descent?"},
                  {"role": "assistant", "content": "An optimization algorithm that iteratively adjusts model parameters by moving in the direction of steepest decrease in the loss function."},
                  {"role": "user", "content": "How does the learning rate affect it?"}
                ]
              }'
            ```
          </Tab>
        </Tabs>
        
        ## List available models
        
        List the current model catalog and metadata, including pricing, context windows, and supported features, with [`baseten model-api list`](/reference/cli/baseten/model-api#list) or the `/v1/models` REST endpoint:
        
        <CodeGroup>
          ```sh Baseten CLI theme={"system"}
          baseten model-api list
          ```
        
          ```sh REST API theme={"system"}
          curl https://inference.baseten.co/v1/models \
            -H "Authorization: Bearer $BASETEN_API_KEY"
          ```
        </CodeGroup>
        
        Describe a single model's details with [`baseten model-api describe`](/reference/cli/baseten/model-api#describe):
        
        ```sh theme={"system"}
        baseten model-api describe --model <slug>
        ```
        
        ## Migrate
        
        To migrate to Baseten, change the base URL, API key, and model name.
        
        <Tabs>
          <Tab title="OpenAI SDK">
            **To migrate from the OpenAI SDK**:
        
            1. Replace your OpenAI API key with a [Baseten API key](https://app.baseten.co/settings/api_keys).
            2. Change the base URL to `https://inference.baseten.co/v1`.
            3. Update the model name to a Baseten model slug.
        
            ```python migrate.py theme={"system"}
            from openai import OpenAI
            import os
        
            client = OpenAI(
                base_url="https://inference.baseten.co/v1",  # [!code ++]
                api_key=[FILTERED]  # [!code ++]
            )
        
            response = client.chat.completions.create(
                model="zai-org/GLM-5.3",  # [!code ++]
                messages=[{"role": "user", "content": "Hello"}]
            )
            ```
          </Tab>
        
          <Tab title="Anthropic SDK">
            **To migrate from the Anthropic SDK**:
        
            1. Replace your Anthropic API key with a [Baseten API key](https://app.baseten.co/settings/api_keys).
            2. Change the base URL to `https://inference.baseten.co`.
            3. Override `default_headers` so the SDK sends `Authorization` instead of `x-api-key`.
            4. Update the model name to a [supported Baseten model slug](#supported-models).
        
            ```python migrate.py theme={"system"}
            import anthropic
            import os
        
            API_KEY = os.environ["BASETEN_API_KEY"]
        
            client = anthropic.Anthropic(
                base_url="https://inference.baseten.co",  # [!code ++]
                api_key=[FILTERED]  # [!code ++]
                default_headers={"Authorization": f"Bearer {API_KEY}"},  # [!code ++]
            )
        
            response = client.messages.create(
                model="zai-org/GLM-5.3",  # [!code ++]
                max_tokens=1024,
                messages=[{"role": "user", "content": "Hello"}]
            )
            ```
          </Tab>
        </Tabs>
        
        ## Handle errors
        
        Model API requests can return the following HTTP error codes:
        
        | Code | Meaning |
        | - | - |
        | 400 | Invalid request (check your parameters) |
        | 401 | Invalid or missing API key |
        | 402 | Payment required |
        | 404 | Model not found |
        | 429 | Rate limit exceeded |
        | 500 | Internal server error |
        | 529 | Overloaded; retry with backoff |
        
