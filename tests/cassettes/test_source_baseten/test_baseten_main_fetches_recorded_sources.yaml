hitespace-pre leading-6"><pre class="shiki shiki-themes github-light-default dark-plus" style="background-color:#ffffff;--shiki-dark-bg:#0B0C0E;color:#1f2328;--shiki-dark:#D4D4D4" language="shellscript"><code language="shellscript" numberOfLines="1"><span class="line"><span style="color:#953800;--shiki-dark:#DCDCAA">baseten</span><span style="color:#0A3069;--shiki-dark:#CE9178"> model-api</span><span style="color:#0A3069;--shiki-dark:#CE9178"> describe</span><span style="color:#0550AE;--shiki-dark:#569CD6"> --model</span><span style="color:#0A3069;--shiki-dark:#CE9178"> zai-org/GLM-5.3</span></span>
