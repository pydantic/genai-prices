        <span data-as="p">Read the answer from <code>content</code> blocks with <code>type: &quot;text&quot;</code>; other blocks can contain thinking or tool calls. Check <code>stop_reason</code>: <code>end_turn</code> ends ordinary text generation, <code>tool_use</code> hands control to a tool, and <code>max_tokens</code> means the output limit interrupted generation. For more information, see <a href="/inference/errors#streaming-responses" class="link">stream completion and recovery</a>.</span>
        <span data-as="p">For related requests, use a stable <a href="/inference/model-apis/pricing-and-limits#session-affinity" class="link">session affinity ID</a> to improve cache reuse. Session affinity controls routing; continue to send the conversation history with each request.</span>
        <span data-as="p">For more information, see the <a href="/reference/inference-api/messages" class="link">Messages API reference</a>.</span>
