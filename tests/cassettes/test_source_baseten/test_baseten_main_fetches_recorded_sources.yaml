        <span data-as="p">To inspect a model’s details with <a href="/reference/cli/baseten/model-api#describe" class="link"><code>baseten model-api describe</code></a>, run the following command. Replace <code>zai-org/GLM-5.3</code> with the model’s slug:</span>
        <div class="code-block mt-5 mb-8 not-prose rounded-2xl relative group min-w-0 print:print-color-exact text-gray-950 dark:text-gray-50 codeblock-light border border-gray-950/10 dark:border-white/10 dark:twoslash-dark bg-transparent dark:bg-transparent" data-has-floating-buttons="" numberOfLines="1" language="shellscript"><div data-floating-buttons="true" class="absolute top-3 right-4 flex items-center gap-1.5 print:hidden"><div class="z-10 select-none" id="base-ui-_R_faqkldfehkd74t9_" data-base-ui-tooltip-trigger=""><button class="size-6.5 flex items-center justify-center rounded-md group/code-snippet-feedback-button [.code-block_[data-floating-buttons]_&amp;]:bg-gray-100 dark:[.code-block_[data-floating-buttons]_&amp;]:bg-gray-800 [.code-block:has([data-fade-overlay])_[data-floating-buttons]_&amp;]:bg-transparent dark:[.code-block:has([data-fade-overlay])_[data-floating-buttons]_&amp;]:bg-transparent" id="code-snippet-feedback-button" aria-label="Report incorrect code"><svg aria-hidden="true" width="18" height="18" stroke-width="1.5" class="size-4 shrink-0 text-gray-400 group-hover/code-snippet-feedback-button:text-gray-500 dark:text-white/40 dark:group-hover/code-snippet-feedback-button:text-white/60"><use href="#mi-mint-1-Report"></use></svg></button></div><div class="code-block-copy-button z-10 select-none" id="base-ui-_R_fiqkldfehkd74t9_" data-base-ui-tooltip-trigger=""><button class="size-6.5 flex items-center justify-center rounded-md group/copy-button [.code-block_[data-floating-buttons]_&amp;]:bg-gray-100 dark:[.code-block_[data-floating-buttons]_&amp;]:bg-gray-800 [.code-block:has([data-fade-overlay])_[data-floating-buttons]_&amp;]:bg-transparent dark:[.code-block:has([data-fade-overlay])_[data-floating-buttons]_&amp;]:bg-transparent" data-testid="copy-code-button" aria-label="Copy the contents from the code block"><svg aria-hidden="true" width="18" height="18" stroke-width="1.5" class="size-4 shrink-0 text-gray-400 group-hover/copy-button:text-gray