        <span data-as="p">The Messages endpoint is <code>https://inference.baseten.co/v1/messages</code>. Set the Anthropic SDK’s base URL to <code>https://inference.baseten.co</code>. The SDK sends <code>x-api-key</code> by default; override its default headers to send your Baseten API key in <code>Authorization</code>.</span>
