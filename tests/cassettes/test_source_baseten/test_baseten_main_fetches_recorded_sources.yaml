dden="true" class="absolute inset-0 pointer-events-none"></div><button type="button" class="flex items-center justify-between w-full p-6 gap-4" id="accordion-heading-2" aria-controls="accordion-content-2" aria-label="Do you offer free credits to get started?" aria-expanded="false" tabindex="0"><h3 class="!text-pretty font-neue text-r-h4-mobile-reg font-semibold md:text-r-h4-semi text-start">Do you offer free credits to get started?</h3><svg width="1.5em" height="1.5em" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor" class="transition-transform duration-75 shrink-0 size-5" aria-hidden="true"><path d="M6 15L12 9L18 15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><div class="overflow-hidden transition-height duration-300 [transition-timing-function:cubic-bezier(0.87,0,0.13,1)] h-[var(--height)] invisible" style="--height:0px" role="tabpanel" id="accordion-content-2" aria-labelledby="accordion-heading-2" tabindex="-1"><div class="px-6 pt-3 pb-6 lg:max-w-[90%]"><div class="min-h-[280px]"><span class="[&amp;_b]:md:font-semibold [&amp;_strong]:md:font-semibold font-neue !text-r-ps-reg [&amp;_a]:underline text-b-fills-800"><p>Yes, new Baseten accounts come with credits so you can get to know the UI and experiment with deployments for free. </p></span></div></div></div></div><div class="relative hover:bg-white transition-colors duration-75 z-10" role="tab" aria-selected="false" aria-expanded="false"><div aria-hidden="true" class="absolute inset-0 pointer-events-none"></div><button type="button" class="flex items-center justify-between w-full p-6 gap-4" id="accordion-heading-3" aria-controls="accordion-content-3" aria-label="Is Baseten secure?" aria-expanded="false" tabindex="0"><h3 class="!text-pretty font-neue text-r-h4-mobile-reg font-semibold md:text-r-h4-semi text-start">Is Baseten secure?</h3><svg width="1.5em" height="1.5em" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor" class="transition-transform duration-75 shrink-0 size-5" aria-hidden="true"><path d="M6 15L12 9L18 15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><div class="overflow-hidden transition-height duration-300 [transition-timing-function:cubic-bezier(0.87,0,0.13,1)] h-[var(--height)] invisible" style="--height:0px" role="tabpanel" id="accordion-content-3" aria-labelledby="accordion-heading-3" tabindex="-1"><div class="px-6 pt-3 pb-6 lg:max-w-[90%]"><div class="min-h-[280px]"><span class="[&amp;_b]:md:font-semibold [&amp;_strong]:md:font-semibold font-neue !text-r-ps-reg [&amp;_a]:underline text-b-fills-800"><p>Yes, Baseten is SOC 2 Type II certified and HIPAA compliant. <a href="https://www.baseten.co/blog/soc-2-type-2/">You can read more about our SOC 2 Type II certification here</a>. And <a href="https://www.baseten.co/blog/baseten-announces-hipaa-compliance/">you can read more about our HIPAA compliance here</a>.</p></span></div></div></div></div><div class="relative hover:bg-white transition-colors duration-75 z-10" role="tab" aria-selected="false" aria-expanded="false"><div aria-hidden="true" class="absolute inset-0 pointer-events-none"></div><button type="button" class="flex items-center justify-between w-full p-6 gap-4" id="accordion-heading-4" aria-controls="accordion-content-4" aria-label="Do I pay for idle time on Baseten?" aria-expanded="false" tabindex="0"><h3 class="!text-pretty font-neue text-r-h4-mobile-reg font-semibold md:text-r-h4-semi text-start">Do I pay for idle time on Baseten?</h3><svg width="1.5em" height="1.5em" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor" class="transition-transform duration-75 shrink-0 size-5" aria-hidden="true"><path d="M6 15L12 9L18 15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><div class="overflow-hidden transition-height duration-300 [transition-timing-function:cubic-bezier(0.87,0,0.13,1)] h-[var(--height)] invisible" style="--height:0px" role="tabpanel" id="accordion-content-4" aria-labelledby="accordion-heading-4" tabindex="-1"><div class="px-6 pt-3 pb-6 lg:max-w-[90%]"><div class="min-h-[280px]"><span class="[&amp;_b]:md:font-semibold [&amp;_strong]:md:font-semibold font-neue !text-r-ps-reg [&amp;_a]:underline text-b-fills-800"><p>No, you do not pay for idle time – you only pay for the time your model is using compute on Baseten. This includes the time your model is actively deploying, scaling up or down, or making predictions. And <a rel="noopener" target="_blank" href="https://docs.baseten.co/deploy/autoscaling">you have full control</a> over how your model scales up or down.<!-- --></p></span></div></div></div></div><div class="relative hover:bg-white transition-colors duration-75 z-10" role="tab" aria-selected="false" aria-expanded="false"><div aria-hidden="true" class="absolute inset-0 pointer-events-none"></div><button type="button" class="flex items-center justify-between w-full p-6 gap-4" id="accordion-heading-5" aria-controls="accordion-content-5" aria-label="What level of customer support do you offer?" aria-expanded="false" tabindex="0"><h3 class="!text-pretty font-neue text-r-h4-mobile-reg font-semibold md:text-r-h4-semi text-start">What level of customer support do you offer?</h3><svg width="1.5em" height="1.5em" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor" class="transition-transform duration-75 shrink-0 size-5" aria-hidden="true"><path d="M6 15L12 9L18 15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><div class="overflow-hidden transition-height duration-300 [transition-timing-function:cubic-bezier(0.87,0,0.13,1)] h-[var(--height)] invisible" style="--height:0px" role="tabpanel" id="accordion-content-5" aria-labelledby="accordion-heading-5" tabindex="-1"><div class="px-6 pt-3 pb-6 lg:max-w-[90%]"><div class="min-h-[280px]"><span class="[&amp;_b]:md:font-semibold [&amp;_strong]:md:font-semibold font-neue !text-r-ps-reg [&amp;_a]:underline text-b-fills-800"><p>Customer support levels vary by plan. We offer email, in-app chat, Slack, and Zoom support. We also offer dedicated forward-deployed engineering support. <a href="https://www.baseten.co/talk-to-us/">Reach out to our team</a> to figure out a customer support level that works for your needs.</p></span></div></div></div></div><div class="relative hover:bg-white transition-colors duration-75 z-10" role="tab" aria-selected="false" aria-expanded="false"><div aria-hidden="true" class="absolute inset-0 pointer-events-none"></div><button type="button" class="flex items-center justify-between w-full p-6 gap-4" id="accordion-heading-6" aria-controls="accordion-content-6" aria-label="Do you offer discounts on compute?" aria-expanded="false" tabindex="0"><h3 class="!text-pretty font-neue text-r-h4-mobile-reg font-semibold md:text-r-h4-semi text-start">Do you offer discounts on compute?</h3><svg width="1.5em" height="1.5em" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor" class="transition-transform duration-75 shrink-0 size-5" aria-hidden="true"><path d="M6 15L12 9L18 15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><div class="overflow-hidden transition-height duration-300 [transition-timing-function:cubic-bezier(0.87,0,0.13,1)] h-[var(--height)] invisible" style="--height:0px" role="tabpanel" id="accordion-content-6" aria-labelledby="accordion-heading-6" tabindex="-1"><div class="px-6 pt-3 pb-6 lg:max-w-[90%]"><div class="min-h-[280px]"><span class="[&amp;_b]:md:font-semibold [&amp;_strong]:md:font-semibold font-neue !text-r-ps-reg [&amp;_a]:underline text-b-fills-800"><p>Yes, discounts on compute can be negotiated as part of our Pro and Enterprise plans. <a href="https://www.baseten.co/talk-to-us/">Reach out to our team</a> to learn more.</p></span></div></div></div></div><div class="relative hover:bg-white transition-colors duration-75 z-10" role="tab" aria-selected="false" aria-expanded="false"><div aria-hidden="true" class="absolute inset-0 pointer-events-none"></div><button type="button" class="flex items-center justify-between w-full p-6 gap-4" id="accordion-heading-7" aria-controls="accordion-content-7" aria-label="Can I deploy Baseten on my own infrastructure?" aria-expanded="false" tabindex="0"><h3 class="!text-pretty font-neue text-r-h4-mobile-reg font-semibold md:text-r-h4-semi text-start">Can I deploy Baseten on my own infrastructure?</h3><svg width="1.5em" height="1.5em" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="currentColor" class="transition-transform duration-75 shrink-0 size-5" aria-hidden="true"><path d="M6 15L12 9L18 15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><div class="overflow-hidden transition-height duration-300 [transition-timing-function:cubic-bezier(0.87,0,0.13,1)] h-[var(--height)] invisible" style="--height:0px" role="tabpanel" id="accordion-content-7" aria-labelledby="accordion-heading-7" tabindex="-1"><div class="px-6 pt-3 pb-6 lg:max-w-[90%]"><div class="min-h-[280px]"><span class="[&amp;_b]:md:font-semibold [&amp;_strong]:md:font-semibold font-neue !text-r-ps-reg [&amp;_a]:underline text-b-fills-800"><p>Yes, you can self-host Baseten in order to manage security and use your own cloud commitments. <a href="https://www.baseten.co/talk-to-us/">Talk to our engineers</a> to learn more.</p></span></div></div></div></div></div><div aria-hidden="true" class="absolute inset-0 pointer-events-none z-20 px-3"></div></div></div></div></section><!--$--><!--/$--><section class="relative overflow-hidden pt-[1px]"><section class="bg-b-fills-100 relative -mt-[1px] opacity-0 h-[96px] md:h-[96px] lg:h-