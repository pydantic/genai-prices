        <h2 class="flex whitespace-pre-wrap group font-semibold" id="migrate"><div class="absolute" tabindex="-1"><a href="#migrate" class="-ml-10 flex items-center opacity-0 border-0 group-hover:opacity-100 focus:opacity-100 focus:outline-0 group/link" aria-label="Navigate to header">​<div class="size-6 rounded-md flex items-center justify-center shadow-xs text-gray-400 dark:text-white/50 dark:bg-background-dark dark:brightness-[1.35] dark:ring-1 dark:hover:brightness-150 bg-white ring-1 ring-gray-400/30 dark:ring-gray-700/25 hover:ring-gray-400/60 dark:hover:ring-white/20 group-focus/link:border-2 group-focus/link:border-primary dark:group-focus/link:border-primary-light"><svg aria-hidden="true" width="18" height="18" stroke-width="2" class="size-3 shrink-0"><use href="#mi-mint-1-Link"></use></svg></div></a></div><span class="min-w-0 break-words cursor-pointer">Migrate</span></h2>
        <span data-as="p">To connect an existing application to Model APIs:</span>
        <ol>
        <li>
        <span data-as="p">Replace your provider’s key with a <a href="/organization/api-keys" class="link">Baseten API key</a>.</span>
        </li>
        <li>
        <span data-as="p">Configure your client’s base URL and authentication for its API format:</span>
        <!-- --><div role="presentation" style="position:relative;--scroll-area-corner-height:0px;--scroll-area-corner-width:0px" data-component-part="scroll-area" data-table-wrapper="true" class="min-w-0 [--page-padding:16px] flex w-[calc(100%+(var(--page-padding)*2))] my-[1em] py-[1em] -mx-(--page-padding) max-w-none [contain:inline-size]"><div data-id="base-ui-_R_12bcldfehkd74t9_-viewport" tabindex="-1" class="size-full rounded-[inherit] [--scroll-area-fade-size:32px] overflow-y-hidden! base-ui-disable-scrollbar" style="overflow:scroll" data-component-part="scroll-area-viewport" role="region" aria-label="Scrollable table"><div role="presentation" style="min-width:fit-content" data-component-part="scroll-area-content" class="flex"><div class="px-(--page-padding) grow max-w-none table"><table class="m-0 min-w-full w-full max-w-none table [&amp;_th]:text-left [&amp;_td[data-numeric]]:tabular-nums [&amp;_td]:min-w-[150px]"><thead><tr><th>Client</th><th>Base URL</th><th>Authentication</th></tr></thead><tbody><tr><td>OpenAI SDK, Chat Completions or Responses</td><td><code>https://inference.baseten.co/v1</code></td><td>Pass the Baseten key as <code>api_key</code> in Python or <code>apiKey</code> in JavaScript.</td></tr><tr><td>Anthropic SDK, Messages (beta)</td><td><code>https://inference.baseten.co</code></td><td>Pass the Baseten key and override the default headers to send <code>Authorization: Bearer &lt;BASETEN_API_KEY&gt;</code>.</td></tr></tbody></table></div></div></div></div>
        </li>
        <li>
        <span data-as="p">Set <code>model</code> to a <a href="#supported-models" class="link">supported slug</a> and check its <a href="#feature-support" class="link">feature support</a> and <a href="/inference/model-apis/reasoning" class="link">reasoning controls</a>.</span>
        </li>
        <li>
        <span data-as="p">Send a test request using the matching <a href="/reference/inference-api/chat-completions" class="link">Chat Completions</a>, <a href="/reference/inference-api/responses" class="link">Responses</a>, or <a href="/reference/inference-api/messages" class="link">Messages</a> example. Check the answer and token usage before switching your application’s traffic.</span>
        </li>
        </ol>
        <span data-as="p">The API format defines the request shape. The model determines which features and parameter values work. Check the model’s limits and behavior when changing models, even if you keep the same client.</span>
        <h2 class="flex whitespace-pre-wrap group font-semibold" id="handle-errors"><div class="absolute" tabindex="-1"><a href="#handle-errors" class="-ml-10 flex items-center opacity-0 border-0 group-hover:opacity-100 focus:opacity-100 focus:outline-0 group/link" aria-label="Navigate to header">​<div class="size-6 rounded-md flex items-center justify-center shadow-xs text-gray-400 dark:text-white/50 dark:bg-background-dark dark:brightness-[1.35] dark:ring-1 dark:hover:brightness-150 bg-white ring-1 ring-gray-400/30 dark:ring-gray-700/25 hover:ring-gray-400/60 dark:hover:ring-white/20 group-focus/link:border-2 group-focus/link:border-primary dark:group-focus/link:border-primary-light"><svg aria-hidden="true" width="18" height="18" stroke-width="2" class="size-3 shrink-0"><use href="#mi-mint-1-Link"></use></svg></div></a></div><span class="cursor-pointer">Handle errors</span></h2>
        <span data-as="p">Model API requests can return the following HTTP error codes:</span>
        <!-- --><div role="presentation" style="position:relative;--scroll-area-corner-height:0px;--scroll-area-corner-width:0px" data-component-part="scroll-area" data-table-wrapper="true" class="min-w-0 [--page-padding:16px] flex w-[calc(100%+(var(--page-padding)*2))] my-[1em] py-[1em] -mx-(--page-padding) max-w-none [contain:inline-size]"><div data-id="base-ui-_R_ccldfehkd74t9_-viewport" tabindex="-1" class="size-full rounded-[inherit] [--scroll-area-fade-size:32px] overflow-y-hidden! base-ui-disable-scrollbar" style="overflow:scroll" data-component-part="scroll-area-viewport" role="region" aria-label="Scrollable table"><div role="presentation" style="min-width:fit-content" data-component-part="scroll-area-content" class="flex"><div class="px-(--page-padding) grow max-w-none table"><table class="m-0 min-w-full w-full max-w-none table [&amp;_th]:text-left [&amp;_td[data-numeric]]:tabular-nums [&amp;_td]:min-w-[150px]"><thead><tr><th>Code</th><th>Meaning</th></tr></thead><tbody><tr><td data-numeric="true">400</td><td>Invalid request (check your parameters)</td></tr><tr><td data-numeric="true">401</td><td>Invalid or missing API key</td></tr><tr><td data-numeric="true">402</td><td>Payment required</td></tr><tr><td data-numeric="true">404</td><td>Model not found</td></tr><tr><td data-numeric="true">429</td><td>Rate limit exceeded</td></tr><tr><td data-numeric="true">500</td><td>Internal server error</td></tr><tr><td data-numeric="true">529</td><td>Overloaded; retry with backoff</td></tr></tbody></table></div></div></div></div>
        <span data-as="p">HTTP error responses include a JSON body with details about the failure. Once streaming starts, a request can fail without a new HTTP status or an error object. See <a href="/inference/errors#streaming-responses" class="link">streaming completion markers and recovery</a>.</span>
