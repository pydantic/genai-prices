den="true" class="invisible col-start-1 row-start-1">Copy page</span><span class="col-start-1 row-start-1">Copy page</span></span></div></button><button type="button" tabindex="0" aria-haspopup="menu" aria-expanded="false" id="base-ui-_R_6phdfehkd74t9_" aria-label="More actions" class="group disabled:pointer-events-none [&amp;&gt;span]:line-clamp-1 overflow-hidden group focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-primary dark:focus-visible:outline-primary-light py-0.5 gap-1 text-sm text-gray-950/50 dark:text-white/50 group-hover:text-gray-950/70 dark:group-hover:text-white/70 rounded-none rounded-r-xl border flex items-center justify-center h-[34px] border-gray-200 aspect-square dark:border-white/[0.07] bg-background-light dark:bg-background-dark hover:bg-gray-600/5 dark:hover:bg-gray-200/5"><svg aria-hidden="true" width="18" height="18" stroke-width="2" focusable="false" class="size-3 transition-transform text-gray-400 group-hover:text-gray-600 dark:text-gray-600 dark:group-hover:text-gray-400 shrink-0 rotate-90"><use href="#mi-mint-1-ChevronRight"></use></svg></button></div></header><div class="mdx-content @container/columns-container relative mt-8 prose prose-gray dark:prose-invert [contain:inline-size] isolate empty:hidden mb-14" data-page-title="Model APIs" data-page-href="/inference/model-apis/overview" id="content"><span data-as="p">Call hosted language models and decision models without deploying a model. Baseten manages the serving infrastructure; you send requests with a <a href="/organization/api-keys" class="link">Baseten API key</a>.</span>
        <span data-as="p">Language models support:</span>
        <ul>
        <li><a href="/reference/inference-api/chat-completions" class="link">OpenAI Chat Completions</a>.</li>
        <li><a href="/reference/inference-api/responses" class="link">OpenAI Responses</a>.</li>
        <li><a href="/reference/inference-api/messages" class="link">Anthropic Messages</a> (beta).</li>
        </ul>
        <span data-as="p">Decision models use the <a href="/reference/inference-api/system-one" class="link">System One API</a> to classify, route, and score inputs.</span>
        <h2 class="flex whitespace-pre-wrap group font-semibold" id="choose-how-to-start"><div class="absolute" tabindex="-1"><a href="#choose-how-to-start" class="-ml-10 flex items-center opacity-0 border-0 group-hover:opacity-100 focus:opacity-100 focus:outline-0 group/link" aria-label="Navigate to header">​<div class="size-6 rounded-md flex items-center justify-center shadow-xs text-gray-400 dark:text-white/50 dark:bg-background-dark dark:brightness-[1.35] dark:ring-1 dark:hover:brightness-150 bg-white ring-1 ring-gray-400/30 dark:ring-gray-700/25 hover:ring-gray-400/60 dark:hover:ring-white/20 group-focus/link:border-2 group-focus/link:border-primary dark:group-focus/link:border-primary-light"><svg aria-hidden="true" width="18" height="18" stroke-width="2" class="size-3 shrink-0"><use href="#mi-mint-1-Link"></use></svg></div></a></div><span class="cursor-pointer">Choose how to start</span></h2>
        <!-- --><div role="presentation" style="position:relative;--scroll-area-corner-height:0px;--scroll-area-corner-width:0px" data-component-part="scroll-area" data-table-wrapper="true" class="min-w-0 [--page-padding:16px] flex w-[calc(100%+(var(--page-padding)*2))] my-[1em] py-[1em] -mx-(--page-padding) max-w-none [contain:inline-size]"><div data-id="base-ui-_R_1cldfehkd74t9_-viewport" tabindex="-1" class="size-full rounded-[inherit] [--scroll-area-fade-size:32px] overflow-y-hidden! base-ui-disable-scrollbar" style="overflow:scroll" data-component-part="scroll-area-viewport" role="region" aria-label="Scrollable table"><div role="presentation" style="min-width:fit-content" data-component-part="scroll-area-content" class="flex"><div class="px-(--page-padding) grow max-w-none table"><table class="m-0 min-w-full w-full max-w-none table [&amp;_th]:text-left [&amp;_td[data-numeric]]:tabular-nums [&amp;_td]:min-w-[150px]"><thead><tr><th>Your goal</th><th>Start here</th></tr></thead><tbody><tr><td>Make your first API call</td><td>Follow the <a href="/quickstart" class="link">quickstart</a> to create a key and send a request.</td></tr><tr><td>Connect an existing application</td><td><a href="#migrate" class="link">Migrate your client</a> and choose the matching API protocol.</td></tr><tr><td>Use models in a coding agent</td><td><a href="/inference/model-apis/coding-agents" class="link">Configure your coding agent</a> to use Model APIs.</td></tr><tr><td>Choose a language model</td><td>Compare <a href="#supported-models" class="link">supported models</a> and <a href="#feature-support" class="link">feature support</a>.</td></tr><tr><td>Classify, route, or score inputs</td><td>Send structured questions to <a href="/inference/model-apis/decision-models" class="link">decision models</a>.</td></tr></tbody></table></div></div></div></div>
        <span data-as="p">Choose a <a href="/examples/create-a-model-with-rest" class="link">dedicated deployment</a> when you need another model, dedicated GPUs, or control over hardware and scaling.</span>
        <h2 class="flex whitespace-pre-wrap group font-semibold" id="supported-models"><div class="absolute" tabindex="-1"><a href="#supported-models" class="-ml-10 flex items-center opacity-0 border-0 group-hover:opacity-100 focus:opacity-100 focus:outline-0 group/link" aria-label="Navigate to header">​<div class="size-6 rounded-md flex items-center justify-center shadow-xs text-gray-400 dark:text-white/50 dark:bg-background-dark dark:brightness-[1.35] dark:ring-1 dark:hover:brightness-150 bg-white ring-1 ring-gray-400/30 dark:ring-gray-700/25 hover:ring-gray-400/60 dark:hover:ring-white/20 group-focus/link:border-2 group-focus/link:border-primary dark:group-focus/link:border-primary-light"><svg aria-hidden="true" width="18" height="18" stroke-width="2" class="size-3 shrink-0"><use href="#mi-mint-1-Link"></use></svg></div></a></div><span class="cursor-pointer">Supported models</span></h2>
        <span data-as="p">A <strong>model slug</strong> identifies the hosted model, such as <code>zai-org/GLM-5.3</code>. Set the request’s <code>model</code> field to the exact slug from the table, then <a href="#run-inference" class="link">run inference</a>.</span>
        <div role="note" aria-label="Note" class="callout my-4 px-5 py-4 overflow-hidden rounded-2xl flex gap-3 border border-blue-200 bg-blue-50 dark:border-blue-900 dark:bg-blue-600/20" data-callout-type="note"><div class="mt-0.5 w-4" data-component-part="callout-icon"><svg aria-hidden="true" width="18" height="18" stroke-width="1.5" class="size-4 text-blue-800 dark:text-blue-300"><use href="#mi-mint-1-CalloutNote"></use></svg></div><div class="text-sm prose dark:prose-invert min-w-0 w-full [&amp;_kbd]:bg-background-light dark:[&amp;_kbd]:bg-background-dark [&amp;_code]:text-current! [&amp;_kbd]:text-current! [&amp;_a]:text-current! [&amp;_a]:border-current [&amp;_strong]:text-current! text-blue-800 dark:text-blue-300" data-component-part="callout-content"><span data-as="p">Context and output limits can differ from a model’s advertised maximum. Use the limits in this table when configuring requests. The <a href="#list-available-models" class="link"><code>/v1/models</code></a> catalog can report different values from the limits enforced by the endpoint.</span></div></div>
        <!-- -->
        <span data-as="p">Fast variants use the same weights as their base models with dedicated capacity for higher sustained throughput. They use separate slugs, pricing, and rate limits. When Fast capacity is unavailable, Baseten uses base-model capacity.</span>
        <h2 class="flex whitespace-pre-wrap group font-semibold" id="feature-support"><div class="absolute" tabindex="-1"><a href="#feature-support" class="-ml-10 flex items-center opacity-0 border-0 group-hover:opacity-100 focus:opacity-100 focus:outline-0 group/link" aria-label="Navigate to header">​<div class="size-6 rounded-md flex items-center justify-center shadow-xs text-gray-400 dark:text-white/50 dark:bg-background-dark dark:brightness-[1.35] dark:ring-1 dark:hover:brightness-150 bg-white ring-1 ring-gray-400/30 dark:ring-gray-700/25 hover:ring-gray-400/60 dark:hover:ring-white/20 group-focus/link:border-2 group-focus/link:border-primary dark:group-focus/link:border-primary-light"><svg aria-hidden="true" width="18" height="18" stroke-width="2" class="size-3 shrink-0"><use href="#mi-mint-1-Link"></use></svg></div></a></div><span class="cursor-pointer">Feature support</span></h2>
        <span data-as="p">The language models in this table support <a href="/inference/function-calling" class="link">tool calling</a>. All except Muse Spark Open support <a href="/inference/structured-outputs" class="link">structured outputs</a> and <a href="/inference/json-mode" class="link">JSON mode</a>. The table lists model-specific support for <a href="/inference/model-apis/reasoning" class="link">reasoning</a>, <a href="/inference/model-apis/vision" class="link">vision</a>, and sampling parameters. Muse Spark Open also supports <a href="/inference/model-apis/audio" class="link">audio input</a>. <a href="/inference/model-apis/web-search" class="link">Web search</a> is available on supported models.</span>
        <!-- -->
        <h3 class="flex whitespace-pre-wrap group font-semibold" id="defaults-and-limitations"><div class="absolute" tabindex="-1"><a href="#defaults-and-limitations" class="-ml-10 flex items-center opacity-0 border-0 group-hover:opacity-100 focus:opacity-100 focus:outline-0 group/link" aria-label="Navigate to header">​<div class="size-6 rounded-md flex items-center justify-center shadow-xs text-gray-400 dark:text-white/50 dark:bg-background-dark dark:brightness-[1.35] dark:ring-1 dark:hover:brightness-150 bg-white ring-1 ring-gray-400/30 dark:ring-gray-700/25 hover:ring-gray-400/60 dark:hover:ring-white/20 group-focus/link:border-2 group-focus/link:border-primary dark:group-focus/link:border-primary-light"><svg aria-hidden="true" width="18" height="18" stroke-width="2" class="size-3 shrink-0"><use href="#mi-mint-1-Link"></use></svg></div></a></div><span class="cursor-pointer">Defaults and limitations</span></h3>
        <span data-as="p">Muse Spark Open accepts <code>logprobs</code> and <code>top_logprobs</code> but ignores them and returns no log probabilities. It supports one response per prompt; <code>n</code> greater than 1 returns HTTP 400. Neither <code>seed</code> nor <code>temperature: 0</code> guarantees reproducible output.</span>
        <h2 class="flex whitespace-pre-wrap group font-semibold" id="regions-and-compliance"><div class="absolute" tabindex="-1"><a href="#regions-and-compliance" class="-ml-10 flex items-center opacity-0 border-0 group-hover:opacity-100 focus:opacity-100 focus:outline-0 group/link" aria-label="Navigate to header">​<div class="size-6 rounded-md flex items-center justify-center shadow-xs text-gray-400 dark:text-white/50 dark:bg-background-dark dark:brightness-[1.35] dark:ring-1 dark:hover:brightness-150 bg-white ring-1 ring-gray-400/30 dark:ring-gray-700/25 hover:ring-gray-400/60 dark:hover:ring-white/20 group-focus/link:border-2 group-focus/link:border-primary dark:group-focus/link:border-primary-light"><svg aria-hidden="true" width="18" height="18" stroke-width="2" class="size-3 shrink-0"><use href="#mi-mint-1-Link"></use></svg></div></a></div><span class="cursor-pointer">Regions and compliance</span></h2>
        <span data-as="p">Model APIs use a shared endpoint, and the regions serving a model can change. If your workloads must stay in specific regions, <a href="mailto:support@baseten.co" target="_blank" rel="noreferrer" class="link">contact support</a> to confirm model availability and enable a Model APIs compliance policy.</span>
        <span data-as="p">The policy restricts which deployments can serve your requests. Availability depends on the model having capacity in an allowed region.</span>
        <span data-as="p">For synchronous Model API requests, Baseten doesn’t store inputs or outputs under its <a href="/observability/security#data-privacy" class="link">zero data retention policy</a>. For queued execution, use <a href="/inference/async" class="link">async inference</a> with a dedicated deployment and review its input-retention behavior.</span>
        <h2 class="flex whitespace-pre-wrap group font-semibold" id="run-inference"><div class="absolute" tabindex="-1"><a href="#run-inference" class="-ml-10 flex items-center opacity-0 border-0 group-hover:opacity-100 focus:opacity-100 focus:outline-0 group/link" aria-label="Navigate to header">​<div class="size-6 rounded-md flex items-center justify-center shadow-xs text-gray-400 dark:text-white/50 dark:bg-background-dark dark:brightness-[1.35] dark:ring-1 dark:hover:brightness-150 bg-white ring-1 ring-gray-400/30 dark:ring-gray-700/25 hover:ring-gray-400/60 dark:hover:ring-white/20 group-focus/link:border-2 group-focus/link:border-primary dark:group-focus/link:border-primary-light"><svg aria-hidden="true" width="18" height="18" stroke-width="2" class="size-3 shrink-0"><use href="#mi-mint-1-Link"></use></svg></div></a></div><span class="cursor-pointer">Run inference</span></h2>
        <span data-as="p">Set <code>BASETEN_API_KEY</code> to your <a href="/organization/api-keys#use-api-keys-with-endpoints" class="link">API key</a>. If you need to create a key, follow the <a href="/quickstart" class="link">quickstart</a>. Requests use the model’s <a href="/inference/model-apis/pricing-and-limits" class="link">token pricing</a>.</span>
        <span data-as="p">Generated text can vary. The cURL responses are excerpts; <code>...</code> marks omitted fields.</span>
        <span data-as="p">To use another model, replace <code>zai-org/GLM-5.3</code> with its <a href="#supported-models" class="link">slug</a>.</span>
        <span data-as="p">Choose the API format your application supports, or use the request and response shape to decide:</span>
