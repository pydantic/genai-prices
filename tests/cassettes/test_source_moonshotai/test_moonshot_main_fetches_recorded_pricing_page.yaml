        <h2 class="flex whitespace-pre-wrap group font-medium" id="concepts"><div class="absolute" tabindex="-1"><a href="#concepts" class="-ml-10 flex items-center opacity-0 border-0 group-hover:opacity-100 focus:opacity-100 focus:outline-0 group/link" aria-label="Navigate to header">​<div class="size-6 rounded-md flex items-center justify-center shadow-xs text-gray-400 dark:text-white/50 dark:bg-background-dark dark:brightness-[1.35] dark:ring-1 dark:hover:brightness-150 bg-white ring-1 ring-gray-400/30 dark:ring-gray-700/25 hover:ring-gray-400/60 dark:hover:ring-white/20 group-focus/link:border-2 group-focus/link:border-primary dark:group-focus/link:border-primary-light"><svg aria-hidden="true" width="18" height="18" stroke-width="2" class="size-3 shrink-0"><use href="#mi-mint-1-Link"></use></svg></div></a></div><span class="min-w-0 break-words cursor-pointer">Concepts</span></h2>
        <div role="note" aria-label="Note" class="callout my-4 px-5 py-4 overflow-hidden rounded-2xl flex gap-3 border border-blue-200 bg-blue-50 dark:border-blue-900 dark:bg-blue-600/20" data-callout-type="note"><div class="mt-0.5 w-4" data-component-part="callout-icon"><svg aria-hidden="true" width="18" height="18" stroke-width="1.5" class="size-4 text-blue-800 dark:text-blue-300"><use href="#mi-mint-1-CalloutNote"></use></svg></div><div class="text-sm prose dark:prose-invert min-w-0 w-full [&amp;_kbd]:bg-background-light dark:[&amp;_kbd]:bg-background-dark [&amp;_code]:text-current! [&amp;_kbd]:text-current! [&amp;_a]:text-current! [&amp;_a]:border-current [&amp;_strong]:text-current! text-blue-800 dark:text-blue-300" data-component-part="callout-content"><span data-as="p">Model inference on the Kimi API platform is billed on a pay-as-you-go basis, with no subscription plan. It differs from products such as the Kimi membership and Kimi Code. <a class="link" href="/docs/guide/product-plans">See the product comparison</a>.</span></div></div>
        <h3 class="flex whitespace-pre-wrap group font-medium" id="billing-unit"><div class="absolute" tabindex="-1"><a href="#billing-unit" class="-ml-10 flex items-center opacity-0 border-0 group-hover:opacity-100 focus:opacity-100 focus:outline-0 group/link" aria-label="Navigate to header">​<div class="size-6 rounded-md flex items-center justify-center shadow-xs text-gray-400 dark:text-white/50 dark:bg-background-dark dark:brightness-[1.35] dark:ring-1 dark:hover:brightness-150 bg-white ring-1 ring-gray-400/30 dark:ring-gray-700/25 hover:ring-gray-400/60 dark:hover:ring-white/20 group-focus/link:border-2 group-focus/link:border-primary dark:group-focus/link:border-primary-light"><svg aria-hidden="true" width="18" height="18" stroke-width="2" class="size-3 shrink-0"><use href="#mi-mint-1-Link"></use></svg></div></a></div><span class="cursor-pointer">Billing Unit</span></h3>
        <span data-as="p">Token: A token represents a common sequence of characters. The number of tokens used for each English character may vary. For example, a single character like “antidisestablishmentarianism” might be broken down into several tokens, while a short and common phrase like “word” might use just one token. Generally speaking, for a typical English text, 1 token is roughly equivalent to 3-4 English characters. The exact number of tokens generated by each call can be obtained through the <a class="link" href="/docs/api/estimate">Token Calculation API</a>.</span>
        <h3 class="flex whitespace-pre-wrap group font-medium" id="billing-logic"><div class="absolute" tabindex="-1"><a href="#billing-logic" class="-ml-10 flex items-center opacity-0 border-0 group-hover:opacity-100 focus:opacity-100 focus:outline-0 group/link" aria-label="Navigate to header">​<div class="size-6 rounded-md flex items-center justify-center shadow-xs text-gray-400 dark:text-white/50 dark:bg-background-dark dark:brightness-[1.35] dark:ring-1 dark:hover:brightness-150 bg-white ring-1 ring-gray-400/30 dark:ring-gray-700/25 hover:ring-gray-400/60 dark:hover:ring-white/20 group-focus/link:border-2 group-focus/link:border-primary dark:group-focus/link:border-primary-light"><svg aria-hidden="true" width="18" height="18" stroke-width="2" class="size-3 shrink-0"><use href="#mi-mint-1-Link"></use></svg></div></a></div><span class="cursor-pointer">Billing Logic</span></h3>
        <span data-as="p">Model inference APIs bill both Input and Output based on usage. For K3 series models, cache writes are billed separately by TTL (5min / 1h); cached input is billed at the cache-hit price only, with no additional cache write charge. If you upload and extract content from a document and then pass the extracted content as Input to the model, the document content will also be billed based on usage. File-related APIs (file content extraction and file storage) are <strong>temporarily free</strong>: if you only upload and extract a document, the file APIs themselves incur no charges. For tips on improving cache hit rates and choosing a TTL tier, see <a class="link" href="/docs/guide/context-caching">Best Practices for Context Caching</a>.</span>
        <h2 class="flex whitespace-pre-wrap group font-medium" id="model-notes"><div class="absolute" tabindex="-1"><a href="#model-notes" class="-ml-10 flex items-center opacity-0 border-0 group-hover:opacity-100 focus:opacity-100 focus:outline-0 group/link" aria-label="Navigate to header">​<div class="size-6 rounded-md flex items-center justify-center shadow-xs text-gray-400 dark:text-white/50 dark:bg-background-dark dark:brightness-[1.35] dark:ring-1 dark:hover:brightness-150 bg-white ring-1 ring-gray-400/30 dark:ring-gray-700/25 hover:ring-gray-400/60 dark:hover:ring-white/20 group-focus/link:border-2 group-focus/link:border-primary dark:group-focus/link:border-primary-light"><svg aria-hidden="true" width="18" height="18" stroke-width="2" class="size-3 shrink-0"><use href="#mi-mint-1-Link"></use></svg></div></a></div><span class="cursor-pointer">Model Notes</span></h2>
        <span data-as="p">See each model’s guide for capabilities and recommended use cases:</span>
        <ul>
        <li><a class="link" href="/docs/guide/kimi-k3-1-pro-quickstart">Kimi K3.1 Pro</a></li>
        <li><a class="link" href="/docs/guide/kimi-k3-quickstart">Kimi K3</a></li>
