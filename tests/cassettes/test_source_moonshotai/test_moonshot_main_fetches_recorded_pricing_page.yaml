, 24, 27, 0.88);\n  --brand-overlay: linear-gradient(to top, rgba(0, 0, 0, 0.84), rgba(0, 0, 0, 0.3), transparent);\n}\n\n/* Footer: hide divider, \"Powered by Mintlify\", and theme toggle buttons */\n#footer \u003e * \u003e div:last-child,\n#footer \u003e * \u003e div:nth-last-child(2) {\n  display: none !important;\n}\n\n/* Use a neutral community icon for the forum footer link. */\n#footer a[href^=\"https://forum.moonshot.ai/\"] svg {\n  display: none !important;\n}\n\n#footer a[href^=\"https://forum.moonshot.ai/\"]::before {\n  content: \"\";\n  display: block;\n  width: 1.25rem;\n  height: 1.25rem;\n  background-color: currentColor;\n  -webkit-mask: url(\"/assets/icons/community.svg\") center / contain no-repeat;\n  mask: url(\"/assets/icons/community.svg\") center / contain no-repeat;\n}\n\n/* Global Mintlify UI tuning */\n#search-bar-entry,\n#search-bar-entry-mobile {\n  border: 1px solid var(--brand-border) !important;\n  background: var(--brand-card-bg) !important;\n  box-shadow: none !important;\n}\n\n#search-input {\n  color: var(--brand-text) !important;\n}\n\n#search-input::placeholder {\n  color: var(--brand-text-muted) !important;\n}\n\n#topbar,\n#topbar-content-container,\n#topbar-content-wrapper {\n  color: var(--brand-text) !important;\n}\n\n/* Keep the desktop sidebar below the navbar's 3rem documentation tabs.\n   Mintlify's default offset only includes the 4rem topbar and banner. */\n@media (min-width: 1024px) {\n  #sidebar {\n    top: calc(7rem + var(--banner-height, 0px)) !important;\n  }\n}\n\n#sidebar-content li[data-active] {\n  background: var(--brand-primary-soft) !important;\n  border-radius: 14px;\n}\n\n/* Active sidebar item text: color the link itself and let the title inherit.\n   Method pills (POST/GET) set their own colors and are unaffected. */\n#sidebar-content li[data-active] a,\n#sidebar-content li[data-active] button {\n  color: var(--brand-primary) !important;\n}\n\n/* Prevent synthetic bold on sidebar items — Mintlify uses text-shadow to simulate bold, which distorts CJK glyphs */\n#sidebar-content a,\n#sidebar-content button {\n  font-weight: inherit !important;\n  text-shadow: none !important;\n}\n\n.sidebar-group[data-active] \u003e .sidebar-group-header,\n.sidebar-group[data-active] \u003e .sidebar-group-header * {\n  color: var(--brand-primary) !important;\n}\n\n.method-nav-pill,\n.method-pill {\n  border-radius: 999px !important;\n  box-shadow: none !important;\n}\n\n#request-example,\n#response-example,\n#api-playground-input,\n#panel,\n#page-context-menu-button {\n  border-color: var(--brand-border) !important;\n}\n\n#request-example,\n#response-example,\n#api-playground-input {\n  background: var(--brand-card-bg) !important;\n}\n\n.dark .method-nav-pill,\n.dark .method-pill,\n[data-theme=\"dark\"] .method-nav-pill,\n[data-theme=\"dark\"] .method-pill {\n  border-color: transparent !important;\n}\n\n/* Fix Tabs active state visibility in dark mode */\n.dark li[role=\"tab\"][aria-selected=\"true\"] \u003e div,\n[data-theme=\"dark\"] li[role=\"tab\"][aria-selected=\"true\"] \u003e div {\n  color: #ffffff !important;\n  border-color: #ffffff !important;\n}\n\n.nav-tabs-item[data-active],\n.mobile-nav-tabs-item[data-active] {\n  color: var(--brand-primary) !important;\n}\n\n.navbar-link:hover,\n.nav-tabs-item:hover,\n.mobile-nav-tabs-item:hover {\n  color: var(--brand-primary) !important;\n}\n\n.toc-item[data-active],\n.toc-item[data-active-deepest] {\n  color: var(--brand-primary) !important;\n}\n\n.toc-item[data-active] a,\n.toc-item[data-active-deepest] a {\n  color: var(--brand-primary) !important;\n}\n\n#header \u003e div.mt-2.prose {\n  font-size: 1rem;\n  line-height: 1.5rem;\n}\n\n#header \u003e div.mt-2.prose {\n  color: #73737c;\n}\n\n.dark #header \u003e div.mt-2.prose,\n[data-theme=\"dark\"] #header \u003e div.mt-2.prose {\n  color: #a1a1aa;\n}\n\n.mdx-content a {\n  color: var(--brand-primary);\n  text-decoration-color: color-mix(in srgb, var(--brand-primary) 58%, transparent);\n}\n\n.mdx-content a:hover {\n  color: var(--brand-primary-strong);\n  text-decoration-color: color-mix(in srgb, var(--brand-primary-strong) 72%, transparent);\n}\n\n.mdx-content a strong,\n.mdx-content a b,\n.mdx-content a code {\n  color: inherit;\n}\n\n.quickstart-cta-wrap {\n  display: flex;\n  justify-content: center;\n  margin: 48px 0 64px;\n}\n\n.mdx-content .quickstart-cta {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  padding: 10px 20px;\n  border-radius: 8px;\n  background: var(--brand-primary);\n  color: var(--brand-surface);\n  font-size: 14px;\n  font-weight: 500;\n  line-height: 1.25;\n  text-decoration: none;\n}\n\n.mdx-content .quickstart-cta:hover {\n  background: var(--brand-primary-strong);\n  color: var(--brand-surface);\n}\n\n.code-block,\npre {\n  border-color: var(--brand-border) !important;\n}\n\ncode:not(pre code) {\n  background: var(--brand-surface) !important;\n  border: 1px solid var(--brand-border);\n  color: var(--brand-text) !important;\n}\n\n#page-context-menu-button:hover,\n.pagination-next:hover,\n.pagination-prev:hover,\n.topbar-cta-button:hover {\n  border-color: var(--brand-primary) !important;\n}\n\n/* Base styles for the overview sections */\n.overview-page {\n  color: var(--brand-text);\n}\n\n.overview-page a {\n  border-bottom: none !important;\n  box-shadow: none !important;\n  text-decoration: none !important;\n}\n\n.overview-page .overview-overlay-link {\n  position: absolute !important;\n  inset: 0 !important;\n  display: block !important;\n  border: 0 !important;\n  border-bottom: 0 !important;\n  box-shadow: none !important;\n  text-decoration: none !important;\n  z-index: 4 !important;\n}\n\n/* Grid Layouts */\n.overview-page .overview-grid-2,\n.overview-page .overview-grid-3,\n.overview-page .overview-grid-4 {\n  display: grid;\n  align-items: stretch;\n  gap: 16px;\n}\n\n.overview-page .overview-grid-2 {\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n}\n\n.overview-page .overview-grid-3 {\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n}\n\n.overview-page .overview-grid-4 {\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n}\n\n/* Card Common Styles */\n.overview-page .overview-link-card,\n.overview-page .overview-resource-card {\n  position: relative;\n  overflow: hidden;\n  display: flex;\n  height: 100%;\n  border: 1px solid var(--brand-border);\n  border-radius: 12px;\n  background: var(--brand-card-bg);\n  backdrop-filter: blur(10px);\n  transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s;\n}\n\n.overview-page .overview-link-card:hover,\n.overview-page .overview-resource-card:hover {\n  border-color: var(--brand-primary);\n  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);\n}\n\n/* Card Body (Media Object) */\n.overview-page .overview-link-card__body,\n.overview-page .overview-resource-card__body {\n  display: flex;\n  padding: 20px 16px;\n  width: 100%;\n  flex-direction: row;\n  gap: 12px;\n  align-items: flex-start;\n}\n\n.overview-page .overview-link-card__content {\n  display: flex;\n  flex: 1;\n  flex-direction: column;\n}\n\n.overview-page .overview-link-card__icon {\n  display: flex;\n  width: 24px;\n  min-width: 24px;\n  align-items: center;\n  justify-content: center;\n  line-height: 1;\n  margin-top: 3px;\n  color: var(--brand-text-muted);\n}\n\n.overview-page .overview-link-card__title,\n.overview-page .overview-resource-card__title {\n  font-size: 16px;\n  font-weight: 500;\n  line-height: 1.2;\n  color: var(--brand-text);\n}\n\n.overview-page .overview-link-card__description,\n.overview-page .overview-resource-card__description {\n  margin-top: 4px;\n  font-size: 14px;\n  color: var(--brand-text-muted);\n  line-height: 1.4;\n}\n\n/* Model Card Styles */\n.overview-page .overview-model-card {\n  position: relative;\n  overflow: hidden;\n  border: 1px solid var(--brand-border);\n  border-radius: 12px;\n  background: var(--brand-surface);\n}\n\n.overview-page .overview-model-card__media {\n  position: relative;\n  aspect-ratio: 123 / 92;\n  line-height: 0;\n}\n\n.overview-page .overview-model-card__image {\n  display: block;\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n  transition: transform 0.5s;\n}\n\n.overview-page .overview-model-card:hover .overview-model-card__image {\n  transform: scale(1.05);\n}\n\n.overview-page .overview-model-card__overlay {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  align-items: flex-end;\n  background: var(--brand-overlay);\n}\n\n.overview-page .overview-model-card__content {\n  width: 100%;\n  padding: 16px;\n}\n\n.overview-page .overview-model-card__name {\n  color: white;\n  font-weight: 600;\n  line-height: 1.2;\n  font-size: 16px;\n}\n\n.overview-page .overview-model-card__tag-row {\n  margin-top: 8px;\n  line-height: 1;\n}\n\n.overview-page .overview-hero-card {\n  background: var(--brand-surface);\n  border-color: var(--brand-border) !important;\n}\n\n.overview-page .overview-hero-card__cta {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 10px 20px;\n  border: 1px solid rgba(255, 255, 255, 0.14);\n  border-radius: 8px;\n  background: rgba(255, 255, 255, 0.96);\n  color: #111111 !important;\n  font-size: 14px;\n  font-weight: 500;\n  white-space: nowrap;\n  position: relative;\n  z-index: 10;\n  transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;\n}\n\n.overview-page .overview-hero-card__cta:hover {\n  background: #ffffff;\n  border-color: rgba(255, 255, 255, 0.3);\n  transform: translateY(-1px);\n}\n\n.overview-page .overview-section-link {\n  color: var(--brand-primary) !important;\n  text-decoration: underline !important;\n  text-underline-offset: 0.18em;\n}\n\n.overview-page .overview-section-link:hover {\n  color: var(--brand-primary-strong) !important;\n}\n\n.overview-page .overview-resource-card a,\n.overview-page .overview-link-card a,\n.overview-page .overview-model-card a {\n  color: inherit !important;\n}\n\n/* Responsive adjustments */\n@media (max-width: 1100px) {\n  .overview-page .overview-grid-3 {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n  }\n}\n\n/* Web Search API selection table: narrow the API column and keep endpoints on one line */\n#choose-the-right-api + div table:first-of-type {\n  min-width: 680px;\n  table-layout: fixed;\n}\n\n#choose-the-right-api + div table:first-of-type th,\n#choose-the-right-api + div table:first-of-type td {\n  min-width: 0;\n}\n\n#choose-the-right-api + div table:first-of-type th:nth-child(1),\n#choose-the-right-api + div table:first-of-type td:nth-child(1) {\n  width: 16%;\n}\n\n#choose-the-right-api + div table:first-of-type th:nth-child(2),\n#choose-the-right-api + div table:first-of-type td:nth-child(2) {\n  width: 32%;\n}\n\n#choose-the-right-api + div table:first-of-type td:nth-child(2),\n#choose-the-right-api + div table:first-of-type td:nth-child(2) code {\n  white-space: nowrap;\n}\n\n/* Hide API page right-side request/response code examples */\n#content-side-layout:has(.code-group) {\n  display: none !important;\n}\n\n@media (max-width: 700px) {\n  .overview-page .overview-grid-2,\n  .overview-page .overview-grid-3,\n  .overview-page .overview-grid-4 {\n    grid-template-columns: 1fr;\n  }\n}\n\n.doc-table-wrap {\n  width: 100%;\n  max-width: 100%;\n}\n\n.doc-table-wrap table {\n  display: table !important;\n  width: 100% !important;\n  max-width: 100% !important;\n  min-width: 0 !important;\n  table-layout: fixed !important;\n  margin: 0 !important;\n}\n\n.doc-table-wrap th,\n.doc-table-wrap td {\n  white-space: normal !important;\n  overflow-wrap: anywhere;\n  word-break: break-word;\n  text-align: left !important;\n  vertical-align: middle;\n}\n\n/* 单元格内列表去掉上下 margin，避免与纯文本单元格对齐不一 */\n.doc-table-wrap td ul {\n  margin-top: 0 !important;\n  margin-bottom: 0 !important;\n}\n\n/* Fully bordered table (pricing pages): square corners, group-boundary rules, cell padding */\n.doc-table-bordered {\n  border: 1px solid rgba(128, 128, 128, 0.25);\n  container-type: inline-size;\n}\n\n.doc-table-bordered th,\n.doc-table-bordered td {\n  padding: 12px 16px !important;\n}\n\n.doc-table-bordered th:first-child,\n.doc-table-bordered td:first-child {\n  border-right: 1px solid rgba(128, 128, 128, 0.25);\n}\n\n.doc-table-bordered .doc-table-group-start,\n.doc-table-bordered thead tr.doc-table-groups th:nth-child(n + 3) {\n  border-left: 1px solid rgba(128, 128, 128, 0.25);\n}\n\n.doc-table-corner-sub {\n  font-weight: 400;\n  opacity: 0.6;\n}\n\n/* Muted price unit suffix (/ MTok) */\n.doc-table-unit {\n  opacity: 0.55;\n  font-size: 0.85em;\n}\n\n/* Keep prices on one line only when the table has enough space */\n@container (min-width: 840px) {\n  .doc-table-bordered .doc-table-price {\n    white-space: nowrap;\n  }\n}\n\n/* Group row for two-level headers */\n.doc-table-wrap thead tr.doc-table-groups th {\n  text-align: left !important;\n  font-weight: 600;\n  border-bottom: 1px solid rgba(128, 128, 128, 0.25);\n}\n\n.doc-table-wrap thead tr.doc-table-groups th:empty {\n  border-bottom: none;\n}\n\n/* Bordered tables: darker gray on the group row, lighter gray on the column row */\n.doc-table-bordered thead tr.doc-table-groups th {\n  background-color: rgba(128, 128, 128, 0.16);\n}\n\n.doc-table-bordered thead tr:not(.doc-table-groups) th {\n  background-color: rgba(128, 128, 128, 0.06);\n}\n\n@media (max-width: 900px) {\n  .doc-table-wrap th,\n  .doc-table-wrap td {\n    padding: 10px 8px !important;\n    font-size: 13px;\n    line-height: 1.45;\n  }\n}\n\n@media (max-width: 640px) {\n  .doc-table-wrap {\n    width: 100%;\n  }\n\n  .doc-table-wrap th,\n  .doc-table-wrap td {\n    padding: 8px 6px !important;\n    font-size: 12px;\n    line-height: 1.4;\n  }\n\n  .doc-table-wrap td:first-child,\n  .doc-table-wrap th:first-child {\n    word-break: break-all;\n    overflow-wrap: anywhere;\n  }\n\n  .doc-table-wrap code {\n    font-size: 11px;\n    white-space: normal !important;\n    word-break: break-all;\n  }\n}\n\n/* 侧边栏分组标题默认 text-xs（12px），比页面项还小；调大到 text-sm（14px）保持层级清晰 */\n.sidebar-group-header {\n  font-size: 0.875rem !important;\n}\n\n/* luma 会把 navbar links 重复渲染到侧边栏底部（竖排带 ↗），隐藏；头部链接保留 */\nnav[aria-label=\"Pages\"] ul.bottom-0.border-t {\n  display: none !important;\n}\n\n/* 头部右侧导航链接做成按钮样式（企业订阅 / 联系销售 / 用户中心） */\nli.navbar-link \u003e a {\n  border: 1px solid var(--brand-border, #e5e7eb);\n  border-radius: 9999px;\n  padding: 0.3rem 0.9rem;\n}\nli.navbar-link \u003e a:hover {\n  border-color: var(--brand-primary) !important;\n  color: var(--brand-primary) !important;\n}\n\n/* header 拥挤：把搜索框压缩为放大镜图标按钮（点击或 ⌘K 仍可唤起搜索） */\ndiv.relative:has(\u003e #search-bar-entry) {\n  flex: none !important;\n  justify-content: flex-end !important;\n}\n#search-bar-entry {\n  width: 2.25rem !important;\n  min-width: 2.25rem !important;\n  flex: none !important;\n  padding: 0 !important;\n  justify-content: center !important;\n  border-radius: 9999px !important;\n}\n#search-bar-entry * {\n  font-size: 0 !important;\n}\n#search-bar-entry kbd {\n  display: none !important;\n}\n\n/* tabs 整体左移（容器默认 px-12 太大），配合图标化搜索缓解 header 拥挤 */\ndiv[data-top-chrome] {\n  padding-left: 1rem !important;\n  padding-right: 1rem !important;\n}\n\n/* 搜索图标按钮再小一号，放大镜严格居中 */\n#search-bar-entry {\n  width: 1.75rem !important;\n  min-width: 1.75rem !important;\n  height: 1.75rem !important;\n  display: flex !important;\n  align-items: center !important;\n  justify-content: center !important;\n}\n#search-bar-entry \u003e div {\n  margin: 0 !important;\n  gap: 0 !important;\n}\n\n/* 搜索图标按钮：高度与企业订阅等按钮对齐（约 2.1rem），宽度保持紧凑方形 */\n#search-bar-entry {\n  width: 2.1rem !important;\n  min-width: 2.1rem !important;\n  height: 2.1rem !important;\n}\n\n/* 修正放大镜居中：内层容器同样居中，svg 块级自适应居中 */\n#search-bar-entry \u003e div {\n  flex: none !important;\n  width: auto !important;\n  justify-content: center !important;\n}\n#search-bar-entry svg {\n  display: block !important;\n  margin: 0 auto !important;\n}\n\n/* 主题切换按钮从 header 挪到侧边栏左下角，释放顶部空间 */\n#theme-preference-menu-trigger {\n  position: fixed !important;\n  left: 1rem;\n  bottom: 1rem;\n  z-index: 40;\n  background: var(--brand-surface, #ffffff) !important;\n  border: 1px solid var(--brand-border, #e5e7eb) !important;\n}\n\n/* 主题切换按钮改放右下角（避免遮挡侧边栏文字） */\n#theme-preference-menu-trigger {\n  left: auto !important;\n  right: 1rem !important;\n}\n\n/* 宽屏布局（对齐 Claude 文档的风格）：\n   1) luma 默认把正文在整个视口中居中（lg:ml-[calc(50vw-348px-14rem)]），宽屏下\n      侧边栏与正文、正文与右侧目录之间空白过大；改为让正文在侧边栏与目录之间的\n      区域里居中（margin: auto）\n   2) xl 以上适当加宽正文，进一步压缩两侧空白\n   3) 右侧目录收窄左内边距、贴近右边缘，减少右侧留白 */\n@media (min-width: 1024px) {\n  #content-area {\n    margin-left: auto !important;\n    margin-right: auto !important;\n  }\n}\n\n@media (min-width: 1280px) {\n  #content-area {\n    max-width: 56rem !important;\n  }\n\n  #content-side-layout {\n    margin-right: 1.5rem !important;\n    padding-left: 1.5rem !important;\n  }\n}\n\n/* 侧边栏宽度对齐 Claude 文档：≥1470px（91.875rem）时从 14rem 加宽到 18rem，\n   给英文长标题更多空间，减少折行（luma 默认恒为 14rem） */\n@media (min-width: 91.875rem) {\n  #sidebar-content {\n    width: 18rem !important;\n  }\n\n  #body-content {\n    padding-left: 18rem !important;\n  }\n}\n\n/* 划线价（StrikePrice 组件）：灰色划线原价 + 红色现价；暗色主题下现价调亮保证可读性 */\n.strike-price {\n  white-space: nowrap;\n}\n\n.strike-price-original {\n  color: #9ca3af;\n  margin-right: 0.375rem;\n}\n\n.strike-price-current {\n  color: #dc2626;\n  font-weight: 600;\n}\n\n.dark .strike-price-current,\n[data-theme=\"dark\"] .strike-price-current {\n  color: #f87171;\n}\n\n/* Banner 关闭按钮：缩小并弱化，hover 时再凸显 */\n#banner button {\n  width: 1.25rem !important;\n  height: 1.25rem !important;\n  right: 0.75rem !important;\n  border-radius: 9999px !important;\n  opacity: 0.55;\n  transition: opacity 0.15s ease, background-color 0.15s ease;\n}\n\n#banner button:hover {\n  opacity: 1;\n  background: rgba(255, 255, 255, 0.14) !important;\n}\n\n#banner button svg {\n  width: 12px !important;\n  height: 12px !important;\n  stroke-width: 1.5;\n}\n\n/* 无右侧目录的页面（如 OpenAPI 生成的 API 参考页）：在 flex 行尾预留与\n   #content-side-layout 等宽（18rem + 1.5rem margin）的空间，使正文位置与\n   有目录的页面一致，避免切换页面时正文左右跳动 */\n@media (min-width: 1280px) {\n  #content-container:not(:has(#table-of-contents-layout))::after {\n    content: \"\";\n    flex: none;\n    width: 19.5rem;\n  }\n}\n\n/* 视频下方的折叠介绍（VideoIntro 组件）：纯 CSS 开关，无框小字 */\n.video-intro {\n  margin-top: 4px;\n  font-size: 0.85em;\n  line-height: 1.6;\n}\n\n.video-intro-toggle {\n  display: none;\n}\n\n.video-intro \u003e label {\n  cursor: pointer;\n  color: #888;\n}\n\n.video-intro \u003e label::before {\n  content: \"▸ \";\n}\n\n.video-intro-toggle:checked + label::before {\n  content: \"▾ \";\n}\n\n.video-intro-body {\n  display: none;\n  color: #666;\n  margin-top: 4px;\n}\n\n.video-intro-toggle:checked ~ .video-intro-body {\n  display: block;\n}\n\n.video-intro-body p {\n  margin: 0 0 6px;\n}\n\n/* 视频网格（video-grid）内的视频去掉正文排版默认上下间距，避免与介绍文字之间出现空行 */\n.video-grid video {\n  margin: 0;\n}\n"])</script><script>self.__next_f.push([1,"4b:[\"$\",\"$L4f\",null,{\"pageMetadata\":\"$1b:props:children:props:pageMetadata\",\"mdxExtracts\":\"$1b:props:children:props:children:props:children:props:value:mdxExtracts\",\"openApiReferenceData\":\"$undefined\",\"children\":[\"$\",\"$L50\",null,{\"children\":[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$51\"}}],[[\"$\",\"script\",null,{\"dangerouslySetInnerHTML\":{\"__html\":\"document.documentElement.setAttribute('data-page-mode', \\\"none\\\");\"}}],[\"$\",\"$L52\",null,{\"pageMetadata\":\"$1b:props:children:props:pageMetadata\"}]],[\"$\",\"$L53\",null,{\"pageMetadata\":\"$1b:props:children:props:pageMetadata\"}],[\"$\",\"$L54\",null,{\"cssFiles\":[{\"_id\":\"69cb56f57ba705a281b0c139\",\"subdomain\":\"moonshotai\",\"filePath\":\"custom.css\",\"__v\":0,\"content\":\"$55\"}]}],\"$L56\",\"$L57\"]}]}]\n"])</script><script>self.__next_f.push([1,"4c:[\"$\",\"link\",\"35\",{\"rel