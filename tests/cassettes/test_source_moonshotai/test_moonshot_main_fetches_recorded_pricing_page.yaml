            width: 19.5rem;
          }
        }
        
        /* 视频下方的折叠介绍（VideoIntro 组件）：纯 CSS 开关，无框小字 */
        .video-intro {
          margin-top: 4px;
          font-size: 0.85em;
          line-height: 1.6;
        }
        
        .video-intro-toggle {
          display: none;
        }
        
        .video-intro > label {
          cursor: pointer;
          color: #888;
        }
        
        .video-intro > label::before {
          content: "▸ ";
        }
        
        .video-intro-toggle:checked + label::before {
          content: "▾ ";
        }
        
        .video-intro-body {
          display: none;
          color: #666;
          margin-top: 4px;
        }
        
        .video-intro-toggle:checked ~ .video-intro-body {
          display: block;
        }
        
        .video-intro-body p {
          margin: 0 0 6px;
        }
        
        /* 视频网格（video-grid）内的视频去掉正文排版默认上下间距，避免与介绍文字之间出现空行 */
        .video-grid video {
          margin: 0;
        }
