                        - entity:
                            __typename: Drupal_ParagraphPricingAccordion
                            uuid: 0acff740-9a49-41a4-9780-347614c4bd0c
                            fieldTitle: Foundation Model Serving FAQ
                            fieldItems:
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: 5f925efa-6c32-4e19-9ccb-c871611994c3
                                fieldTitle: How do model units work?
                                fieldDescription:
                                  processed: >-
                                    <p dir="ltr"><span>The capacity of a Provisioned Throughpoint endpoint is
                                    measured in model units. Each model unit gives a certain amount of throughput, which
                                    depends on the model and workload. You can use the </span><a
                                    href="https://www.databricks.com/product/pricing/genai-pricing-calculator"><span>GenAI
                                    Calculator</span></a><span> to estimate workload-specific throughput per model unit. For
                                    Reserved Provisioned Throughput, there is also a calculator conveniently available in
                                    the product interface when configuring a new endpoint.&nbsp;</span></p><p
                                    dir="ltr"><span>For most models, you can purchase Provisioned Throughput in increments of
                                    50 model units. The price of Provisioned Throughput is given per 50 model units
                                    per hour.</span></p>
                                fieldItem: null
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: 6c3859b7-0127-4d9c-9705-91d12e5ad9f7
                                fieldTitle: How can I estimate the total cost of Foundation Model Serving?
                                fieldDescription:
                                  processed: >-
                                    <p>You can use the <a
                                    href="https://www.databricks.com/product/pricing/genai-pricing-calculator">Generative AI pricing calculator</a> to estimate the total cost
                                    of Pay-Per-Token, Provisioned Throughput, and Batch Inference serving. For
                                    Reserved Provisioned Throughput, you can also use the model unit and DBU calculator
                                    that is available when configuring a new endpoint.</p>
                                fieldItem: null
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: 6ec05235-83a2-4fb3-8e45-0c5efd34c85c
                                fieldTitle: Are there different prices for different regions or in-geo serving?
                                fieldDescription:
                                  processed: >-
                                    <p>For certain models on certain clouds, there are different prices for
                                    different regions. Our regional prices are based on the regional cost of infrastructure
                                    supporting our serverless products. For other models, the price is the same in
                                    every region, but in-geo endpoints that meet data residency requirements will be
                                    charged a 10% higher DBU rate. For details on which models have regional prices and
                                    which have data residency uplifts, please refer to the prices and DBU rate
                                    tables above.</p>
                                fieldItem: null
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: c597669d-910d-40cb-a68f-82c44512f5ec
                                fieldTitle: How will Foundation Model Serving be charged?
                                fieldDescription:
                                  processed: >-
                                    <p>Usage of these services for most models will appear on your bill under the
                                    Serverless Real-time Inference SKU (or under the Model Serving SKU on SAP
                                    Databricks). For AWS / GCP customers, usage of the Kimi K3 model will appear on your bill
                                    under the Moonshot Model Serving SKU. &nbsp;For Azure customers, if you have an
                                    Azure Commit with Databricks, Databricks may make certain models available as an
                                    ADI Service that integrates with Azure Databricks; in the ADI service, usage of
                                    Kimi, Deepseek, Thinking Machines Lab, and Zhipu AI models will appear on your
                                    bill under dedicated SKUs. For each SKU, the price per DBU in the base region (such
                                    as us-east-1 for AWS, us-central1 for GCP, and eastus for Azure) is $0.07 / DBU.
                                    On the Serverless Real-time Inference SKU, there will be regional variation in
                                    price for other regions.</p>
                                fieldItem: null
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: ea3fdce2-25ca-4630-81f5-79b397450815
                                fieldTitle: What if I need more provisioned throughput capacity for my Foundation Model?
                                fieldDescription:
                                  processed: >-
                                    <p>You can purchase incremental provisioned throughput capacity for each model
                                    at the prices shown in the table.</p>
                                fieldItem: null
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: 5b6663ef-c6fc-4d10-b5e5-bfb7496a1fa5
                                fieldTitle: How does scale to zero work for Provisioned Throughput?
                                fieldDescription:
                                  processed: >-
                                    <p>If ‘scale to zero’ is selected, scale to zero happens automatically after 30
                                    minutes of no requests, at which time the endpoint enters the fully
                                    scaled-to-zero (idle) state. You are not charged during this time period. When a new request
                                    is made, the endpoint exits this idle state and begins scaling up at which point
                                    you begin getting charged</p>
                                fieldItem: null
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: f0b4e917-b82e-4a4f-bacd-ea286165f12a
                                fieldTitle: How will Function Calling be charged?
                                fieldDescription:
                                  processed: >-
                                    <p>Where it is available, Function Calling injects tokenized content into the
                                    prompt increasing the number of input tokens. Customers will be charged for the
                                    additional tokens at Foundation Model Serving rates.</p>
                                fieldItem: null
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: ac9331b8-150b-4104-bcb2-28eb507b8d25
                                fieldTitle: Will I be charged for data transfer and networking costs?
                                fieldDescription:
                                  processed: >-
                                    <p>Customers may incur data transfer costs when they move data between
                                    different regions or availability zones within the same cloud, move data out of a cloud,
                                    or require public or private connectivity from their VPCs. Please refer to the
                                    Data transfer and connectivity section on <a
                                    href="https://www.databricks.com/product/pricing/data-transfer-connectivity">this</a> page for more details.&nbsp;</p>
                                fieldItem: null
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: 602b2214-5166-434a-a3be-63519524df35
                                fieldTitle: >-
                                  Will I be charged for the full hour if I use the PT endpoint for a fraction of
                                  the hour?
                                fieldDescription:
                                  processed: >-
                                    <p>With On-Demand Provisioned Throughput, you will be charged only for the
                                    fraction of the hour the PT endpoint is provisioned. For example, if you have
                                    scale-to-zero enabled, you are charged for the duration with active requests coming in
                                    plus 30 minutes at which point scale-to-zero kicks in. With Reserved Provisioned
                                    Throughput, you will be charged for the duration of your reservation.</p>
                                fieldItem: null
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: bce42d22-6b22-4dc6-b702-382b9ad9ff35
                                fieldTitle: What's the difference between Entry and Scaling bands in Provisioned Throughput?
                                fieldDescription:
                                  processed: >-
                                    <p>For certain legacy models, entry bands are the small, lower-cost throughput
                                    bands designed to provide a more affordable starting point for customers. These
                                    bands provide proportionally reduced throughput compared to scaling bands.This
                                    concept is only available for certain models in certain regions. For models where
                                    entry bands are available, Provisioned Throughput DBU rates are shown per entry
                                    band per hour.</p><p>Scaling bands represent the standard throughput level
                                    increments that can be provisioned for a model. Provisioned Throughput capacity scales up
                                    and down in increments (hourly price and maximum token per second throughput) of
                                    these scaling bands.</p><p>Please use the GenAI Calculator for specific
                                    availability of entry bands and to estimate throughput for entry vs. scaling bands where
                                    applicable.</p>
                                fieldItem: null
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: 6371cf8f-68cd-48d3-b0d8-38beafde7e9f
                                fieldTitle: >-
                                  In regions where low-priced Entry bands are available, how does auto-scaling
                                  bands work?
                                fieldDescription:
                                  processed: >-
                                    <p>Entry bands are only available for the lowest, entry-level usage.
                                    Provisioned Throughput does not scale in these small increments, but rather in the full
                                    Scaling band increments. For instance, the available bands for Provisioned
                                    Throughput serving of Llama-3.3-70B have hourly price (shown for US East) &amp; throughput
                                    (for queries with 3500 input tokens and 300 output tokens) as follows:</p><p>-
                                    $6/hr - 2,400 tok/s<br>- $24/hr - 9,500 tok/s<br>- $48/hr - 19,000 tok/s<br>-
                                    $72/hr - 28,500 tok/s<br>- and so on</p>
                                fieldItem: null
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: f62b9a2a-49dd-440d-b2ee-631a06861612
                                fieldTitle: How does pricing for Batch Inference work?
                                fieldDescription:
                                  processed: >-
                                    <p>Batch Inference determines the scale of Provisioned Throughput to be run at
                                    any given point (i.e., how <span>many model units</span> to use) and scales up
                                    and down automatically. This allows Batch Inference to complete jobs quickly. You
                                    are charged for the model-specific price per hour per model unit times the
                                    duration and number of model units used during that period.</p>
                                fieldItem: null
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: 7b9950db-f39a-4c52-8d21-7e6f838e50d6
                                fieldTitle: What is a Capacity Unit (CU)?
                                fieldDescription:
                                  processed: >-
                                    <p>A "Capacity Unit" is a pricing metric in SAP Business Data Cloud (BDC). It
                                    measures the amount of data processed, storage, and computational resources
                                    consumed within the platform. SAP BDC customers are billed directly by SAP for the
                                    number of Capacity Units (CUs) consumed across all SAP BDC services.</p>
                                fieldItem:
                                  entity:
                                    __typename: Drupal_ParagraphPricingVisibilityRule
                                    uuid: b4dcbdf0-8a01-4d3c-b1b7-33226355478c
                                    fieldPricingVisibility: visible
                                    fieldPricingPlans: []
                                    fieldPricingClouds: []
                                    fieldPricingRegions: []
                                    fieldPricingModels: []
                                    fieldPricingVendors: []
                                    fieldPricingOther:
                                    - sap
                            - entity:
                                __typename: Drupal_ParagraphPricingAccordionItem
                                uuid: ad2b6f92-b88d-4dad-bef7-72830d1ecb2c
                                fieldTitle: How does Priority Pay-Per-Token work?
                                fieldDescription:
                                  processed: >-
                                    <p>Priority Pay-Per-Token (PPT) offers enhanced performance with pay-as-you-go
                                    flexibility. With Priority PPT, your requests are handled preferentially,
                                    resulting in lower latency and greater reliability. Priority PPT is priced in units of
                                    DBUs per million tokens.</p>
                                fieldItem: null
