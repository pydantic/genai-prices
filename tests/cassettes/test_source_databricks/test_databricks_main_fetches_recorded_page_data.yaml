                            fieldDescription:
                              processed: >-
                                <div class="how-to-dbu-rates"><h3>How to use DBU rates</h3><p>Your final price
                                equals the SKU price ($ per DBU, in the tiles above) multiplied by the DBU rate
                                (DBU per million tokens or hours, from the table below).</p><p>For example, if
                                your SKU price is <strong>$0.07 / DBU</strong> (<em>e.g. AWS, US East N.
                                Virginia</em>)<strong>:</strong></p><ul><li
                                data-list-item-id="ed6b7f7695e4215798c046281288327d0">Your final input token price for Kimi K3 is:<br>[$0.07 / DBU] × [42.857 DBU
                                / M input tokens] = <strong>$3.00 / M input tokens.</strong></li><li
                                data-list-item-id="e68b0135935b24e85463465f8efff199e">Your one-month Provisioned Throughput
                                price for GLM-5.3 is:<br>[$0.07 / DBU] × [142.857 DBU / hour] = <strong>$10.00 /
                                hour.</strong></li></ul></div>
