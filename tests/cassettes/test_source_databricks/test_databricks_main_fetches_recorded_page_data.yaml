                            fieldTitle: null
                            fieldDescription:
                              processed: "<p>* <span>Displayed pricing does not guarantee product availability in that region. For product availability see here:&nbsp;</span><a href=\"https://docs.databricks.com/en/resources/feature-region-support.html\">AWS</a><span>,&nbsp;</span><a href=\"https://learn.microsoft.com/en-us/azure/databricks/resources/feature-region-support\">Azure</a><span>,&nbsp;</span><a href=\"https://docs.gcp.databricks.com/en/resources/feature-region-support.html\">GCP</a><span>,&nbsp;</span><a href=\"https://docs.databricks.com/sap/en#supported-regions\">SAP</a><br>1. Azure Databricks, as a first-party service on Microsoft Azure, offers unified billing and support by Microsoft<br>&nbsp; &nbsp;The Premium tier on Azure Databricks corresponds to the Enterprise tier on AWS and GCP<br>2.&nbsp;Hourly pricing is charged on a per-minute increment<br>3. Provisioned Throughput is sold in increments of model units. The amount of throughput per model unit varies by model and request shape (input tokens, output tokens, cache hit rate). Please use the <a href=\"https://www.databricks.com/product/pricing/genai-pricing-calculator\">GenAI Calculator</a> to estimate workload-specific throughput and total cost</p>"
                            fieldItem: null
