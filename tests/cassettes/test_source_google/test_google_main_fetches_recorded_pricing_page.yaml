        ## Pricing for tools  {% id="pricing-for-tools" %}
        
        Tools are priced at their own rates, applied to the model using them. Check the
        [Models](/docs/models) page for which tools are available to each model.
        
        {% table %}
          * Feature
          * Free Tier
          * Paid Tier, per 1M tokens in USD
        
          ---
        
          * [Google Search](/docs/google-search#pricing)
          * 500 RPD free (limit shared for Flash and Flash-Lite).    
            Not available for Pro.
          * Gemini 2.5 models:    
            1,500 RPD free (limit shared for Flash and Flash-Lite).    
            Then $35 / 1,000 grounded prompts    
            Gemini 3 and newer models:    
            5,000 free search requests per month (shared across all Gemini 3 and newer
            models), then $14 per 1,000 requests. (Subject to a default daily cap of
            1,500 requests per day (RPD) per project on the Gemini Developer API.)
        
          ---
        
          * [Google Maps](/docs/maps-grounding#pricing-and-rate-limits)
          * 500 RPD    
            Not available for Pro.
          * Gemini 2.5 models:    
            1,500 RPD free (limit shared for Flash and Flash-Lite)    
            10,000 RPD free for Pro.    
            Then $25 / 1,000 grounded prompts    
            Gemini 3 and newer models:    
            5,000 requests per month (free, shared across all Gemini 3 and newer models), then
            $14 / 1,000 search queries.
        
          ---
        
          * [Code execution](/docs/code-execution#billing)
          * Free of charge
          * Code execution is billed at the standard token rates for the selected model.
              
            Costs are determined solely by tool usage; no charges accrue for session    
            runtime. Generated code and execution results are billed as **Output    
            tokens** when created, and as **Input tokens** when used by the model in    
            its iterative reasoning process.
        
          ---
        
          * [URL context](/docs/url-context#limitations)
          * Free of charge
          * Charged as input tokens per model pricing.
        
          ---
        
          * [Computer use](/docs/computer-use)
          * Not available
          * Charged as regular tokens per model pricing (e.g., standard [Gemini 3.8 Flash](/docs/pricing#gemini-3.8-flash) pricing).
        
          ---
        
          * [File search](/docs/file-search#pricing)
          * Free of charge
          * Charged for embeddings at [Gemini Embedding](/docs/pricing#gemini-embedding)
            ($0.15 / 1M tokens) or
            [Gemini Embedding 2](/docs/pricing#gemini-embedding-2) rates.   
            Retrieved document tokens charged as regular tokens per model pricing.
        
          ---
        
          * [Custom Tools endpoint (Gemini 3.1 Pro Preview)](/docs/models/gemini-3.1-pro-preview)
          * Not available
          * Same as [Gemini 3.1 Pro Preview](/docs/pricing#gemini-3.1-pro-preview)
            pricing
        {% /table %}
        
        ## Pricing for agents  {% id="pricing-for-agents" %}
        
        Agent usage costs are calculated based on the underlying token consumption and
        usage of the tools.
        
        {% table %}
          * Feature
          * Model
          * Tools
        
          ---
        
          * [Gemini Deep Research agent](/docs/deep-research)
          * All model inference is charged at standard Gemini list rates, including
            input,    
            output, and intermediate input / reasoning tokens generated during agentic    
            loops.
          * Tool usage fees apply per existing pricing structure, maintaining standard   
            distinctions for Search Grounding (retrieved tokens excluded) versus    
            Url_context / File Search (retrieved tokens included in all other tools).
        
          ---
        
          * [Managed agents in Gemini API](/docs/agents)
          * All model inference is charged at standard Gemini list rates, including
            input,    
            output, and intermediate input / reasoning tokens generated during agentic    
            loops. (See [pricing details](/docs/agents#pricing)).
          * Environment compute (CPU, memory, sandbox execution) is not billed during
            the preview period.
        
          ---
        
          * [Antigravity Agent](/docs/antigravity-agent)
          * All model inference is charged at standard Gemini list rates, including
            input,    
            output, and intermediate input / reasoning tokens generated during agentic    
            loops. (See [pricing details](/docs/agents#pricing)).
          * Environment compute (CPU, memory, sandbox execution) is not billed during
            the    
            preview period.
        {% /table %}
        
        ## Notes  {% id="notes" %}
        
        *     **Agentic video understanding:** When using agentic video understanding,
          token usage is variable based on the content loaded by the model rather than
          full video length. This typically results in up to 88% fewer input tokens
          for long-form video, though token counts depend on query complexity and
          dynamic sampling depth (which may exceed 1 FPS for detailed visual
          segments). See [Agentic video
          understanding](/docs/video-understanding#agentic-video-understanding).
        
        *     **Document token billing:** Tokens for the `DOCUMENT` modality (for example,
          PDFs) are billed at the image token rate. In API responses, these tokens
          appear under the `DOCUMENT` modality within `promptTokensDetails`.
        
        *     Google AI Studio usage is free of charge in all [available
          regions](/docs/available-regions). See [Billing FAQs](/docs/billing) for
          details.
        
        *     Prices may differ from the prices listed here and the prices offered on
          Gemini Enterprise Agent Platform. For Gemini Enterprise Agent Platform
          prices, see the [Gemini Enterprise Agent Platform pricing
          page](https://cloud.google.com/products/gemini-enterprise-agent-platform).
        
        *     If you are using [dynamic retrieval](/docs/google-search) to optimize costs,
          only requests that contain at least one grounding support URL from the web
          in their response are charged for Grounding with Google Search. Costs for
          Gemini always apply. Rate limits are subject to change.
        
        *     **Search Grounding rate limits:** On the Gemini Developer API, Grounding
          with Google Search on Gemini 3 and newer models is subject to a default
          daily rate limit of 1,500 requests per day (RPD) per project across all paid
          tiers, resetting daily at midnight Pacific Time. For high-volume production
          workloads requiring higher daily limits, consider using
          [Vertex AI](https://cloud.google.com/vertex-ai/generative-ai/docs/grounding/grounding-with-google-search#considerations),
