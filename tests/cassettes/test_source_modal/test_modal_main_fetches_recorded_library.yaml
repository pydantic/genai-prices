          - a88a3afce8d4
          - span
          - []
          - "GLM-5.3 uses the same base model as GLM-5.2; all of its gains come from post-training. It pairs a sparse Mixture-of-Experts with DeepSeek Sparse Attention and multi-head latent attention to reduce attention computation and KV-cache size, and reuses a single attention indexer across every four layers, cutting per-token FLOPs by 2.9x at a one-million-token context. Post-training focused on complex coding and long-horizon agentic work: Z.ai reports a 50% improvement over GLM-5.2 on its internal code bench and state-of-the-art vulnerability discovery on CyberGym. The thinking budget is adjustable via the reasoning_effort parameter (low, high, or max). Full details are in "
