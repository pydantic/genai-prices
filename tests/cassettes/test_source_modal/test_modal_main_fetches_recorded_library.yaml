          - span
          - []
          - >-
            DeepSeek V4 Pro Preview is a 61-layer Mixture-of-Experts transformer with 384
            routed experts and one shared expert per layer, with six routed experts activated
            per token, for 49B active out of 1.6T total parameters. Its hybrid attention
            interleaves Compressed Sparse Attention, which compresses the KV cache four-to-one
            before applying DeepSeek Sparse Attention, with Heavily Compressed Attention at a
            128-to-one ratio; at a one-million-token context it needs only 27 percent of the
            single-token inference FLOPs and 10 percent of the KV cache of DeepSeek V3.2.
            Pre-trained on more than 32 trillion tokens with the Muon optimizer, it supports tool
            calling and Non-think, Think High, and Think Max reasoning modes.
