          - span
          - []
          - "Kimi K2.6 is a 61-layer Mixture-of-Experts transformer on the DeepSeek V3 architecture: 384 routed experts plus one shared expert, 8 experts selected per token, Multi-head Latent Attention, a 160K-token vocabulary, and a 256K-token context window. Moonshot trained it for long-horizon coding across languages such as Rust, Go, and Python, coding-driven front-end design, and agent swarms that scale to 300 sub-agents executing 4,000 coordinated steps. It runs in a thinking mode with interleaved reasoning and multi-step tool calls or an instant mode without reasoning, and a preserve-thinking option carries reasoning across turns for coding agents."
