          - glm-5-3-nvfp4-p1-1
          - span
          - []
          - >-
            GLM-5.3 shares its base model with GLM-5.2, so every gain comes from scaled
            post-training on long-horizon task environments. Architecturally it is a 78-layer
            Mixture-of-Experts with 256 routed experts plus one shared expert, 8 experts active
            per token, 40B active parameters out of 753B total, and DeepSeek Sparse
            Attention with IndexShare supporting a 1M-token context. Z.ai reports a 50% improvement
            over GLM-5.2 on its in-house Z.ai Code Bench, open-source state of the art on
            Terminal Bench 3.0 and Agents' Last Exam, and emergent cyber capability on
            vulnerability discovery and exploitation benchmarks. Reasoning is always on, with a
            reasoning_effort parameter that accepts low, high, or max.
