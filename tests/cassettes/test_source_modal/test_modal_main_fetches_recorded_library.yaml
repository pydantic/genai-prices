          - "Qwen3.5-122B-A10B is a 48-layer hybrid model: each block of three Gated DeltaNet linear-attention layers is followed by one gated full-attention layer with 32 query heads and 2 key-value heads, and every layer routes through a 256-expert Mixture-of-Experts with 1,024-wide experts that activates 8 routed experts plus one shared expert, so only about 10B of its 122B parameters are used per token. Trained with early vision-language fusion, it accepts images alongside text, thinks by default before answering (thinking can be disabled per request), and is tuned for tool calling and agentic use. It supports 201 languages and dialects, a 262,144-token native context extensible to 1,010,000 tokens with YaRN, and includes a multi-token-prediction head for speculative decoding."
