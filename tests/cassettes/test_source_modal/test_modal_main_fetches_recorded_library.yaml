            parameters, 302M of them in embeddings and 698M non-embedding, trained by knowledge
            distillation on 2 trillion tokens. Unlike its 4B, 12B and 27B siblings it has no
            vision encoder and accepts text only, with a 32K-token input context and up to 8,192
            output tokens. It uses Gemma 3's 5:1 interleaving of local sliding-window and
            global attention layers, grouped-query attention with QK-norm, and a 262K-entry
            tokenizer shared with Gemini 2.0. Pretraining data spans more than 140 languages, and
            the family supports function calling and structured output for agentic workflows.
