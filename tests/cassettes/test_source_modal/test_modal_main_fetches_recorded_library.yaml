          - span
          - []
          - >-
            Nemotron 3 Ultra scales the Nemotron 3 hybrid design to 550 billion total
            parameters with 55 billion active per token. Its 108 layers interleave 48 Mamba-2
            layers, 48 latent Mixture-of-Experts layers with 512 routed experts plus one shared
            expert and 22 active per token, and 12 attention layers, so Mamba handles long
            sequences efficiently while attention preserves precise recall. Pre-training covered
            roughly 20 trillion tokens using an NVFP4 recipe, followed by supervised
            fine-tuning, asynchronous GRPO reinforcement learning, and Multi-Domain On-Policy
            Distillation from specialized teacher models. Multi-token prediction heads enable
            speculative decoding, context runs up to 1 million tokens, thinking is configurable
            via the chat template, and it supports ten languages including English, Chinese,
            Japanese, Korean, Hindi, and Brazilian Portuguese.
