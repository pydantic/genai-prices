          - qwen3-8-flash-next-fp8-p1-1
          - span
          - []
          - >-
            Qwen3.8-Flash-Next is an experimental preview of the architecture that will
            underpin Qwen4. Its 48 layers pair Gated DeltaNet with Qwen Sparse Attention (QSA),
            which indexes context at micro-block granularity to cut long-sequence attention
            cost, and every layer routes to 10 of 512 experts plus one shared expert. Gated
            Residual widens the residual stream into four branches with data-dependent read and
            write gates, and a 20-million-entry n-gram embedding table adds 51B parameters
            of capacity with very little extra compute. The result is a 125B-parameter main
            model with 6B active per token, default-on thinking with tunable reasoning_effort,
            and a 262,144-token native context extensible to 1M with YaRN.
