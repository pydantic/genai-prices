          - hy3-gptq-int4-p1-1
          - span
          - []
          - "Hy3 is a 299-billion-parameter Mixture-of-Experts model from the Tencent Hy Team that activates 21B parameters per token: 80 transformer layers, 192 routed experts with 8 activated per token, grouped-query attention with 64 heads and 8 KV heads, a 120,832-token vocabulary, and a 256K-token context window. A 3.8B-parameter multi-token-prediction (MTP) layer enables speculative decoding. Reasoning effort is selectable per request, from direct answers (no_think) through low to high chain-of-thought, and the model supports tool calling via dedicated parsers. Building on the Hy3 preview, Tencent scaled up RL post-training and reports gains on reasoning, agentic and long-context tasks alongside a lower hallucination rate and more stable tool calls."
