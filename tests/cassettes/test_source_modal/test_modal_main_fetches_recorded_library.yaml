          - span
          - []
          - >-
            Qwen3.5 2B is a 24-layer causal language model with a vision encoder, trained
            with early text-vision fusion so it handles text and images natively. Its hybrid
            layout repeats six blocks of three Gated DeltaNet linear-attention layers followed
            by one gated full-attention layer, for high-throughput, low-latency inference
            across its native 262,144-token context. The model uses a 2048-dimensional hidden
            state, a 248K-token vocabulary, tied input and output embeddings, and multi-token
            prediction training. It supports tool calling and 201 languages and dialects, and
            runs in non-thinking mode by default with thinking switchable through the chat
            template.
