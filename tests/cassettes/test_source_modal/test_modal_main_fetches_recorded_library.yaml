          - []
          - >-
            This checkpoint is NVIDIA's NVFP4 quantization of Kimi K2.6, produced with
            NVIDIA Model Optimizer by converting Moonshot's native INT4 weights to BF16 and then
            to NVFP4; only the linear operators inside the MoE transformer blocks are
            quantized. In NVIDIA's evaluation the NVFP4 checkpoint matches or exceeds the INT4
            baseline on SciCode, MMMU Pro, AA-LCR, and IFBench and trails it by at most 0.5 points
            on GPQA Diamond and τ²-Bench Telecom. The quantized weights are governed by the
            NVIDIA Open Model License, and the underlying Kimi K2.6 weights by Moonshot AI's
            Modified MIT License. 
