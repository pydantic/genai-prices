            sparse-attention layers, reducing per-token FLOPs by 2.9x at 1M context, and an
            improved multi-token-prediction layer raises speculative-decoding acceptance length
            by up to 20%. Effort levels high and max let you trade capability against speed
            and cost on agentic coding work.
