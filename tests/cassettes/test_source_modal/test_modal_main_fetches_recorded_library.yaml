          - "Qwen3.8-Flash-Next is Qwen's open-weight preview of the Qwen4 architecture: a Mixture-of-Experts with a 125B main model, 6B active parameters per token, 51B of n-gram embeddings, and Qwen Sparse Attention for cheap long context. This FP8 variant is quantized by Qwen under the Qwen Community License 1.0."
