          - qwen3-5-4b-p1-1
          - span
          - []
          - >-
            Qwen3.5 4B is a 32-layer causal language model with a vision encoder, trained
            with early text-vision fusion so it handles text and images natively. Its hybrid
            layout repeats eight blocks of three Gated DeltaNet linear-attention layers
            followed by one gated full-attention layer, for high-throughput, low-latency inference
            across a native 262,144-token context that can be extended to 1,010,000 tokens
            with YaRN scaling. The model uses a 2560-dimensional hidden state, a 248K-token
            vocabulary, and multi-token prediction training. It thinks by default, emitting
            reasoning inside think tags before answering, and can be switched to direct
            instruct-style responses. It supports tool calling and 201 languages and dialects.
          - []
