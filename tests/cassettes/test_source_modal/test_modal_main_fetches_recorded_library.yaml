          - span
          - []
          - >-
            Muse Glimmer is a 52-layer dense causal transformer distilled from Muse Spark
            and purpose-built for autonomous agents on consumer hardware. Attention alternates
            three sliding-window layers of 2,048 tokens with one global layer, using
            grouped-query attention with 32 query and 2 KV heads and RoPE on local layers only. The
            model chains multi-step reasoning over long horizons, invokes tools with precise
            schemas, recovers from failed tool calls, supports low, medium, high, and xhigh
            reasoning strengths, and is trained on data from more than 100 languages with a
            131,072-token context.
