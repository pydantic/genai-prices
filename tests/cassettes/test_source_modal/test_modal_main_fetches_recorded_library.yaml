          - span
          - []
          - >-
            Gemma 4 26B A4B is a 30-layer Mixture-of-Experts transformer with 128 routed
            experts plus one shared expert, of which 8 are active per token, so only 3.8B of
            its 25.2B parameters run at inference and it decodes at close to the speed of a 4B
            dense model. A ~550M-parameter vision encoder accepts images at variable aspect
            ratios and resolutions with a configurable visual token budget. Interleaved local
            sliding-window and global attention, with unified keys and values and
            Proportional RoPE in the global layers, supports a 256K-token context. It has a switchable
            thinking mode, native function calling and a system role, and scores 82.6% on MMLU
            Pro and 77.1% on LiveCodeBench v6.
