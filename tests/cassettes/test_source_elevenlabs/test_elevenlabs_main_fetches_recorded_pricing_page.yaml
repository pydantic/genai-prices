w-w-full tw-bg-black/5"></div><div class="tw-absolute tw-top-0 tw-h-0.25 tw-w-full tw-bg-black/5" style="width:calc(50vw - 50%);left:calc(-50vw + 50%)"></div><div class="tw-absolute tw-top-0 tw-h-0.25 tw-w-full tw-bg-black/5" style="width:calc(50vw - 50%);right:calc(-50vw + 50%)"></div></div><div class="tw-px-[var(--page-section-px)] tw-pt-[var(--page-section-pt)] tw-pb-[var(--page-section-pb)] [--page-section-px:var(--section-px-default)] [--page-section-pb:var(--section-py-lg)] [--page-section-pt:var(--section-py-lg)] [--full-bleed-section:var(--page-section-px)] [--full-bleed:var(--full-bleed-section)]"><script id="faq-structured-data-s743fj" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What are the per-product API rates?","acceptedAnswer":{"@type":"Answer","text":"API usage is billed in US dollars, not credits. Text to Speech $0.08 per 1,000 characters (multilingual models) or $0.04 (Flash/Turbo). Speech to Text $0.22 per hour (Scribe) or $0.39 per hour (Scribe realtime), with keyterm prompting $0.05 per hour and transcript editing $0.07 per hour. Eleven Music $0.15 per minute. Voice Changer and Voice Isolator $0.12 per minute. Sound Effects $0.12 per minute. Dubbing $0.33 per minute (automatic with watermark), $0.50 (automatic without watermark) or $0.50 (Dubbing Studio). Prices exclude taxes."}},{"@type":"Question","name":"How is usage metered?","acceptedAnswer":{"@type":"Answer","text":"Text to Speech is billed per character. Speech to Text is billed per audio minute. Music and Sound Effects are billed per generation. Dubbing is billed per source audio minute."}},{"@type":"Question","name":"How will I know how many characters/minutes I've used each month?","acceptedAnswer":{"@type":"Answer","text":"You can view how many characters/minutes you've used by logging into the ElevenLabs platform and navigating to the analytics tab within the Developers dashboard."}},{"@type":"Question","name":"Can I use custom voices via API?","acceptedAnswer":{"@type":"Answer","text":"Yes. You can reference any voice in your library by ID, including professional voices, cloned voices, and voices you've designed."}},{"@type":"Question","name":"Do you offer an Enterprise plan and support?","acceptedAnswer":{"@type":"Answer","text":"Yes. Enterprise plans include dedicated support, SLAs, custom rate limits, SSO, SOC 2 compliance, and MSAs."}},{"@type":"Question","name":"What happens if I upgrade, downgrade, or cancel my subscription?","acceptedAnswer":{"@type":"Answer","text":"If you upgrade to a higher plan, any unused credits from your previous plan will roll over into the next billing cycle. If you downgrade or cancel your subscription, your subscription will remain active until the end of the current billing cycle. After that, your account will be downgraded to the Free plan and any unused paid credits will expire."}},{"@type":"Question","name":"When can I cancel my subscription?","acceptedAnswer":{"@type":"Answer","text":"You can cancel your subscription at any time. Your subscription will remain active until the end of your current billing cycle, after which it will not renew and your account will be downgraded to the Free plan."}},{"@type":"Question","name":"What kind of payment do you accept?","acceptedAnswer":{"@type":"Answer","text":"We accept Credit Card, Apple Pay, and Google Pay. Subscriptions are billed on a monthly or yearly basis starting from the day you subscribe."}}]}]}</script><div class="block-el block-el-faqs tw-container"><div class="lg:tw-flex"><h2 class="tw-type-5xl tw-text-black tw-text-balance tw-flex-none tw-mb-12 lg:tw-min-w-80 lg:tw-pr-10 lg:tw-mb-0 lg:tw-w-[calc((100%+5rem)/3-2rem)]">FAQs</h2><div class="tw-flex-auto"><div class="tw-flow-root"><div class="tw-group tw-relative tw-isolate -tw-mt-5" data-rac><h3 class="tw-relative tw-z-50"><button id="react-aria-_R_ql3f8lubr5ubsnitupfivbH1_" class="tw-