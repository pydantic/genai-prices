          };
          const renderSearchInputs = () => <div className="flex flex-col gap-4">
              <div className="flex items-center justify-between gap-4">
                <div>
                  <label id="calc-search-fast-label" htmlFor="calc-search-fast" className="block text-sm" style={fg}>Fast mode</label>
                  <p id="calc-search-fast-help" className="text-xs tabular-nums" style={muted}>
