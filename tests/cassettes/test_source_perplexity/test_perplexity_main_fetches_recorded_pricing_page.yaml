        ## Decisions API Pricing
        
        The Decisions API answers yes/no, multiple-choice, and scored questions about text and images with calibrated probabilities.
        
        | Model | Price (\$/1M input tokens) | Output tokens | Per-request fee |
        | - | :-: | :-: | :-: |
        | `pplx-decider-v1.2` | \$0.02 | Free | None |
        | `pplx-decider-flash-v1.2` | \$0.01 | Free | None |
        
        <Note>
          **Aliases:** `pplx-decider-latest` and `perplexity/pplx-decider-latest` select `pplx-decider-v1.2`. `pplx-decider-flash-latest` and `perplexity/pplx-decider-flash-latest` select `pplx-decider-flash-v1.2`. An alias bills at the rate of the model it selects. Requests that name `pplx-decider-v1.1-27b` or `pplx-decider-v1-27b` select `pplx-decider-v1.2` and bill at \$0.02.
        
          **Billing unit:** you pay for input tokens only. The `state`, every question, and any images count as input; the response reports the exact number as `usage.input_tokens`, so you can compute the cost of a request from the response you already receive. A request with 600 input tokens costs \$0.000012 on `pplx-decider-v1.2` and \$0.000006 on `pplx-decider-flash-v1.2`.
        </Note>
        
        <Card title="View Decisions API Documentation" icon="scale-balanced" href="/docs/decisions/quickstart">
          Learn how to ask structured questions and read the probabilities the Decisions API returns.
        </Card>
        
        <AccordionGroup>
          <Accordion title="Token and Cost Glossary">
            ### Input Tokens
        
            The number of tokens in your prompt or message to the API. This includes:
        
            * Your question or instruction
            * Any context or examples you provide
            * System messages and formatting
        
            **Example:** "What is the weather in New York?" = \~8 input tokens
        
            ### Output Tokens
        
            The number of tokens in the API's response. This includes:
        
            * The generated answer or content
            * Any explanations or additional context
            * Search results and references
        
            **Example:** "The weather in New York is currently sunny with a temperature of 72°F." = \~15 output tokens
        
            ### Search Context Size vs Context Window
        
            **Search context size** is *not* the same as the **context window**.
        
            * **Search context size** (Sonar only): How much web information is retrieved during search, set with `web_search_options.search_context_size`
            * **Context window**: Maximum tokens the model can process in one request (affects token limits)
        
            <Info>
              **Token Calculation:** 1 token ≈ 4 characters in English text. The exact count may vary based on language and content complexity.
            </Info>
          </Accordion>
        </AccordionGroup>
        
