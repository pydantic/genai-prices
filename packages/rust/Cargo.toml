[package]
name = "genai-prices"
# Placeholder: as for the other packages, the published version comes from the release tag.
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Calculate the price of generative AI API calls"
license = "MIT"
repository = "https://github.com/pydantic/genai-prices"
homepage = "https://github.com/pydantic/genai-prices/tree/main/packages/rust"
readme = "README.md"
keywords = ["llm", "genai", "pricing", "openai", "anthropic"]
categories = ["api-bindings", "finance"]
include = ["/src", "/data/prices.json", "/README.md", "/LICENSE"]

[features]
default = ["bundled"]
# Embeds the price data published with this release and enables `Calculator::bundled`, `calculate` and
# `extract_usage`. Without it, load data with `Calculator::from_json`.
bundled = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
fancy-regex = "0.19"
serde = "1.0.180"
serde_json = "1.0.100"

[dev-dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["std"] }
serde = { version = "1.0.180", features = ["derive"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
struct_field_names = "allow"
