[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

# The version is derived from the git tag (`vX.Y.Z`) at build time, so a release is just a GitHub
# release; nothing in the repo is bumped. Between tags, builds get `X.Y.(Z+1).devN+g<sha>`.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[project]
name = "genai-prices"
dynamic = ["version"]
description = "Calculate prices for calling LLM inference APIs."
readme = "README.md"
authors = [{ name = "Samuel Colvin", email = "samuel@pydantic.dev" }]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
]
dependencies = [
    "httpx2>=2.0",
    "pydantic>=2.10",
]

[project.optional-dependencies]
cli = [
    "pydantic-settings>=2.11",
    "rich>=14.3.2",
    "rich-argparse>=1.7.2",
]

[project.scripts]
genai-prices = "genai_prices._cli:cli"

[project.urls]
Homepage = "https://github.com/pydantic/genai-prices"
Source = "https://github.com/pydantic/genai-prices"
Changelog = "https://github.com/pydantic/genai-prices/releases"

[tool.hatch.build.targets.wheel]
packages = ["genai_prices"]
