name: Add provider request note

on:
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  add-note:
    if: >-
      contains(github.event.issue.body, '### Provider name') &&
      contains(github.event.issue.body, '### Provider website') &&
      contains(github.event.issue.body, '### Pricing') &&
      contains(github.event.issue.body, '### Evidence of usage')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const note = 'If you want this provider to be supported, please give this issue a thumbs up (👍).';
            if (!issue.body.includes(note)) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: context.issue.number,
                body: `${issue.body}\n\n---\n\n${note}`,
              });
            }
