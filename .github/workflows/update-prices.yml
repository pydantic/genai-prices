name: Update prices

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: update-prices
  cancel-in-progress: false

env:
  UV_PYTHON: 3.13
  UV_FROZEN: "1"
  BRANCH: automation/hourly-price-update

jobs:
  import:
    name: import ${{ matrix.importer }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      expected-count: ${{ steps.patch.outputs.expected-count }}
    strategy:
      fail-fast: false
      matrix:
        importer:
          - anthropic
          - arcee
          - avian
          - azure
          - aws
          - baseten
          - cerebras
          - cloudflare
          - cursor
          - databricks
          - doubleword
          - fireworks
          - github-copilot
          - google
          - groq
          - huggingface
          - meta
          - minimax
          - mistral
          - modal
          - moonshotai
          - novita
          - openai
          - openai-decisions
          - openrouter-provider
          - ovhcloud
          - perplexity
          - quicksilverpro
          - together
          - typesafe
          - voyageai
          - xai
          - zai
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: false
      - run: uv sync --all-packages
      - run: |
          set -o pipefail
          make "${IMPORTER}-get" | tee "$RUNNER_TEMP/importer.log"
        env:
          IMPORTER: ${{ matrix.importer }}
      - name: Keep the diff unless it only bumps prices_checked
        id: patch
        env:
          IMPORTER: ${{ matrix.importer }}
          EXPECTED_COUNT: ${{ strategy.job-total }}
        run: |
          mkdir -p "$RUNNER_TEMP/patches"
          : > "$RUNNER_TEMP/patches/$IMPORTER.patch"
          git add --intent-to-add prices/providers
          if git diff -U0 -- prices/providers | grep -E '^[-+] ' | grep -qvE '^[-+] +prices_checked: '; then
            git diff --binary -- prices/providers > "$RUNNER_TEMP/patches/$IMPORTER.patch"
          fi
          echo "expected-count=$EXPECTED_COUNT" >> "$GITHUB_OUTPUT"
          # Rates the importer saw change but couldn't write, listed on the price update PR for a person to apply.
          grep -E 'update them by hand|kept .+ unchanged|reports others' "$RUNNER_TEMP/importer.log" \
            > "$RUNNER_TEMP/patches/$IMPORTER.notes" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-${{ matrix.importer }}
          path: ${{ runner.temp }}/patches
          if-no-files-found: error

  pull-request:
    needs: import
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      created-pr-url: ${{ steps.pr.outputs.created-pr-url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patch-*
          path: ${{ runner.temp }}/patches
          merge-multiple: true
      - name: Apply importer patches
        id: apply
        env:
          IMPORT_RESULT: ${{ needs.import.result }}
          EXPECTED_COUNT: ${{ needs.import.outputs.expected-count }}
        run: |
          shopt -s nullglob
          patches=("$RUNNER_TEMP"/patches/*.patch)
          notes=("$RUNNER_TEMP"/patches/*.notes)
          if [ "$IMPORT_RESULT" != success ] || [ "${#patches[@]}" != "$EXPECTED_COUNT" ] || [ "${#notes[@]}" != "$EXPECTED_COUNT" ]; then
            echo '::error::Incomplete importer evidence; preserving the existing price proposal'
            exit 1
          fi
          applied=()
          for patch in "${patches[@]}"; do
            [ -s "$patch" ] || continue
            name="$(basename "$patch" .patch)"
            git apply --index "$patch"
            applied+=("$name")
          done
          echo "importers=${applied[*]}" >> "$GITHUB_OUTPUT"
      - if: steps.apply.outputs.importers != ''
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: false
      - if: steps.apply.outputs.importers != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      - if: steps.apply.outputs.importers != ''
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: packages/go/go.mod
          cache: false
      - if: steps.apply.outputs.importers != ''
        run: |
          uv sync --all-packages
          npm ci
          make collapse-models build
          # extract_usages.py exits non-zero after rewriting a stale file; a second run fails only on a real error.
          uv run python tests/dataset/extract_usages.py || uv run python tests/dataset/extract_usages.py
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PRICE_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRICE_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Write the pull request description
        env:
          IMPORTERS: ${{ steps.apply.outputs.importers }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf 'Prices fetched from official provider APIs and docs by [this run](%s).\n\n' "$RUN_URL"
            printf 'Importers with changes: %s\n\n' "$IMPORTERS"
            printf 'Rate changes use date-only entries. Additional changes on the same date need manual review.\n'
            if notes="$(cat "$RUNNER_TEMP"/patches/*.notes 2>/dev/null)" && [ -n "$notes" ]; then
              printf '\n## Needs a manual update\n\nThese rates changed but could not be updated automatically:\n\n'
              sed 's/^/- /' <<< "$notes"
            fi
          } > "$RUNNER_TEMP/pr-body.md"
      - id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name 'genai-prices-automation[bot]'
          git config user.email 'genai-prices-automation[bot]@users.noreply.github.com'
          body="$RUNNER_TEMP/pr-body.md"
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          git add --all
          if git diff --cached --quiet; then
            if [ -n "$pr" ]; then
              gh pr close "$pr" --comment 'No automatically publishable changes remain. Unresolved source differences are tracked in the manual price review issue.'
            fi
            exit 0
          fi
          git switch -c "$BRANCH"
          git commit --quiet -m 'Update provider prices from official sources'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Compare trees independently of the PR body: manual notes can change without a data change.
          if [ -n "$pr" ]; then
            git fetch --quiet "$remote" "$BRANCH"
            if [ "$(git rev-parse FETCH_HEAD^{tree})" != "$(git rev-parse HEAD^{tree})" ]; then
              git push --force "$remote" "HEAD:$BRANCH"
            fi
            gh pr view "$pr" --json body --jq .body > "$RUNNER_TEMP/previous-body.md"
            # A new run link alone does not warrant an hourly edit.
            sed -E 's@actions/runs/[0-9]+@actions/runs/RUN@g' "$body" > "$RUNNER_TEMP/body-normalized.md"
            sed -E 's@actions/runs/[0-9]+@actions/runs/RUN@g' "$RUNNER_TEMP/previous-body.md" > "$RUNNER_TEMP/previous-normalized.md"
            if [ "$(cat "$RUNNER_TEMP/body-normalized.md")" != "$(cat "$RUNNER_TEMP/previous-normalized.md")" ]; then
              gh pr edit "$pr" --body-file "$body"
            fi
          else
            git push --force "$remote" "HEAD:$BRANCH"
            echo "created-pr-url=$(gh pr create --head "$BRANCH" --title 'Update provider prices from official sources' --body-file "$body")" >> "$GITHUB_OUTPUT"
          fi

  manual-updates:
    needs: import
    if: ${{ !cancelled() && needs.import.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      created-issue-url: ${{ steps.report.outputs.created-issue-url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patch-*
          path: ${{ runner.temp }}/patches
          merge-multiple: true
      - id: report
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COUNT: ${{ needs.import.outputs.expected-count }}
        run: |
          shopt -s nullglob
          notes=("$RUNNER_TEMP"/patches/*.notes)
          [ "${#notes[@]}" = "$EXPECTED_COUNT" ]
          title='Provider prices needing manual review'
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" \
            --json number,title,author | jq -r '.[] | select(.title == "Provider prices needing manual review" and (.author.login == "github-actions[bot]" or .author.login == "app/github-actions")) | .number')"
          sort -u "${notes[@]}" | sed '/^$/d; s/^/- /' > "$RUNNER_TEMP/manual-notes.md"
          body="$RUNNER_TEMP/manual-body.md"
          if [ ! -s "$RUNNER_TEMP/manual-notes.md" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment 'All importers completed without reporting manual updates.'
            fi
            exit 0
          fi
          {
            printf 'The hourly price importers reported changes that need manual review.\n\n'
            printf 'This report is refreshed after a complete successful import; unchanged reports do not notify again.\n\n'
            cat "$RUNNER_TEMP/manual-notes.md"
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$issue" ]; then
            gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/previous-manual-body.md"
            if [ "$(cat "$body")" != "$(cat "$RUNNER_TEMP/previous-manual-body.md")" ]; then
              gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$body"
            fi
          else
            echo "created-issue-url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body")" >> "$GITHUB_OUTPUT"
          fi

  notify-manual:
    needs: manual-updates
    if: ${{ !cancelled() && needs.manual-updates.outputs.created-issue-url != '' }}
    permissions: {}
    uses: ./.github/workflows/price-update-slack.yml
    with:
      pr-url: ${{ needs.manual-updates.outputs.created-issue-url }}
      message: "GenAI Prices needs a manual price update:"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify:
    needs: pull-request
    if: ${{ !cancelled() && needs.pull-request.outputs.created-pr-url != '' }}
    permissions: {}
    uses: ./.github/workflows/price-update-slack.yml
    with:
      pr-url: ${{ needs.pull-request.outputs.created-pr-url }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  importer-failure:
    needs: import
    if: ${{ !cancelled() && needs.import.result == 'failure' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      newly-failing: ${{ steps.previous.outputs.newly-failing }}
    steps:
      # ponytail: alerts on the first failing run only; a second importer breaking while one is still red stays silent.
      - id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update-prices.yml --branch main --event schedule \
            --status completed --limit 1 --json databaseId --jq '.[0].databaseId')"
          conclusions=''
          if [ -n "$run_id" ]; then
            # Assigned on its own so a failed lookup fails the step instead of looking like a new failure.
            conclusions="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.name | startswith("import ")) | .conclusion')"
          fi
          if grep -qx failure <<< "$conclusions"; then
            echo 'newly-failing=false' >> "$GITHUB_OUTPUT"
          else
            echo 'newly-failing=true' >> "$GITHUB_OUTPUT"
          fi

  notify-failure:
    needs: importer-failure
    if: ${{ !cancelled() && needs.importer-failure.outputs.newly-failing == 'true' }}
    permissions: {}
    uses: ./.github/workflows/price-update-slack.yml
    with:
      pr-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      message: "A GenAI Prices importer started failing:"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
