name: Update prices

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: update-prices
  cancel-in-progress: false

env:
  UV_PYTHON: 3.13
  UV_FROZEN: "1"
  BRANCH: automation/hourly-price-update

jobs:
  import:
    name: import ${{ matrix.importer }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        importer:
          - anthropic
          - arcee
          - avian
          - baseten
          - cerebras
          - cloudflare
          - cursor
          - doubleword
          - github-copilot
          - google
          - groq
          - huggingface
          - meta
          - minimax
          - moonshotai
          - novita
          - openai-decisions
          - openrouter-provider
          - ovhcloud
          - perplexity
          - quicksilverpro
          - together
          - typesafe
          - voyageai
          - xai
          - zai
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: false
      - run: uv sync --all-packages
      - run: make "${IMPORTER}-get"
        env:
          IMPORTER: ${{ matrix.importer }}
      - name: Keep the diff unless it only bumps prices_checked
        env:
          IMPORTER: ${{ matrix.importer }}
        run: |
          mkdir -p "$RUNNER_TEMP/patches"
          : > "$RUNNER_TEMP/patches/$IMPORTER.patch"
          git add --intent-to-add prices/providers
          if git diff -U0 -- prices/providers | grep -E '^[-+] ' | grep -qvE '^[-+] +prices_checked: '; then
            git diff --binary -- prices/providers > "$RUNNER_TEMP/patches/$IMPORTER.patch"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-${{ matrix.importer }}
          path: ${{ runner.temp }}/patches
          if-no-files-found: error

  pull-request:
    needs: import
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      created-pr-url: ${{ steps.pr.outputs.created-pr-url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: patch-*
          path: ${{ runner.temp }}/patches
          merge-multiple: true
      - name: Apply importer patches
        id: apply
        run: |
          applied=()
          for patch in "$RUNNER_TEMP"/patches/*.patch; do
            [ -s "$patch" ] || continue
            name="$(basename "$patch" .patch)"
            if git apply --index "$patch"; then
              applied+=("$name")
            else
              echo "::warning::The $name patch no longer applies to main"
            fi
          done
          echo "importers=${applied[*]}" >> "$GITHUB_OUTPUT"
      - if: steps.apply.outputs.importers != ''
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: false
      - if: steps.apply.outputs.importers != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      - if: steps.apply.outputs.importers != ''
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: packages/go/go.mod
          cache: false
      - if: steps.apply.outputs.importers != ''
        run: |
          uv sync --all-packages
          npm ci
          make collapse-models build
          # extract_usages.py exits non-zero after rewriting a stale file; a second run fails only on a real error.
          uv run python tests/dataset/extract_usages.py || uv run python tests/dataset/extract_usages.py
      - if: steps.apply.outputs.importers != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PRICE_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRICE_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - if: steps.apply.outputs.importers != ''
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMPORTERS: ${{ steps.apply.outputs.importers }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name 'genai-prices-automation[bot]'
          git config user.email 'genai-prices-automation[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add --all
          git commit --quiet -m 'Update provider prices from official sources'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The branch is rebuilt from main every hour, so only push when the result differs.
          if git fetch --quiet "$remote" "$BRANCH" && [ "$(git rev-parse FETCH_HEAD^{tree})" = "$(git rev-parse HEAD^{tree})" ]; then
            echo 'The open price update already has these changes'
            exit 0
          fi
          git push --force "$remote" "HEAD:$BRANCH"
          body="$(printf 'Prices fetched from official provider APIs and docs by [this run](%s).\n\nImporters with changes: %s\n\nEach rate change is a new dated entry, so past usage keeps its old price.' "$RUN_URL" "$IMPORTERS")"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body "$body"
          else
            echo "created-pr-url=$(gh pr create --head "$BRANCH" --title 'Update provider prices from official sources' --body "$body")" >> "$GITHUB_OUTPUT"
          fi

  notify:
    needs: pull-request
    if: needs.pull-request.outputs.created-pr-url != ''
    permissions: {}
    uses: ./.github/workflows/price-update-slack.yml
    with:
      pr-url: ${{ needs.pull-request.outputs.created-pr-url }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  importer-failure:
    needs: import
    if: ${{ !cancelled() && needs.import.result == 'failure' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      newly-failing: ${{ steps.previous.outputs.newly-failing }}
    steps:
      # ponytail: alerts on the first failing run only; a second importer breaking while one is still red stays silent.
      - id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update-prices.yml --branch main --event schedule \
            --status completed --limit 1 --json databaseId --jq '.[0].databaseId')"
          conclusions=''
          if [ -n "$run_id" ]; then
            # Assigned on its own so a failed lookup fails the step instead of looking like a new failure.
            conclusions="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.name | startswith("import ")) | .conclusion')"
          fi
          if grep -qx failure <<< "$conclusions"; then
            echo 'newly-failing=false' >> "$GITHUB_OUTPUT"
          else
            echo 'newly-failing=true' >> "$GITHUB_OUTPUT"
          fi

  notify-failure:
    needs: importer-failure
    if: needs.importer-failure.outputs.newly-failing == 'true'
    permissions: {}
    uses: ./.github/workflows/price-update-slack.yml
    with:
      pr-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      message: "A GenAI Prices importer started failing:"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
