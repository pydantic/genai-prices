name: Finish price update

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- Runs only immutable default-branch code with same-repository guards.
    workflows: [Update prices, Price update repair, Model Price Check]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [genie-pricer-repair-request]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Price proposal number (blank checks every open proposal)
        type: string
        default: ""

permissions: {}

# A queued on-demand request must not be replaced by a later automatic trigger.
concurrency:
  group: finish-price-update
  cancel-in-progress: false
  queue: max

jobs:
  select:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'repository_dispatch' && github.event.sender.login == 'pydanty[bot]') || github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.select.outputs.prs }}
    steps:
      # workflow_run uses trusted default-branch code, never the reviewed PR's scripts.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./scripts/price_update_finisher.cjs').select({ github, context, core });
  watch:
    needs: select
    if: ${{ needs.select.outputs.prs != '[]' }}
    # One job per proposal: each waits at most 30 minutes, and one proposal's failure does not stop another's watch.
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      checks: read
      contents: write # repository_dispatch starts the isolated repair workflow
      issues: write # bounded repair state and evidence live on the proposal
      pull-requests: write # a comment on a PR needs pull_requests=write alongside issues=write
      statuses: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ matrix.pr }}
        with:
          script: |
            await require('./scripts/price_update_finisher.cjs').watch({ github, context, core, prNumber: Number(process.env.PR_NUMBER) });
