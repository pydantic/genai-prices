# Providers covered by agentic-price-check.md.
providers:
  - name: OpenAI
    file: prices/providers/openai.yml
    scope: Public OpenAI API models with standard on-demand prices.
    sources:
      - https://developers.openai.com/api/docs/pricing.md
    notes: >-
      Model arrays such as ["gpt-4o", 2.5, 1.25, 10] mean model ID, input, cached input, and output in USD per 1M tokens.
      Map them to input_mtok, cache_read_mtok, and output_mtok. Do not substitute Batch, Flex, Priority, fine-tuning, or
      Fast-mode rates for standard rates. Preserve existing special-rate records. This is a pricing page, not a complete
      catalog; do not infer removals from it.

  - name: Anthropic
    file: prices/providers/anthropic.yml
    scope: Public Anthropic API models with standard on-demand prices and web-search charges.
    sources:
      - https://platform.claude.com/docs/en/about-claude/pricing.md
    notes: >-
      Map Base Input Tokens to input_mtok, Output Tokens to output_mtok, 5m Cache Writes to cache_write_mtok,
      1h Cache Writes to cache_write_1h_mtok, and Cache Hits & Refreshes to cache_read_mtok. In the tool-use section,
      $10 per 1,000 web searches maps to web_searches_kcount: 10. Do not substitute Batch or Fast-mode rates for standard
      rates. Preserve existing special-rate records. This is a pricing page, not a complete catalog; do not infer removals.

  - name: Google (Gemini)
    file: prices/providers/google.yml
    scope: Gemini API models, Vertex-hosted Gemini and partner models, and token-priced Gemini TTS models.
    sources:
      - https://ai.google.dev/gemini-api/docs/pricing
      - https://cloud.google.com/vertex-ai/generative-ai/pricing
      - https://cloud.google.com/text-to-speech/pricing#gemini-tts
    notes: >-
      Match each model's price_comments source and endpoint scope. Use the Gemini API page for Gemini API models, the
      Vertex AI page for Vertex-hosted Gemini and partner models, and the Gemini-TTS section for Gemini TTS. Do not substitute
      native Anthropic rates for Vertex-hosted Claude or regional rates for a recorded global endpoint. Compare the paid
      tier in USD per 1M tokens. Map text input to input_mtok, audio input to input_audio_mtok, cached text to cache_read_mtok,
      and cached audio to cache_audio_read_mtok. Preserve separately quoted image, video, and image-output rates with their
      registry keys. Map Gemini TTS token rates to input_mtok and output_mtok, never conventional TTS character prices.
      A <= 200000 / > 200000 prompt-size split uses tier start: 200000 because the engines apply tiers only above start.
      Exclude Batch and provisioned capacity. These are pricing pages, not complete catalogs; do not infer removals.

  - name: Mistral
    file: prices/providers/mistral.yml
    scope: Public Mistral API models with standard on-demand prices.
    sources:
      - https://mistral.ai/pricing/api
    notes: >-
      Map the standard API table's input and output columns, in USD per 1M tokens, to input_mtok and output_mtok.
      Exclude Batch and provisioned capacity. Preserve existing special-rate records. Aliases such as mistral-large-latest
      are not separate models. Skip ambiguous marketing names. This is a pricing page, not a complete catalog; do not
      infer removals.

  - name: DeepSeek
    file: prices/providers/deepseek.yml
    scope: Public DeepSeek API models.
    sources:
      - https://api-docs.deepseek.com/quick_start/pricing
    notes: >-
      The first two YAML models use a legacy schedule. Do not assume it matches the current policy. DeepSeek has announced daily
      peak hours at UTC 01:00-04:00 and 06:00-10:00 with 2x pricing, but compare that tier only after the official page publishes
      an effective date on or before the run date.

  - name: xAI
    file: prices/providers/x_ai.yml
    scope: Public xAI text-generation models represented by the YAML, including models that accept image input.
    sources:
      - https://docs.x.ai/developers/models
      - https://docs.x.ai/developers/pricing
    notes: >-
      Follow model links from the catalog only when the catalog does not show a recorded field. Model aliases do not count as
      separate missing models.

  - name: Groq
    file: prices/providers/groq.yml
    scope: Production and preview models on GroqCloud, excluding Compound systems unless the YAML represents them.
    sources:
      - https://console.groq.com/docs/models
    notes: >-
      Use the on-demand price. Treat Contact Sales and blank prices as unchecked, not as numeric prices.

  - name: Cerebras
    file: prices/providers/cerebras.yml
    scope: Models returned by the public Cerebras Inference API.
    sources:
      - https://api.cerebras.ai/public/v1/models
    notes: >-
      The public API is the catalog and pricing source. Its OpenRouter-style prompt and completion decimal values are USD per
      token, so multiply them by 1,000,000 before comparing them with input_mtok and output_mtok.

  - name: MiniMax
    file: prices/providers/minimax.yml
    scope: Public international-platform models with pay-as-you-go USD pricing.
    sources:
      - https://platform.minimax.io/docs/guides/pricing-paygo
    notes: >-
      Compare the M2.7-highspeed, M2.5-highspeed, and M2.1-highspeed models only with their same-named official rows. M3 Priority
      is a separate service tier priced at 1.5x standard and is not represented in the YAML; do not map it to highspeed or compare
      it. Do not compare subscription token-plan prices.

  - name: MoonshotAI
    file: prices/providers/moonshotai.yml
    scope: Public Moonshot platform chat models.
    sources:
      - https://platform.kimi.ai/docs/models.md
      - https://platform.kimi.ai/docs/pricing/chat-k3.md
      - https://platform.kimi.ai/docs/pricing/chat-k27-code.md
      - https://platform.kimi.ai/docs/pricing/chat-k26.md
      - https://platform.kimi.ai/docs/pricing/chat-k25.md
      - https://platform.kimi.ai/docs/pricing/chat-v1.md
    notes: >-
      models.md is the catalog and lists discontinued models; the other sources are plain-markdown pricing pages, one per
      model family (index: https://platform.kimi.ai/docs/llms.txt). The pricing/chat overview page has no per-model prices. Match exact API model IDs. Compare cache-hit, input, and output columns separately when the page publishes them.

  - name: Avian
    file: prices/providers/avian.yml
    scope: Models in Avian's public serverless catalog.
    sources:
      - https://avian.io/docs/
    notes: >-
      The docs catalog is authoritative for model IDs, prices, and context windows.

  - name: Perplexity
    file: prices/providers/perplexity.yml
    scope: Public Sonar API models and their search, reasoning, and citation charges.
    sources:
      - https://docs.perplexity.ai/docs/getting-started/pricing
    notes: >-
      The YAML intentionally records the highest published request-band price in requests_kcount. Compare reasoning and citation
      token rates separately for Sonar Deep Research.

  - name: Cohere
    file: prices/providers/cohere.yml
    scope: Pay-as-you-go generation and embedding models represented by the YAML. Exclude Rerank and Model Vault.
    sources:
      - https://cohere.com/pricing
    notes: >-
      Compare production API usage prices. Do not compare trial, dedicated-instance, or Model Vault prices.

  - name: Voyage AI
    file: prices/providers/voyageai.yml
    scope: Text embedding models only. Exclude rerankers and multimodal embedding models.
    sources:
      - https://docs.voyageai.com/docs/pricing
    notes: >-
      Compare the standard per-million-token price with input_mtok. Do not apply the Batch API discount or free-token allowance.

  - name: Cloudflare Workers AI
    file: prices/providers/cloudflare.yml
    scope: Token-priced models in Cloudflare's public catalog. Exclude image and audio models.
    sources:
      - https://developers.cloudflare.com/workers-ai/platform/pricing/index.md
    notes: >-
      Compare per-million input, cached-input, and output token prices with input_mtok, cache_read_mtok, and output_mtok. Ignore
      the account-wide free Neuron allocation. This YAML deliberately covers only token-priced models. Do not add image, tile,
      step, character, or audio-minute prices during this check.

  - name: Cursor
    file: prices/providers/cursor.yml
    scope: Cursor Models pool variants with public on-demand token pricing.
    sources:
      - https://cursor.com/docs/models-and-pricing
    notes: >-
      The Cursor Models table is the complete in-scope catalog. Compare Input, Cache Read, and Output with input_mtok,
      cache_read_mtok, and output_mtok. Cache Write is not priced. Treat each Fast row as a separate variant. Exclude third-party
      models, the Cursor Token Rate, usage pools, plan allowances, regional uplifts, Legacy Enterprise Auto, and legacy Max Mode.

  - name: Arcee
    file: prices/providers/arcee.yml
    scope: Models in Arcee's public Text Models pricing table.
    sources:
      - https://docs.arcee.ai/get-started/pricing
    notes: >-
      The Text Models table is the complete in-scope catalog. Compare Input, Cached, and Output with input_mtok,
      cache_read_mtok, and output_mtok. Exclude context windows and image, request, and cache-write rates because the public
      pricing page does not publish them. Match exact model IDs and do not treat their third-party namespaces as provider
      ownership.

  - name: Baseten
    file: prices/providers/baseten.yml
    scope: Models in Baseten's public Model APIs catalog and pricing table.
    sources:
      - https://docs.baseten.co/inference/model-apis/overview.md
      - https://www.baseten.co/pricing/
    notes: >-
      The docs table is authoritative for API model IDs and context windows. The pricing table is authoritative for per-million
      input, cached-input, and output token rates. Match the two tables by their Model API links; some pricing links use short
      aliases while the docs table publishes qualified model IDs. A missing cached-input value is intentional only when the
      pricing table displays a dash. Do not treat third-party namespaces as Baseten provider ownership.

  - name: GitHub Copilot
    file: prices/providers/github_copilot.yml
    scope: Chat models named on GitHub's Copilot models-and-pricing page.
    sources:
      - https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
    notes: >-
      The page prices models in USD per million tokens; compare Input, Cached input, Cache write, and Output with input_mtok,
      cache_read_mtok, cache_write_mtok, and output_mtok. A Default/Long context pair is one model whose long-context row is the
      YAML tier; those rows read `<= N` and `> N`, so the YAML tier `start` is exactly N, because the engines apply a tier only
      above `start`. A row that names several versions covers each of them. Report a range, not a single number, as a range
      rather than a discrepancy. The page is a pricing table, not a catalog, so do not infer removals from it, and do not compare
      plan allowances, the AI-credit conversion, or the zero-priced models the YAML records with empty prices.

  - name: Databricks
    file: prices/providers/databricks.yml
    scope: Databricks-hosted open-weight models in the Standard Pay Per Token table of the Foundation Model Serving page.
    sources:
      - https://www.databricks.com/product/pricing/foundation-model-serving
      - https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models
    notes: >-
      The pricing page publishes DBU per 1M tokens, not USD. Multiply each Standard Pay Per Token Input, Output, and Cache read
      rate by 0.070 USD per DBU and round to 0.001 before comparing it with input_mtok, output_mtok, and cache_read_mtok; each
      model's price_comments records its DBU rates. Map table rows to endpoints through the supported-models catalog: the
      GLM-5.2, 5.3 row prices both GLM endpoints, Qwen 3 80B Instruct is databricks-qwen3-next-80b-a3b-instruct, and Kimi K2.7 is
      databricks-kimi-k2-7-code. The catalog lists every current pay-per-token endpoint. Exclude Priority Pay Per Token,
      Provisioned Throughput, Batch Inference, per-region DBU prices, and the proprietary Claude, GPT, Gemini, and Grok
      endpoints. The open-weight GPT OSS and Gemma endpoints are in scope.
