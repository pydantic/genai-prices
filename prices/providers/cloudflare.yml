# yaml-language-server: $schema=.schema.json
name: Cloudflare Workers AI
id: cloudflare
pricing_urls:
  - https://developers.cloudflare.com/workers-ai/platform/pricing/
  - https://developers.cloudflare.com/workers-ai/models/
api_pattern: 'https://api\.cloudflare\.com/client/v4/accounts/[^/]+/ai(?:/|$)'
model_match:
  starts_with: "@cf/"
provider_match:
  contains: cloudflare
price_comments: >-
  Paid Workers plan rates, expressed using Cloudflare's token-equivalent prices. Calculations do not apply the
  account-wide free allocation of 10,000 Neurons per day. Image and audio models are omitted because their billing
  units are not representable by the published v2 unit registry.

# Cloudflare supports OpenAI-compatible chat completions, responses, and embeddings endpoints.
# https://developers.cloudflare.com/workers-ai/configuration/open-ai-compatibility/
extractors:
  - api_flavor: default
    root: [result, usage]
    model_path: [result, model]
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

  - api_flavor: responses
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: [input_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [output_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: output_tokens
        dest: output_tokens

  - api_flavor: embeddings
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens

