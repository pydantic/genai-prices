# yaml-language-server: $schema=.schema.json
name: Perplexity
id: perplexity
pricing_urls:
  - https://docs.perplexity.ai/docs/getting-started/pricing
  - https://docs.perplexity.ai/docs/agent-api/models
  - https://docs.perplexity.ai/docs/agent-api/tools/web-search
api_pattern: 'https://api\.perplexity\.ai'
price_comments: >-
  Sonar Chat Completions prices per request vary based on usage, this is not represented here,
  instead we just take the highest price shown for `requests_kcount`.
extractors:
  # https://docs.perplexity.ai/api-reference/sonar-post
  # https://docs.perplexity.ai/docs/getting-started/pricing documents reasoning and citation tokens as separate
  # billable categories only for Sonar Deep Research. Sonar Reasoning Pro includes its <think> content in
  # completion_tokens and does not return separate reasoning or citation fields:
  # https://docs.perplexity.ai/docs/sonar/models/sonar-reasoning-pro
  - root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: reasoning_tokens
        dest: output_tokens
        required: false
      - path: reasoning_tokens
        dest: output_reasoning_tokens
        required: false
      - path: citation_tokens
        dest: output_tokens
        required: false
      - path: citation_tokens
        dest: output_citation_tokens
        required: false
      - path: num_search_queries
        dest: web_searches
        required: false
      - path: completion_tokens
        dest: output_tokens
  # https://docs.perplexity.ai/docs/decisions/quickstart — `usage.input_tokens` / `usage.output_tokens`.
  # Output tokens are free. The Sonar extractor stays on `prompt_tokens` / `completion_tokens`.
  - api_flavor: decisions
    root: usage
    model_path: model
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: output_tokens
        dest: output_tokens
  # https://docs.perplexity.ai/api-reference/agent-post — OpenAI Responses usage; cached tokens are a subset of
  # input_tokens. Cache writes bill at the input rate, so cache_creation_input_tokens stays in input_tokens.
  # Reasoning is included in output_tokens; preserve its breakdown without adding it to the total.
  # https://github.com/perplexityai/wandr/blob/9ea23c7f24d0aaabc2c87b26815a513001b2e7ce/agents/relay/providers/perplexity/events.py
  # Read cache_read_input_tokens only; cached_tokens is a compatibility alias.
  - api_flavor: responses
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: [input_tokens_details, cache_read_input_tokens]
        dest: cache_read_tokens
        required: false
      - path: [output_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: output_tokens
        dest: output_tokens
      - path: [tool_calls_details, search_web, invocation]
        dest: web_searches
        required: false
  # https://docs.perplexity.ai/docs/embeddings/standard-embeddings — `usage.prompt_tokens`, no completion tokens.
  - api_flavor: embeddings
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
models:
  - id: llama-3.1-sonar-large-128k-online
    name: Llama 3.1 Sonar 70B Online
    description: >-
      Llama 3.1 Sonar is Perplexity's latest model family. It surpasses their earlier Sonar models in cost-efficiency, speed,
      and performance.
    match:
      equals: llama-3.1-sonar-large-128k-online
    prices:
      input_mtok: 1
      output_mtok: 1

  - id: llama-3.1-sonar-small-128k-online
    name: Llama 3.1 Sonar 8B Online
    description: >-
      Llama 3.1 Sonar is Perplexity's latest model family. It surpasses their earlier Sonar models in cost-efficiency, speed,
      and performance.
    match:
      equals: llama-3.1-sonar-small-128k-online
    prices:
      input_mtok: 0.2
      output_mtok: 0.2

  - id: perplexity/deepseek-v4-pro-0813
    match:
      equals: perplexity/deepseek-v4-pro-0813
    prices:
      input_mtok: 1.32
      cache_read_mtok: 0.044
      output_mtok: 3.96
    prices_checked: 2026-10-20

  - id: perplexity/glm-5.3
    match:
      equals: perplexity/glm-5.3
    prices:
      input_mtok: 1.4
      cache_read_mtok: 0.26
      output_mtok: 4.4
    prices_checked: 2026-10-20

  - id: perplexity/glm-5.3-flash
    match:
      equals: perplexity/glm-5.3-flash
    prices:
      input_mtok: 0.15
      cache_read_mtok: 0.03
      output_mtok: 0.5
    prices_checked: 2026-10-20

  - id: perplexity/kimi-k3
    match:
      equals: perplexity/kimi-k3
    prices:
      input_mtok: 3
      cache_read_mtok: 0.3
      output_mtok: 15
    prices_checked: 2026-10-20

  - id: perplexity/nemotron-3.5-super-120b-a12b
    match:
      equals: perplexity/nemotron-3.5-super-120b-a12b
    prices:
      input_mtok: 0.2
      cache_read_mtok: 0.04
      output_mtok: 0.5
    prices_checked: 2026-10-20

  - id: perplexity/sonar
    match:
      equals: perplexity/sonar
    prices:
      input_mtok: 0.25
      cache_read_mtok: 0.0625
      output_mtok: 2.5
      web_searches_kcount: 2.5
    prices_checked: 2026-10-20
    price_comments: >-
      Standard web search is $2.50 per thousand invocations; Fast Search is $1 per thousand.
      Pass price_context search_type=fast for Fast Search, including presets that select it.
      The response invocation count does not identify the search type. Without context, standard web search is estimated.
      https://docs.perplexity.ai/docs/agent-api/tools/web-search
      Fast Search pricing starts on its documented public launch date, 2026-09-24.
      https://github.com/perplexityai/modelcontextprotocol/pull/146
      https://docs.perplexity.ai/docs/resources/changelog#september-2026
      Earlier dates retain the standard search estimate.
      Only tokens, cache reads, and web search are represented; other Agent tools are not priced.
    price_variants:
      - when: { search_type: fast }
        constraint: { start_date: 2026-09-24 }
        prices:
          web_searches_kcount: 1
      - when: { search_type: web }
        prices: {}

  - id: pplx-decider-flash-v1.2
    name: Decider Flash V1.2
    match:
      or:
        - equals: pplx-decider-flash-v1.2
        - equals: pplx-decider-flash-latest
        - equals: perplexity/pplx-decider-flash-latest
    prices:
      input_mtok: 0.01
    prices_checked: 2026-10-20
    price_comments: >-
      Decisions API: output tokens are free and there is no per-request fee. `pplx-decider-flash-latest` selects
      this model. https://docs.perplexity.ai/docs/decisions/quickstart

  - id: pplx-decider-v1-27b
    name: Decider V1 27B
    match:
      equals: pplx-decider-v1-27b
    context_window: 262144
    prices_checked: 2026-10-07
    price_comments: >-
      Decisions API: $0.02 per million input tokens, output free, no per-request fee. Input stays under
      262,144 tokens. https://docs.perplexity.ai/docs/decisions/quickstart
    prices:
      input_mtok: 0.02

  - id: pplx-decider-v1.1-27b
    name: Decider V1.1 27B
    match:
      equals: pplx-decider-v1.1-27b
    context_window: 262144
    prices_checked: 2026-10-07
    price_comments: >-
      Decisions API: $0.02 per million input tokens, output free, no per-request fee. Input stays under
      262,144 tokens. https://docs.perplexity.ai/docs/decisions/quickstart
    prices:
      input_mtok: 0.02

  - id: pplx-decider-v1.2
    name: Decider V1.2
    match:
      or:
        - equals: pplx-decider-v1.2
        - equals: pplx-decider-latest
        - equals: perplexity/pplx-decider-latest
    prices:
      input_mtok: 0.02
    prices_checked: 2026-10-20
    price_comments: >-
      Decisions API: output tokens are free and there is no per-request fee. `pplx-decider-latest` selects this
      model. https://docs.perplexity.ai/docs/decisions/quickstart

  - id: pplx-embed-context-v1-0.6b
    name: Embed Context V1 0.6B
    match:
      equals: pplx-embed-context-v1-0.6b
    prices:
      input_mtok: 0.008
    prices_checked: 2026-10-20

  - id: pplx-embed-context-v1-4b
    name: Embed Context V1 4B
    match:
      equals: pplx-embed-context-v1-4b
    prices:
      input_mtok: 0.05
    prices_checked: 2026-10-20

  - id: pplx-embed-v1-0.6b
    name: Embed V1 0.6B
    match:
      equals: pplx-embed-v1-0.6b
    prices:
      input_mtok: 0.004
    prices_checked: 2026-10-20

  - id: pplx-embed-v1-4b
    name: Embed V1 4B
    match:
      equals: pplx-embed-v1-4b
    prices:
      input_mtok: 0.03
    prices_checked: 2026-10-20

  - id: r1-1776
    name: R1 1776
    description: >-
      R1 1776 is a version of DeepSeek-R1 that has been post-trained to remove censorship constraints related to topics restricted
      by the Chinese government. The model retains its original reasoning capabilities
      while providing direct responses to a wider range of queries. R1 1776 is an offline chat model that does not use the
      perplexity search subsystem.
    match:
      equals: r1-1776
    prices_checked: 2025-07-03
    prices:
      input_mtok: 2
      output_mtok: 8

  - id: sonar
    name: Sonar
    description: >-
      Sonar is lightweight, affordable, fast, and simple to use — now featuring citations and the ability to customize sources.
      It is designed for companies seeking to integrate lightweight question-and-answer
      features optimized for speed.
    match:
      equals: sonar
    context_window: 128000
    prices_checked: 2026-10-19
    price_comments: >-
      Perplexity stopped publishing Sonar rates after Sonar Chat Completions support ended on 2026-09-27; these are
      the last published rates, checked 2026-10-19.
      https://docs.perplexity.ai/docs/agent-api/migrate-from-sonar/overview
    prices:
      input_mtok: 1
      output_mtok: 1
      requests_kcount: 12

  - id: sonar-deep-research
    name: Sonar Deep Research
    description: >-
      Sonar Deep Research is a research-focused model designed for multi-step retrieval, synthesis, and reasoning across complex
      topics. It autonomously searches, reads, and evaluates sources, refining
      its approach as it gathers information. This enables comprehensive report generation across domains like finance, technology,
      health, and current events.
    match:
      equals: sonar-deep-research
    context_window: 128000
    prices_checked: 2026-10-19
    price_comments: >-
      Perplexity lists reasoning tokens separately at $3 per million tokens and citation tokens at $2 per million tokens.
      Search queries cost $5 per thousand.
      Perplexity stopped publishing Sonar rates after Sonar Chat Completions support ended on 2026-09-27; these are
      the last published rates, checked 2026-10-19.
      https://docs.perplexity.ai/docs/agent-api/migrate-from-sonar/overview
    prices:
      input_mtok: 2
      output_mtok: 8
      output_reasoning_mtok: 3
      output_citation_mtok: 2
      web_searches_kcount: 5

  - id: sonar-pro
    name: Sonar Pro
    description: >-
      Note: Sonar Pro pricing includes Perplexity search pricing. See details here
    match:
      equals: sonar-pro
    context_window: 200000
    prices_checked: 2026-10-19
    price_comments: >-
      Perplexity stopped publishing Sonar rates after Sonar Chat Completions support ended on 2026-09-27; these are
      the last published rates, checked 2026-10-19.
      https://docs.perplexity.ai/docs/agent-api/migrate-from-sonar/overview
    prices:
      requests_kcount: 14
      input_mtok: 3
      output_mtok: 15

  - id: sonar-pro-search
    name: Sonar Pro Search
    description: >-
      Sonar Pro Search is Perplexity's advanced agentic search system for deeper reasoning and analysis.
    match:
      equals: sonar-pro-search
    prices_checked: 2026-06-09
    price_comments: Imported from OpenRouter pricing; verify against Perplexity pricing when native API pricing is
      published.
    prices:
      input_mtok: 3
      output_mtok: 15

  - id: sonar-reasoning
    name: Sonar Reasoning
    description: >-
      Sonar Reasoning is a reasoning model provided by Perplexity based on DeepSeek R1.
    match:
      equals: sonar-reasoning
    prices_checked: 2025-07-03
    prices:
      requests_kcount: 12
      input_mtok: 1
      output_mtok: 5

  - id: sonar-reasoning-pro
    name: Sonar Reasoning Pro
    description: Sonar Pro pricing includes Perplexity search pricing.
    match:
      equals: sonar-reasoning-pro
    context_window: 128000
    prices_checked: 2026-10-19
    price_comments: >-
      Perplexity stopped publishing Sonar rates after Sonar Chat Completions support ended on 2026-09-27; these are
      the last published rates, checked 2026-10-19.
      https://docs.perplexity.ai/docs/agent-api/migrate-from-sonar/overview
    prices:
      requests_kcount: 14
      input_mtok: 2
      output_mtok: 8
