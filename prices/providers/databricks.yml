# yaml-language-server: $schema=.schema.json
id: databricks
name: Databricks
description: Pay-per-token Foundation Model APIs for open-weight models hosted by Databricks on AWS, Azure and GCP workspaces.
pricing_urls:
  - https://www.databricks.com/product/pricing/foundation-model-serving
  - https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/supported-models
# Workspace hosts: <name>.cloud.databricks.com (AWS), adb-<id>.<n>.azuredatabricks.net (Azure), <id>.<n>.gcp.databricks.com (GCP).
api_pattern: 'https://[^/]+\.(?:cloud\.databricks\.com|azuredatabricks\.net|gcp\.databricks\.com)/(?:serving-endpoints|ai-gateway)(?:/|$)'
# Model Serving endpoint names start with `databricks-`; Unity AI Gateway names the same models `system.ai.<name>`.
model_match:
  or:
    - starts_with: databricks-
    - starts_with: system.ai.
provider_match:
  contains: databricks
price_comments: >-
  Databricks bills pay-per-token usage in DBUs per 1M tokens. USD prices are the published Standard Pay Per Token DBU rates
  multiplied by $0.070 per DBU, the serverless real-time inference rate in AWS us-east-1, us-east-2 and us-west-2, Azure East
  US, East US 2, North Central US, West US 2 and West US 3, and every GCP US region, rounded to $0.001. Other regions charge
  $0.074-$0.170 per DBU and SAP Databricks $0.125-$0.199, so costs there scale with the DBU rate. Not represented: priority
  pay-per-token, the 10% data-residency uplift on Kimi K3, provisioned throughput, batch inference and committed-use
  discounts. Covers Databricks-hosted open-weight models only, not the Anthropic, OpenAI, Google and xAI models Databricks
  also serves.

# Chat Completions usage, from both /serving-endpoints/chat/completions and /serving-endpoints/{name}/invocations.
# `reasoning_tokens` and `cache_read_input_tokens` are top-level fields, and `prompt_tokens` includes cached input.
# https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference#usage
extractors:
  - api_flavor: default
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: cache_read_input_tokens
        dest: cache_read_tokens
        required: false
      - path: reasoning_tokens
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: cache_read_input_tokens
        dest: cache_read_tokens
        required: false
      - path: reasoning_tokens
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

  # Open Responses API, /serving-endpoints/open-responses.
  # https://docs.databricks.com/aws/en/machine-learning/model-serving/query-open-responses-models
  # https://github.com/openresponses/openresponses/blob/main/schema/components/schemas/Usage.json
  - api_flavor: responses
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: [input_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [output_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: output_tokens
        dest: output_tokens

  # Embedding responses report `prompt_tokens` and `total_tokens` only.
  # https://docs.databricks.com/aws/en/machine-learning/foundation-model-apis/api-reference#embeddings-response
  - api_flavor: embeddings
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens

