# yaml-language-server: $schema=.schema.json
id: github-copilot
name: GitHub Copilot
description: >-
  OpenAI, Anthropic, Google, xAI, Moonshot AI and Microsoft models served through GitHub Copilot's
  OpenAI-compatible API at api.githubcopilot.com.
pricing_urls:
  - https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
  - https://docs.github.com/en/copilot/concepts/billing/usage-based-billing-for-individuals
api_pattern: 'https://api\.githubcopilot\.com'
provider_match:
  contains: copilot
price_comments: >-
  Copilot meters token usage in AI credits, where 1 credit = $0.01; the rates recorded here are the
  published per-model USD rates from the models-and-pricing page. Every response also carries a
  `copilot_usage.token_details[].cost_per_batch` figure in nano-credits, which agreed with the
  published rate for each of the nine priced models reachable on the plan used to check them on 2026-09-03.
  Long-context tiers reprice the whole request once the prompt crosses the threshold.
  Not represented: embedding models and Copilot-internal agent models, which have no published rate,
  and `gpt-4`, which Copilot routes to GPT-4.1 and bills at a rate the pricing page does not list.
  Catalog membership varies by subscription and by API integrator, so this is not the union of every
  plan's models.

# Copilot's `/chat/completions` and `/responses` bodies are shaped like OpenAI's, so these mirror
# openai.yml. `copilot_usage` is a third, Copilot-specific block that reports rates rather than a
# usage breakdown the unit registry can price, so it is not mapped.
extractors:
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens
  - api_flavor: responses
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: [input_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [input_tokens_details, cache_write_tokens]
        dest: cache_write_tokens
        required: false
      - path: [output_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: output_tokens
        dest: output_tokens

# Context windows are Copilot's own `max_context_window_tokens` from GET /models, which are narrower
# than several of the upstream vendors' published windows.
#
# OpenAI-vendor ids also match a dated snapshot suffix: a `/responses` call for `gpt-5.4` comes back
# with `"model": "gpt-5.4-2026-03-05"`. The other vendors returned the requested id unchanged.
#
# Long-context tier starts are the threshold itself, not threshold-1. GitHub's rows read `<= 272K` and
# `> 272K`, so a prompt of exactly the threshold stays on the default rate, which is what the engines
# do for a tier whose `start` equals it. OpenAI's own page puts its standard rate at `< 272K` instead,
# which is why openai.yml encodes 271999.
models:
  - id: claude-fable-5
    name: Claude Fable 5
    match:
      equals: claude-fable-5
    context_window: 264000
    prices_checked: 2026-09-03
    price_comments: The pricing page gives cached input as a $0.25-$1.00 range; the highest rate is recorded.
    prices:
      input_mtok: 10
      cache_read_mtok: 1
      cache_write_mtok: 12.50
      output_mtok: 50

  - id: claude-fable-5.1
    name: Claude Fable 5.1
    # A separate model in Copilot's catalog that happens to share Fable 5's rates.
