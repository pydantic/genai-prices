# yaml-language-server: $schema=.schema.json
name: OpenAI
id: openai
pricing_urls:
  - https://developers.openai.com/api/docs/pricing
  - https://developers.openai.com/api/docs/guides/prompt-caching
  - https://platform.openai.com/docs/pricing
  - https://openai.com/api/pricing/
  - https://platform.openai.com/docs/models
  - https://help.openai.com/en/articles/7127956-how-much-does-gpt-4-cost
api_pattern: 'https://api\.openai\.com'
model_match:
  or:
    - starts_with: "gpt-"
    - equals: whisper-1
    - starts_with: "tts-1"
    - regex: "^o[134]"
provider_match:
  contains: openai
extractors:
  # https://github.com/openai/openai-python/blob/f16fbbd2bd25dc1ff150b5f78dbd15ff6bab6d91/src/openai/types/completion_usage.py
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [prompt_tokens_details, cache_write_tokens]
        dest: cache_write_tokens
        required: false
      - path: [prompt_tokens_details, audio_tokens]
        dest: input_audio_tokens
        required: false
      - path: [completion_tokens_details, audio_tokens]
        dest: output_audio_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens
  # https://github.com/openai/openai-python/blob/f16fbbd2bd25dc1ff150b5f78dbd15ff6bab6d91/src/openai/types/responses/response_usage.py
  - api_flavor: responses
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: [input_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [input_tokens_details, cache_write_tokens]
        dest: cache_write_tokens
        required: false
      - path: [output_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: output_tokens
        dest: output_tokens
  # https://platform.openai.com/docs/api-reference/realtime-server-events/response/done
  - api_flavor: realtime
    root: [response, usage]
    mappings:
      - path: input_tokens
        dest: input_tokens
        required: false
      - path: [input_token_details, text_tokens]
        dest: input_text_tokens
        required: false
      - path: [input_token_details, audio_tokens]
        dest: input_audio_tokens
        required: false
      - path: [input_token_details, image_tokens]
        dest: input_image_tokens
        required: false
      - path: [input_token_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [input_token_details, cached_tokens_details, text_tokens]
        dest: cache_text_read_tokens
        required: false
      - path: [input_token_details, cached_tokens_details, audio_tokens]
        dest: cache_audio_read_tokens
        required: false
      - path: [input_token_details, cached_tokens_details, image_tokens]
        dest: cache_image_read_tokens
        required: false
      - path: [output_token_details, text_tokens]
        dest: output_text_tokens
        required: false
      - path: [output_token_details, audio_tokens]
        dest: output_audio_tokens
        required: false
      - path: output_tokens
        dest: output_tokens
        required: false
  # https://developers.openai.com/api/reference/resources/images#imagesresponse
  - api_flavor: images
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: [input_tokens_details, text_tokens]
        dest: input_text_tokens
      - path: [input_tokens_details, image_tokens]
        dest: input_image_tokens
      - path: output_tokens
        dest: output_tokens
      - path: [output_tokens_details, text_tokens]
        dest: output_text_tokens
        required: false
      - path: [output_tokens_details, image_tokens]
        dest: output_image_tokens
        required: false
  # https://github.com/openai/openai-python/blob/v2.3.0/src/openai/types/create_embedding_response.py
  - api_flavor: embeddings
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
  # GPT-Live voice sessions report their duration, in `session.usage.updated` and `session.closed`:
  # https://developers.openai.com/api/reference/resources/live/primary-websocket
  # It is a running total, not an increment: price the latest report (or the final one on
  # `session.closed`), or the difference between two, never each report in turn.
  - api_flavor: live
    root: usage
    mappings:
      - path: seconds
        dest: audio_seconds
models:
  - id: ada
    match:
      or:
        - equals: ada
        - equals: text-ada-001
    prices:
      input_mtok: 0.4
      output_mtok: 0.4

  - id: babbage
    match:
      equals: babbage
    prices:
      input_mtok: 0.5
      output_mtok: 0.5

  - id: babbage-002
    match:
      equals: babbage-002
    prices_checked: 2026-10-19
    price_comments: >-
      Listed on the standard pricing table at https://developers.openai.com/api/docs/pricing.
    prices:
      input_mtok: 0.4
      output_mtok: 0.4

  - id: chatgpt-4o-latest
    name: ChatGPT-4o
    description: >-
      OpenAI ChatGPT 4o is continually updated by OpenAI to point to the current version of GPT-4o used by ChatGPT. It therefore
      differs slightly from the API version of GPT-4o in that it has additional
      RLHF. It is intended for research and evaluation.
    match:
      equals: chatgpt-4o-latest
    context_window: 128000
    prices:
      input_mtok: 5
      output_mtok: 15

  - id: chatgpt-image-latest
    match:
      equals: chatgpt-image-latest
    prices_checked: 2026-10-15
    price_comments: >-
      Rates from https://developers.openai.com/api/docs/pricing (image generation, Standard table):
      text input $5 / 1M tokens, cached text input $1.25 / 1M tokens, text output $10 / 1M tokens, image
      input $8 / 1M image tokens, cached image input $2 / 1M image tokens, image output $32 / 1M image
      tokens. Model ID confirmed in the models catalog at https://developers.openai.com/api/docs/models.
    prices:
      input_mtok: 5
      input_image_mtok: 8
      cache_read_mtok: 1.25
      cache_image_read_mtok: 2
      output_mtok: 10
      output_image_mtok: 32

  - id: codex-mini
    name: Codex Mini
    description: >-
      codex-mini-latest is a fine-tuned version of o4-mini specifically for use in Codex CLI. For direct use in the API, we
      recommend starting with gpt-4.1.
    match:
      or:
        - equals: codex-mini
        - equals: codex-mini-latest
    context_window: 200000
    prices:
      input_mtok: 1.5
      cache_read_mtok: 0.375
      output_mtok: 6

  - id: computer-use
    name: Computer use
    match:
      starts_with: computer-use
    context_window: 8192
    prices:
      input_mtok: 3
      output_mtok: 12

  - id: curie
    match:
      or:
        - equals: curie
        - equals: text-curie-001
    prices:
      input_mtok: 2
      output_mtok: 2

  - id: davinci
    match:
      or:
        - equals: davinci
        - equals: text-davinci-001
    prices:
      input_mtok: 20
      output_mtok: 20

  - id: davinci-002
    match:
      equals: davinci-002
    prices_checked: 2026-10-19
    price_comments: >-
      Listed on the standard pricing table at https://developers.openai.com/api/docs/pricing.
    prices:
      input_mtok: 2
      output_mtok: 2

  - id: "ft:gpt-3.5-turbo-"
    description: GPT-3.5 Turbo fine tuned.
    match:
      starts_with: "ft:gpt-3.5-turbo"
    price_comments: >-
      Batch rates verified on 2026-10-14 at https://developers.openai.com/api/docs/pricing.
    prices_checked: 2026-10-14
    prices:
      input_mtok: 3
      output_mtok: 6
    price_variants:
      - when: { processing: batch }
        constraint: { start_date: 2026-10-14 }
        prices:
          input_mtok: 1.5
          output_mtok: 3

  - id: "ft:gpt-4o"
    description: GPT-4o fine tuned.
    match:
      starts_with: "ft:gpt-4o-2024-"
    price_comments: >-
      No batch variant: on 2026-10-14 the pricing page listed batch rates of $2.225/$12.50, which are not the documented
      50% discount and could not be confirmed. https://developers.openai.com/api/docs/pricing
    prices:
      input_mtok: 3.75
      output_mtok: 15

  - id: "ft:gpt-4o-mini"
    description: GPT-4o Mini fine tuned.
    match:
      starts_with: "ft:gpt-4o-mini-2024-"
    price_comments: >-
      Batch rates verified on 2026-10-14 at https://developers.openai.com/api/docs/pricing.
    prices_checked: 2026-10-14
    prices:
      input_mtok: 0.3
      output_mtok: 1.2
    price_variants:
      - when: { processing: batch }
        constraint: { start_date: 2026-10-14 }
        prices:
          input_mtok: 0.15
          output_mtok: 0.6

  - id: gpt-3.5-0301
    match:
      or:
        - equals: gpt-3.5-turbo-0301
        - equals: gpt-3.5-0301
    prices:
      input_mtok: 1.5
      output_mtok: 2

  - id: gpt-3.5-turbo
    name: gpt 3.5 turbo
    description: GPT-3.5 Turbo offers a balance between cost and performance.
    match:
      or:
        - equals: gpt-3.5-turbo
        - equals: gpt-35-turbo
        - equals: gpt-3.5-turbo-0125
    context_window: 16385
    prices_checked: 2026-10-31
    price_comments: >-
      Batch rates verified on 2026-10-14 at https://developers.openai.com/api/docs/pricing.
    prices:
      input_mtok: 0.5
      output_mtok: 1.5
    price_variants:
      - when: { processing: batch }
        constraint: { start_date: 2026-10-14 }
        prices:
          input_mtok: 0.25
          output_mtok: 0.75

  - id: gpt-3.5-turbo-0613
    match:
      equals: gpt-3.5-turbo-0613
    context_window: 16385
    prices_checked: 2025-11-07
    prices:
      input_mtok: 1.5
      output_mtok: 2

  - id: gpt-3.5-turbo-1106
    match:
      equals: gpt-3.5-turbo-1106
    context_window: 16385
    prices_checked: 2026-10-19
    price_comments: >-
      Batch rates verified on 2026-10-14 at https://developers.openai.com/api/docs/pricing. The Batch table lists
      the same rates as standard.
    prices:
      input_mtok: 1
      output_mtok: 2
    price_variants:
      - when: { processing: batch }
        constraint: { start_date: 2026-10-14 }
        prices: {}

  - id: gpt-3.5-turbo-16k
    name: GPT-3.5 Turbo 16k
    description: >-
      This model offers four times the context length of gpt-3.5-turbo, allowing it to support approximately 20 pages of text
      in a single request at a higher cost. Training data: up to Sep 2021.
    match:
      or:
        - equals: gpt-3.5-turbo-16k
        - equals: gpt-3.5-turbo-16k-0613
        - equals: gpt-35-turbo-16k-0613
        - equals: gpt-35-turbo-16k
    context_window: 16385
    prices_checked: 2025-07-04
    prices:
      input_mtok: 3
      output_mtok: 4

  - id: gpt-3.5-turbo-instruct
    name: gpt 3.5 turbo instruct
    description: GPT-3.5 Turbo offers a balance between cost and performance.
    match:
      # these are tautologous but still helpful to document known names
      or:
        - starts_with: gpt-3.5-turbo-instruct
        - equals: gpt-3.5-turbo-instruct-0914
    context_window: 16385
    prices_checked: 2026-10-19
    prices:
      input_mtok: 1.5
      output_mtok: 2

  - id: gpt-4
    name: gpt 4
    description: >-
      GPT-4 is the latest and most advanced model in the GPT series,
      demonstrating sophisticated capabilities in complex reasoning, theory of
      mind, and narrative understanding.
    match:
      or:
        - equals: gpt-4
        - equals: gpt-4-0314
        - equals: gpt-4-0613
        - starts_with: ft:gpt-4-0
    context_window: 8192
    prices_checked: 2026-10-31
    price_comments: >-
      Batch rates verified on 2026-10-14 at https://developers.openai.com/api/docs/pricing.
    prices:
      input_mtok: 30
      output_mtok: 60
    price_variants:
      - when: { processing: batch }
        constraint: { start_date: 2026-10-14 }
        prices:
          input_mtok: 15
          output_mtok: 30

  - id: gpt-4-32k
    name: gpt 4
    description: >-
      GPT-4 is the latest and most advanced model in the GPT series,
      demonstrating sophisticated capabilities in complex reasoning, theory of
      mind, and narrative understanding.
    match:
      or:
        - equals: gpt-4-32k
        - equals: gpt-4-32k-0314
        - equals: gpt-4-32k-0613
    price_comments: see https://help.openai.com/en/articles/7127956-how-much-does-gpt-4-cost
    context_window: 32000
    prices_checked: 2025-07-04
    prices:
      input_mtok: 60
      output_mtok: 120

  - id: gpt-4-turbo
    name: gpt 4 turbo
    description: GPT-4 Turbo offers a balance between cost and performance.
    match:
      or:
        - equals: gpt-4-turbo
        - equals: gpt-4-turbo-2024-04-09
        - equals: gpt-4-turbo-0125-preview
        - equals: gpt-4-0125-preview
        - equals: gpt-4-1106-preview
        - equals: gpt-4-turbo-preview
    context_window: 128000
    prices_checked: 2026-10-31
    price_comments: >-
      Batch rates verified on 2026-10-14 at https://developers.openai.com/api/docs/pricing.
    prices:
      input_mtok: 10
      output_mtok: 30
    price_variants:
      - when: { processing: batch }
        constraint: { start_date: 2026-10-14 }
        prices:
          input_mtok: 5
          output_mtok: 15

  - id: gpt-4-vision-preview
    name: gpt 4 vision
    description: GPT-4 Vision is a model that offers a balance between cost and performance.
    match:
      or:
        - equals: gpt-4-vision-preview
        - equals: gpt-4-1106-vision-preview
    context_window: 128000
    prices:
      input_mtok: 10
      output_mtok: 30

  - id: gpt-4.1
    name: gpt 4.1
    description: >-
      GPT-4.1 is OpenAI's latest flagship model, offering major improvements in
      coding, instruction following, and long context understanding with up to 1
      million tokens of context.
    match:
      or:
        - equals: gpt-4.1
        - equals: gpt-4.1-2025-04-14
    context_window: 1000000
    prices_checked: 2026-10-31
    prices:
      input_mtok: 2
      cache_read_mtok: 0.5
      output_mtok: 8
      web_searches_kcount: 10
      storage_searches_kcount: 2.5
    price_comments: >-
      Flex/priority/fast rates verified on 2026-10-12 at https://developers.openai.com/api/docs/pricing.
      Batch rates verified on 2026-10-14 at https://developers.openai.com/api/docs/pricing. The Batch table
      publishes no cached-input rate, so cached input keeps the standard rate.
      Tier history before this verification is not modeled. Flex cached rates retain half-rate precision.
    price_variants:
      - when: { service_tier: default }
        prices: {}
      - when: { service_tier: priority }
        constraint: { start_date: 2026-10-12 }
        prices:
          input_mtok: 3.50
          cache_read_mtok: 0.875
          output_mtok: 14.00
      - when: { service_tier: fast }
        constraint: { start_date: 2026-10-12 }
        prices:
          input_mtok: 3.50
          cache_read_mtok: 0.875
          output_mtok: 14.00
      - when: { processing: batch }
        constraint: { start_date: 2026-10-14 }
        prices:
          input_mtok: 1
          output_mtok: 4

  - id: gpt-4.1-mini
    name: gpt 4.1 mini
    description: >-
      GPT-4.1 Mini is a significant leap in small model performance, matching or
      exceeding GPT-4o in many benchmarks while reducing latency by nearly half
      and cost by 83%.
    match:
      or:
        - equals: gpt-4.1-mini
        - equals: gpt-4.1-mini-2025-04-14
    context_window: 1000000
    prices_checked: 2026-10-31
    prices:
      input_mtok: 0.4
      cache_read_mtok: 0.1
      output_mtok: 1.6
      web_searches_kcount: 10
      storage_searches_kcount: 2.5
    price_comments: >-
      Flex/priority/fast rates verified on 2026-10-12 at https://developers.openai.com/api/docs/pricing.
      Batch rates verified on 2026-10-14 at https://developers.openai.com/api/docs/pricing. The Batch table
      publishes no cached-input rate, so cached input keeps the standard rate.
      Tier history before this verification is not modeled. Flex cached rates retain half-rate precision.
    price_variants:
      - when: { service_tier: default }
        prices: {}
      - when: { service_tier: priority }
        constraint: { start_date: 2026-10-12 }
        prices:
          input_mtok: 0.70
          cache_read_mtok: 0.175
          output_mtok: 2.80
      - when: { service_tier: fast }
        constraint: { start_date: 2026-10-12 }
        prices:
          input_mtok: 0.70
          cache_read_mtok: 0.175
          output_mtok: 2.80
      - when: { processing: batch }
        constraint: { start_date: 2026-10-14 }
        prices:
          input_mtok: 0.2
          output_mtok: 0.8

  - id: gpt-4.1-nano
    name: gpt 4.1 nano
    description: >-
      GPT-4.1 Nano is OpenAI's fastest and cheapest model, delivering
      exceptional performance for its size with a 1 million token context
      window, ideal for classification and autocompletion tasks.
    match:
      or:
        - equals: gpt-4.1-nano
        - equals: gpt-4.1-nano-2025-04-14
    context_window: 1000000
    prices_checked: 2026-10-31
    prices:
      input_mtok: 0.1
      cache_read_mtok: 0.025
      output_mtok: 0.4
    price_comments: >-
      Flex/priority/fast rates verified on 2026-10-12 at https://developers.openai.com/api/docs/pricing.
      Batch rates verified on 2026-10-14 at https://developers.openai.com/api/docs/pricing. The Batch table
      publishes no cached-input rate, so cached input keeps the standard rate.
      Tier history before this verification is not modeled. Flex cached rates retain half-rate precision.
    price_variants:
      - when: { service_tier: default }
        prices: {}
      - when: { service_tier: priority }
        constraint: { start_date: 2026-10-12 }
        prices:
          input_mtok: 0.20
          cache_read_mtok: 0.05
          output_mtok: 0.80
      - when: { service_tier: fast }
        constraint: { start_date: 2026-10-12 }
        prices:
          input_mtok: 0.20
          cache_read_mtok: 0.05
          output_mtok: 0.80
      - when: { processing: batch }
        constraint: { start_date: 2026-10-14 }
        prices:
          input_mtok: 0.05
          output_mtok: 0.2

  - id: gpt-4.5-preview
    name: GPT-4.5 (Preview)
    description: >-
      GPT-4.5 (Preview) is a research preview of OpenAI's latest language model, designed to advance capabilities in reasoning,
      creativity, and multi-turn conversation. It builds on previous iterations
      with improvements in world knowledge, contextual coherence, and the ability to follow user intent more effectively.
    match:
      starts_with: gpt-4.5-preview
    prices_checked: 2025-07-04
    prices:
      input_mtok: 75
      cache_read_mtok: 37.5
      output_mtok: 150

  - id: gpt-4o
    name: gpt 4o
    description: >-
      GPT-4 Optimized (GPT-4o) is designed for high performance in reasoning,
      creativity, and technical tasks while maintaining consistent output
      quality.
    match:
      or:
        - equals: gpt-4o
        - equals: gpt-4o-2024-08-06
        - equals: gpt-4o-2024-11-20
    context_window: 128000
    prices_checked: 2026-10-31
    prices:
      input_mtok: 2.5
      cache_read_mtok: 1.25
      output_mtok: 10
      web_searches_kcount: 10
      storage_searches_kcount: 2.5
    price_comments: >-
      Flex/priority/fast rates verified on 2026-10-12 at https://developers.openai.com/api/docs/pricing.
      Batch rates verified on 2026-10-14 at https://developers.openai.com/api/docs/pricing. The Batch table
      publishes no cached-input rate, so cached input keeps the standard rate.
      Tier history before this verification is not modeled. Flex cached rates retain half-rate precision.
    price_variants:
      - when: { service_tier: default }
        prices: {}
      - when: { service_tier: priority }
        constraint: { start_date: 2026-10-12 }
        prices:
          input_mtok: 4.25
          cache_read_mtok: 2.125
          output_mtok: 17.00
      - when: { service_tier: fast }
        constraint: { start_date: 2026-10-12 }
        prices:
          input_mtok: 4.25
          cache_read_mtok: 2.125
          output_mtok: 17.00
      - when: { processing: batch }
        constraint: { start_date: 2026-10-14 }
        prices:
          input_mtok: 1.25
          output_mtok: 5

  - id: gpt-4o-2024-05-13
    name: gpt 4o (2024-05-13)
    description: >-
      Original GPT-4o snapshot, retained at its launch rates, which are higher than later gpt-4o snapshots and have
      no cached-input discount.
    match:
      equals: gpt-4o-2024-05-13
    context_window: 128000
    prices_checked: 2026-10-31
    price_comments: >-
      Flex/priority/fast rates verified on 2026-10-12 at https://developers.openai.com/api/docs/pricing.
      Batch rates verified on 2026-10-14 at https://developers.openai.com/api/docs/pricing.
      Tier history before this verification is not modeled. Flex cached rates retain half-rate precision.
      Split out of the shared gpt-4o entry: OpenAI lists this snapshot separately at $5/$15 with no cached-input
      price. Ref: https://developers.openai.com/api/docs/pricing.md
    prices:
      input_mtok: 5
      output_mtok: 15
      web_searches_kcount: 10
      storage_searches_kcount: 2.5
    price_variants:
      - when: { service_tier: default }
        prices: {}
      - when: { service_tier: priority }
        constraint: { start_date: 2026-10-12 }
        prices:
          input_mtok: 8.75
          output_mtok: 26.25
      - when: { service_tier: fast }
        constraint: { start_date: 2026-10-12 }
        prices:
          input_mtok: 8.75
          output_mtok: 26.25
      - when: { processing: batch }
        constraint: { start_date: 2026-10-14 }
        prices:
          input_mtok: 2.5
          output_mtok: 7.5

  - id: gpt-4o-audio-preview
    name: gpt 4o audio preview
    description: Audio model for gpt-4o
    match:
      starts_with: gpt-4o-audio-preview
    context_window: 128000
    prices_checked: 2025-07-22
    prices:
      # prompt_tokens includes audio_tokens; OpenAI lists the same price for
      # text and audio input, so the catch-all covers both.
