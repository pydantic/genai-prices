# yaml-language-server: $schema=.schema.json
id: baseten
name: Baseten
description: OpenAI- and Anthropic-compatible hosted inference through Baseten Model APIs.
pricing_urls:
  - https://www.baseten.co/pricing/
  - https://docs.baseten.co/inference/model-apis/overview
api_pattern: 'https://inference\.baseten\.co(?:/|$)'
provider_match:
  contains: baseten
price_comments: >-
  Covers the complete public Model APIs pricing table. Baseten automatically caches prompt prefixes and bills cached input at
  the published cache-input rate. Context windows use the catalog's displayed values in thousands of tokens. Model IDs use
  third-party namespaces, so they do not infer the Baseten provider without a Baseten provider ID or API URL.
extractors:
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [prompt_tokens_details, audio_tokens]
        dest: input_audio_tokens
        required: false
      - path: [completion_tokens_details, audio_tokens]
        dest: output_audio_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

  - api_flavor: anthropic
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: cache_read_input_tokens
        dest: input_tokens
        required: false
      - path: cache_read_input_tokens
        dest: cache_read_tokens
        required: false
      - path: output_tokens
        dest: output_tokens

