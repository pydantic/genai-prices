# yaml-language-server: $schema=.schema.json
name: Baseten
id: baseten
pricing_urls:
  - https://www.baseten.co/pricing
api_pattern: 'https://inference\.baseten\.co'
price_comments: >-
  Model APIs bill per million tokens. Rates from https://www.baseten.co/pricing and
  https://docs.baseten.co/inference/model-apis/overview. Cached input tokens are prompt
  tokens served from the KV cache, billed at the discounted `cache_read_mtok` rate;
  every request participates in caching automatically.
extractors:
  # Model APIs are OpenAI-compatible (chat completions)
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

models:
  - id: deepseek-ai/DeepSeek-V4-Flash-0731
    name: DeepSeek V4 Flash 0731
    match:
      equals: deepseek-ai/DeepSeek-V4-Flash-0731
    context_window: 1048000
    prices_checked: 2026-06-24
    prices:
      input_mtok: 0.13
      cache_read_mtok: 0.028
      output_mtok: 0.26

