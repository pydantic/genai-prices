# yaml-language-server: $schema=.schema.json
name: Z.AI
id: zai
pricing_urls:
  - https://docs.z.ai/guides/overview/pricing
api_pattern: 'https://api\.z\.ai'
price_comments: >-
  USD prices from the Z.AI pricing page. The API pattern covers both the standard
  and Coding Plan endpoints, with Coding Plan usage valued at the published API rates.
extractors:
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

models:
  - id: GLM-4-32B-0414-128K
    name: GLM-4-32B-0414-128K
    description: >-
      Z.AI GLM-4 32B 128K-context model listed on the international platform
      pricing page.
    match:
      or:
        - equals: GLM-4-32B-0414-128K
        - equals: glm-4-32b-0414-128k
    prices_checked: "2026-10-15"
    price_comments: >-
      https://docs.z.ai/guides/overview/pricing. The page publishes no cached-input
      rate for this model.
    prices:
      input_mtok: 0.1
      output_mtok: 0.1

  - id: GLM-4.5
    name: GLM-4.5
    description: Z.AI GLM-4.5 model listed on the international platform pricing page.
    match:
      or:
        - equals: GLM-4.5
        - equals: glm-4.5
    prices_checked: "2026-10-15"
    price_comments: https://docs.z.ai/guides/overview/pricing
    prices:
      input_mtok: 0.6
      cache_read_mtok: 0.11
      output_mtok: 2.2

