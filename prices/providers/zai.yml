  - id: GLM-5.3-Flash
    name: GLM-5.3-Flash
    description: >-
      Z.AI native multimodal model with a 1,000,000 token context window,
      context caching, function calling, and always-on reasoning.
    match:
      or:
        - equals: GLM-5.3-Flash
        - equals: glm-5.3-flash
    context_window: 1000000
    prices_checked: "2026-09-29"
    price_comments: >-
      The 50% launch promotion ended at 24:00 on September 9, 2026 (UTC+8), which is 16:00 UTC.
      `start_date` is a UTC date, so the list prices start on 2026-09-10 and requests from 16:00
      to 24:00 UTC on September 9, after the promotion ended, stay at the promotional rate.
    prices:
      - prices:
          input_mtok: 0.075
          cache_read_mtok: 0.015
          output_mtok: 0.25
      - constraint:
          # https://docs.z.ai/guides/overview/pricing
          start_date: 2026-09-10
        prices:
          input_mtok: 0.15
          cache_read_mtok: 0.03
          output_mtok: 0.50

