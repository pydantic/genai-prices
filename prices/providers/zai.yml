# yaml-language-server: $schema=.schema.json
name: Z.AI
id: zai
pricing_urls:
  - https://docs.z.ai/guides/overview/pricing
api_pattern: 'https://api\.z\.ai'
price_comments: >-
  USD prices from the Z.AI pricing page. The API pattern covers both the standard
  and Coding Plan endpoints, with Coding Plan usage valued at the published API rates.
extractors:
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

models:
  - id: GLM-5.2
    name: GLM-5.2
    description: >-
      Z.AI flagship model with a 1,000,000 token context window, context caching,
      structured output, and function calling.
    match:
      or:
        - equals: GLM-5.2
        - equals: glm-5.2
    context_window: 1000000
    prices_checked: "2026-08-04"
    prices:
      input_mtok: 1.4
      cache_read_mtok: 0.26
      output_mtok: 4.4

  - id: GLM-5.3
    name: GLM-5.3
    description: >-
      Z.AI flagship model with a 1,000,000 token context window, context caching,
      structured output, and function calling. Reasoning is always enabled, with
      low, high and max effort levels.
    match:
      or:
        - equals: GLM-5.3
        - equals: glm-5.3
    context_window: 1000000
    prices_checked: "2026-08-26"
    prices:
      input_mtok: 1.4
      cache_read_mtok: 0.26
      output_mtok: 4.4

  - id: GLM-5.3-Flash
    name: GLM-5.3-Flash
    description: >-
      Z.AI native multimodal model with a 1,000,000 token context window,
      context caching, function calling, and always-on reasoning.
    match:
      or:
        - equals: GLM-5.3-Flash
        - equals: glm-5.3-flash
    context_window: 1000000
    prices_checked: "2026-08-26"
    price_comments: >-
      Standard API rates reflect the 50% launch promotion ending at 24:00 on
      September 9, 2026 (UTC+8): list prices are $0.15 input, $0.03 cached input,
      and $0.50 output per million tokens.
    prices:
      input_mtok: 0.075
      cache_read_mtok: 0.015
      output_mtok: 0.25
