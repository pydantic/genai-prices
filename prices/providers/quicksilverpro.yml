  - https://quicksilverpro.io/pricing.json
api_pattern: https://api\.quicksilverpro\.io
description: OpenAI-compatible inference gateway serving frontier and open models via one endpoint.
extractors:
  - api_flavor: chat
    root: usage
    model_path: model
    mappings:
      - path: prompt_tokens
        dest: input_tokens
        required: true
      - path:
          - prompt_tokens_details
          - cached_tokens
        dest: cache_read_tokens
        required: false
      - path:
          - prompt_tokens_details
          - cache_write_tokens
        dest: cache_write_tokens
        required: false
      - path:
          - prompt_tokens_details
          - audio_tokens
        dest: input_audio_tokens
        required: false
      - path:
          - completion_tokens_details
          - audio_tokens
        dest: output_audio_tokens
        required: false
      - path:
          - completion_tokens_details
          - reasoning_tokens
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens
        required: true
  - api_flavor: responses
    root: usage
    model_path: model
    mappings:
      - path: input_tokens
        dest: input_tokens
        required: true
      - path:
          - input_tokens_details
          - cached_tokens
        dest: cache_read_tokens
        required: false
      - path:
          - input_tokens_details
          - cache_write_tokens
        dest: cache_write_tokens
        required: false
      - path:
          - output_tokens_details
          - reasoning_tokens
        dest: output_reasoning_tokens
        required: false
      - path: output_tokens
        dest: output_tokens
        required: true
