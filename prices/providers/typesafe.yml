# yaml-language-server: $schema=.schema.json
name: TypeSafe
id: typesafe
pricing_urls:
  - https://docs.typesafe.ai/models
api_pattern: 'https://api\.typesafe\.ai'
model_match:
  starts_with: "jev-"
provider_match:
  contains: typesafe
extractors:
  # https://docs.typesafe.ai/api: `POST /v1/systemone` answers with `model` and `usage.input_tokens` / `usage.output_tokens`
  - root: usage
    model_path: model
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: output_tokens
        dest: output_tokens
price_comments: >-
  TypeSafe bills Jev per input token only; output tokens are free. `jev-latest` and `jev-preview` are aliases that
  move with releases and currently point at `jev-1.13.0`; a versioned id is billed the same.

models:
  - id: jev-1.13.0
    name: Jev 1.13.0
    match:
      or:
        - equals: jev-1.13.0
        - equals: jev-latest
        - equals: jev-preview
    # https://docs.typesafe.ai/model-jaggedness/jev-1.13: 32k tokens for the state plus the longest question, and
    # 64k for the state and all the questions together. The state is counted once per request, so the 32k is the
    # limit a growing conversation hits; the 64k only binds when the questions themselves are very large. Measured
    # live on jev-1.13.0: 32,878 input tokens were accepted, and the next size up was refused with HTTP 400
    # `max_tokens_exceeded`.
    context_window: 32000
    prices_checked: 2026-09-18
    prices:
      input_mtok: 0.042
