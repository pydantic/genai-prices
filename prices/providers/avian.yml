# yaml-language-server: $schema=.schema.json
name: Avian
id: avian
pricing_urls:
  - https://avian.io/pricing/
api_pattern: 'https://api\.avian\.io'
price_comments: >-
  Prices and model IDs checked against https://avian.io/docs/ on 2026-08-25. Cache prices use Avian's documented
  cache-read rates. The previously listed Meta Llama models are no longer in Avian's catalog and are deprecated.
