# yaml-language-server: $schema=.schema.json
name: Meta
id: meta
pricing_urls:
  - https://dev.meta.ai/docs/pricing-rate-limits
  - https://dev.meta.ai/docs/protocols/chat-completions
  - https://dev.meta.ai/docs/protocols/responses
  - https://dev.meta.ai/docs/prompt-caching
api_pattern: 'https://api\.meta\.ai(?:/|$)'
model_match:
  or:
    - equals: muse-wonder-1.0
    - starts_with: muse-spark-
provider_match:
  equals: meta
extractors:
  # https://dev.meta.ai/docs/protocols/chat-completions
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens
  # https://dev.meta.ai/docs/protocols/responses
  - api_flavor: responses
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: [input_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [output_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: output_tokens
        dest: output_tokens

models:
  - id: muse-spark-1.1
    name: Muse Spark 1.1
    match:
      equals: muse-spark-1.1
    context_window: 1048576
    prices_checked: 2026-10-18
    price_comments: >-
      Standard mode pricing: $1.25 input, $0.15 cached input, $4.25 output per million tokens, plus $2.50 per 1,000 web
      search queries. Muse Spark 1.1 has no Contributor mode variant. https://dev.meta.ai/docs/pricing-rate-limits
    prices:
      input_mtok: 1.25
      cache_read_mtok: 0.15
      output_mtok: 4.25
      web_searches_kcount: 2.5

  - id: muse-spark-1.2
    name: Muse Spark 1.2
    match:
      equals: muse-spark-1.2
    context_window: 1048576
    prices_checked: 2026-10-18
    price_comments: >-
      Standard mode pricing: $1.25 input, $0.15 cached input, $4.25 output per million tokens, plus $2.50 per 1,000 web
      search queries. No long-context premium. https://dev.meta.ai/docs/pricing-rate-limits
    prices:
      input_mtok: 1.25
      cache_read_mtok: 0.15
      output_mtok: 4.25
      web_searches_kcount: 2.5

  - id: muse-spark-1.2-contributor
    name: Muse Spark 1.2 (Contributor mode)
    match:
      equals: muse-spark-1.2-contributor
    context_window: 1048576
    prices_checked: 2026-10-18
    price_comments: >-
      Contributor mode pricing: $0.10 input, $0.002 cached input, $0.20 output per million tokens. Web search is billed
      at the same $2.50 per 1,000 queries as Standard mode (the docs apply it to every Muse Spark model, and OpenRouter's
      contributor endpoints list web_search at $0.0025 per query). https://dev.meta.ai/docs/pricing-rate-limits
    prices:
      input_mtok: 0.1
      cache_read_mtok: 0.002
      output_mtok: 0.2
      web_searches_kcount: 2.5

  - id: muse-spark-1.3
    name: Muse Spark 1.3
    match:
      equals: muse-spark-1.3
    context_window: 1048576
    prices_checked: 2026-10-18
    price_comments: >-
      Standard mode pricing: $1.25 input, $0.15 cached input, $4.25 output per million tokens, plus $2.50 per 1,000 web
      search queries. No long-context premium. https://dev.meta.ai/docs/pricing-rate-limits
    prices:
      input_mtok: 1.25
      cache_read_mtok: 0.15
      output_mtok: 4.25
      web_searches_kcount: 2.5

  - id: muse-spark-1.3-contributor
    name: Muse Spark 1.3 (Contributor mode)
    match:
      equals: muse-spark-1.3-contributor
    context_window: 1048576
    prices_checked: 2026-10-18
    price_comments: >-
      Contributor mode pricing: $0.10 input, $0.002 cached input, $0.20 output per million tokens. Web search is billed
      at the same $2.50 per 1,000 queries as Standard mode (the docs apply it to every Muse Spark model, and OpenRouter's
      contributor endpoints list web_search at $0.0025 per query). https://dev.meta.ai/docs/pricing-rate-limits
    prices:
      input_mtok: 0.1
      cache_read_mtok: 0.002
      output_mtok: 0.2
      web_searches_kcount: 2.5

  - id: muse-wonder-1.0
    name: Muse Wonder 1.0
    match:
      equals: muse-wonder-1.0
    context_window: 1048576
    prices_checked: 2026-10-18
    price_comments: >-
      Standard mode pricing: $4 input, $0.20 cached input, $20 output per million tokens, plus $2.50 per 1,000 web search
      queries. The usage response has no documented billable-search count, so callers provide web_searches. No Messages
      extractor is defined because the docs do not consistently confirm Wonder support.
      https://dev.meta.ai/docs/pricing-rate-limits
    prices:
      input_mtok: 4
      cache_read_mtok: 0.2
      output_mtok: 20
      web_searches_kcount: 2.5
