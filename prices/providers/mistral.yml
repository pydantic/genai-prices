    prices_checked: 2026-08-24
    price_comments: >-
      Ref: https://mistral.ai/pricing/api
    prices:
      input_mtok: 1.5
      cache_read_mtok: 0.15
      output_mtok: 7.5

  - id: mistral-medium-latest
    name: Mistral Medium Latest
    match:
      equals: mistral-medium-latest
    # No context_window: this alias pointed to the 128k mistral-medium-2505 before repointing
    # to the 262,144 Medium 3.5 — no single value is true for every request it matches
    prices_checked: 2026-08-24
    price_comments: >-
      The latest alias moved from Mistral Medium 3.1 to Mistral Medium 3.5 on 2026-06-16.
      Ref: https://github.com/mistralai/platform-docs-public/commit/cc58c1186b1ca8ad65658f5dfd3ebd29de778c7f
    prices:
      - prices:
          input_mtok: 0.4
          cache_read_mtok: 0.04
          output_mtok: 2
      - constraint:
          start_date: 2026-06-16
        prices:
          input_mtok: 1.5
          cache_read_mtok: 0.15
          output_mtok: 7.5

  - id: mistral-nemo
    name: Mistral NeMo
    description: >-
      A 12B parameter model with a 128k token context length built by Mistral in collaboration with NVIDIA.
    match:
      or:
        - equals: mistral-nemo
