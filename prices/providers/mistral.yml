    # No context_window: live aliases disagree — mistral-medium reports 262,144 while
    # mistral-medium-2505/2508 report 131,072 — no single value is true for every ref it matches
    prices:
      input_mtok: 0.4
      cache_read_mtok: 0.04
      output_mtok: 2

  - id: mistral-medium-3-5
    name: Mistral Medium 3.5
    description: >-
      Mistral Medium 3.5 is a frontier-class multimodal model optimized for agentic and coding use cases.
