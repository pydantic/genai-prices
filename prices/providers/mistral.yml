# yaml-language-server: $schema=.schema.json
name: Mistral
id: mistral
pricing_urls:
  - https://mistral.ai/pricing/api
api_pattern: 'https://api\.mistral\.ai'
provider_match:
  starts_with: mistral
model_match:
  regex: "^(?![^/]+/)(?:labs-)?(?:(?:mi|code|dev|magi|mini)stral|mixtral|pixtral|voxtral|open-(?:mistral|mixtral))"

# https://github.com/mistralai/client-python/blob/v1.9.3/src/mistralai/models/usageinfo.py
extractors:
  - root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens
  # https://docs.mistral.ai/api/endpoint/audio/transcriptions
  - api_flavor: transcription
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, audio_tokens]
        dest: input_tokens
        required: false
      - path: [prompt_tokens_details, audio_tokens]
        dest: input_audio_tokens
        required: false
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens
      - path: prompt_audio_seconds
        dest: audio_seconds
      - path: prompt_audio_seconds
        dest: input_audio_seconds
  # https://docs.mistral.ai/api/endpoint/ocr
  - api_flavor: ocr
    root: usage_info
    mappings:
      - path: pages_processed
        dest: input_document_pages
  - api_flavor: ocr_annotated
    root: usage_info
    mappings:
      - path: pages_processed
        dest: input_document_pages
      - path: pages_processed
        dest: input_annotated_document_pages

models:
  - id: codestral
    name: Codestral
    description: >-
      Mistral's cutting-edge language model for coding. Codestral specializes in low-latency, high-frequency tasks such as
      fill-in-the-middle (FIM), code correction and test generation.
    match:
      or:
        - equals: codestral-latest
        - equals: codestral-2501
    context_window: 256000
    prices_checked: 2025-07-04
    prices:
      input_mtok: 0.3
      output_mtok: 0.9

  - id: codestral-2508
    name: Codestral 2508
    description: >-
      Mistral's cutting-edge language model for coding released end of July 2025. Codestral specializes in low-latency, high-frequency
      tasks such as fill-in-the-middle (FIM), code correction and test generation.
    match:
      equals: codestral-2508
    context_window: 256000
    prices_checked: 2026-06-09
    prices:
      input_mtok: 0.3
      cache_read_mtok: 0.03
      output_mtok: 0.9

  - id: devstral-2512
    name: Devstral 2 2512
    description: >-
      Devstral 2 is a state-of-the-art open-source model by Mistral AI specializing in agentic coding. It is a 123B-parameter
      dense transformer model supporting a 256K context window.
    match:
      equals: devstral-2512
    context_window: 262144
    prices_checked: 2026-06-09
    prices:
      input_mtok: 0.4
      cache_read_mtok: 0.04
      output_mtok: 2

  - id: devstral-small
    name: Devstral Small
    description: >-
      Devstral-Small-2505 is a 24B parameter agentic LLM fine-tuned from Mistral-Small-3.1, jointly developed by Mistral AI
      and All Hands AI for advanced software engineering tasks. It is optimized for
      codebase exploration, multi-file editing, and integration into coding agents, achieving state-of-the-art results on
      SWE-Bench Verified (46.8%).
    match:
      or:
        - equals: devstral-small
        - equals: devstral-small-2505
        - equals: devstral-small-2507
        - equals: devstral-small-latest
        - equals: labs-devstral-small-2512
    # Every Devstral Small generation is deprecated or retired: 1.0 (devstral-small-2505) retired 2025-11-30,
    # 1.1 (devstral-small-2507) retired 2026-05-31, Small 2 (labs-devstral-small-2512, devstral-small-latest)
    # retired 2026-03-31.
    deprecated: true
    prices_checked: 2026-08-27
    price_comments: >-
      The previous $0.06/$0.12 rates were not Mistral's; every Devstral Small generation is documented at $0.10/$0.30.
      Ref: https://github.com/mistralai/platform-docs-public/tree/main/src/schema/models/models (devstral-small-*.ts)
    prices:
      input_mtok: 0.1
      output_mtok: 0.3

  - id: devstral-small:free
    name: Devstral Small (free)
    description: >-
      Devstral-Small-2505 is a 24B parameter agentic LLM fine-tuned from Mistral-Small-3.1, jointly developed by Mistral AI
      and All Hands AI for advanced software engineering tasks. It is optimized for
      codebase exploration, multi-file editing, and integration into coding agents, achieving state-of-the-art results on
      SWE-Bench Verified (46.8%).
    match:
      equals: devstral-small:free
    prices: {}

  - id: magistral-medium
    name: Magistral Medium
    description: >-
      Magistral is Mistral's first reasoning model. It is ideal for general purpose use requiring longer thought processing
      and better accuracy than with non-reasoning LLMs. From legal research and financial
      forecasting to software development and creative storytelling — this model solves multi-step challenges where transparency
      and precision are critical.
    match:
      or:
        - starts_with: magistral-medium
    prices_checked: 2025-08-12
    # No context_window: this record also matches the retired magistral-medium-2506/2507 releases
    # (40k per Mistral's model docs) vs magistral-medium-latest's 262,144 — no single value is true
    prices:
      input_mtok: 2
      output_mtok: 5

  - id: magistral-small
    name: Magistral Small
    description: >-
      Magistral Small is a 24B parameter instruction-tuned model based on Mistral-Small-3.1 (2503), enhanced through supervised
      fine-tuning on traces from Magistral Medium and further refined via reinforcement
      learning. It is optimized for reasoning and supports a wide multilingual range, including over 20 languages.
    match:
      starts_with: magistral-small-
    prices_checked: 2025-08-12
    # No context_window: this record also matches the retired magistral-small-2506/2507 releases
    # (40k per Mistral's model docs) vs magistral-small-latest's 262,144 — no single value is true
    prices:
      input_mtok: 0.5
      output_mtok: 1.5

  - id: ministral-14b-2512
    name: Ministral 3 14B 2512
    description: >-
      The largest model in the Ministral 3 family, Ministral 3 14B offers frontier capabilities and performance comparable
      to its larger Mistral Small 3.2 24B counterpart.
    match:
      equals: ministral-14b-2512
    context_window: 262144
    prices_checked: 2026-06-09
    prices:
      input_mtok: 0.2
      cache_read_mtok: 0.02
      output_mtok: 0.2

  - id: ministral-3b
    name: Ministral 3B
    description: >-
      Ministral 3B is a 3B parameter model optimized for on-device and edge computing. It excels in knowledge, commonsense
      reasoning, and function-calling, outperforming larger models like Mistral 7B on
      most benchmarks. Supporting up to 128k context length, it's ideal for orchestrating agentic workflows and specialist
      tasks with efficient inference.
    match:
      equals: ministral-3b
    prices:
      input_mtok: 0.04
      output_mtok: 0.04

  - id: ministral-3b-2512
    name: Ministral 3 3B 2512
    description: >-
      The smallest model in the Ministral 3 family, Ministral 3 3B is a powerful, efficient tiny language model with vision
      capabilities.
    match:
      equals: ministral-3b-2512
    context_window: 131072
    prices_checked: 2026-06-09
    prices:
      input_mtok: 0.1
      cache_read_mtok: 0.01
      output_mtok: 0.1

  - id: ministral-8b
    name: Ministral 8B 24.10
    description: >-
      Ministral 8B is an 8B parameter model featuring a unique interleaved sliding-window attention pattern for faster, memory-efficient
      inference. Designed for edge use cases, it supports up to 128k context
      length and excels in knowledge and reasoning tasks. It outperforms peers in the sub-10B category, making it perfect
      for low-latency, privacy-first applications.
    match:
      or:
        - equals: ministral-8b
        - equals: ministral-8b-2410
    prices_checked: 2026-08-24
    price_comments: >-
      The previous $1 output price was incorrect; Mistral documented $0.10 from launch.
      Ref: https://github.com/mistralai/platform-docs-public/blob/4422b455194a/src/schema/models/models/ministral-8b-24-1.ts
    prices:
      input_mtok: 0.1
      output_mtok: 0.1

  - id: ministral-8b-2512
    name: Ministral 3 8B 2512
    description: >-
      Ministral 3 8B is an efficient text and vision model for edge deployment.
    match:
      equals: ministral-8b-2512
    context_window: 262144
    prices_checked: 2026-08-24
    price_comments: >-
      Ref: https://mistral.ai/pricing/api
    prices:
      input_mtok: 0.15
      cache_read_mtok: 0.015
      output_mtok: 0.15

  - id: ministral-8b-latest
    name: Ministral 8B Latest
    match:
      equals: ministral-8b-latest
    # No context_window: this alias pointed to Ministral 8B 24.10 (128k) until 2025-12-02,
    # now to Ministral 3 8B (262,144) — no single value is true for every request it matches
    prices_checked: 2026-08-24
    price_comments: >-
      The latest alias moved from Ministral 8B 24.10 to Ministral 3 8B on 2025-12-02.
      Ref: https://github.com/mistralai/platform-docs-public/commit/4975b09514f95978cfeeea814562000348548107
    prices:
      - prices:
          input_mtok: 0.1
          output_mtok: 0.1
      - constraint:
          start_date: 2025-12-02
        prices:
          input_mtok: 0.15
          cache_read_mtok: 0.015
          output_mtok: 0.15

  - id: mistral-7b
    name: Mistral 7B
    match:
      or:
        - equals: mistral-7b
        - equals: open-mistral-7b
    prices_checked: 2025-08-12
    prices:
      input_mtok: 0.25
      output_mtok: 0.25

  - id: mistral-embed
    match:
      equals: mistral-embed
    context_window: 8192
    prices:
      input_mtok: 0.1
      output_mtok: 0.1

  - id: mistral-large
