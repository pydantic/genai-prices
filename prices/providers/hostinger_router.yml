# Prices are converted from Router credits to USD: 1 credit = $0.01; catalog values are credits per token. Checked 2026-11-10.
name: Hostinger AI Router
id: hostinger_router
pricing_urls:
  - https://router.hostinger.com/v1/models
  - https://www.hostinger.com/ai-router
api_pattern: https://router\.hostinger\.com
description: OpenAI-compatible multi-model inference router from Hostinger.
extractors:
  - api_flavor: default
    root: usage
    model_path: model
    mappings:
      - path: prompt_tokens
        dest: input_tokens
        required: true
      - path:
          - prompt_tokens_details
          - cached_tokens
        dest: cache_read_tokens
        required: false
      - path:
          - prompt_tokens_details
          - cache_write_tokens
        dest: cache_write_tokens
        required: false
      - path:
          - prompt_tokens_details
          - audio_tokens
        dest: input_audio_tokens
        required: false
      - path:
          - completion_tokens_details
          - audio_tokens
        dest: output_audio_tokens
        required: false
      - path:
          - completion_tokens_details
          - reasoning_tokens
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens
        required: true
  - api_flavor: chat
    root: usage
    model_path: model
    mappings:
      - path: prompt_tokens
        dest: input_tokens
        required: true
      - path:
          - prompt_tokens_details
          - cached_tokens
        dest: cache_read_tokens
        required: false
      - path:
          - prompt_tokens_details
          - cache_write_tokens
        dest: cache_write_tokens
        required: false
      - path:
          - prompt_tokens_details
          - audio_tokens
        dest: input_audio_tokens
        required: false
      - path:
          - completion_tokens_details
          - audio_tokens
        dest: output_audio_tokens
        required: false
      - path:
          - completion_tokens_details
          - reasoning_tokens
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens
        required: true
