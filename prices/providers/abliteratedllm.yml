# yaml-language-server: $schema=.schema.json
id: abliteratedllm
name: AbliteratedLLM
description: OpenAI- and Anthropic-compatible hosted inference for abliterated and stock open-weight models.
pricing_urls:
  - https://abliteratedllm.dev/pricing
  - https://api.abliteratedllm.dev/v1/models
api_pattern: 'https://api\.abliteratedllm\.dev(?:/|$)'
provider_match:
  contains: abliteratedllm
price_comments: >-
  Prices and context windows verified against https://api.abliteratedllm.dev/v1/models and
  https://abliteratedllm.dev/pricing on 2026-11-19. Prompt cache reads are billed at the published
  cached-input rate with no cache-write surcharge. Models supporting priority service tier include a
  `service_tier: priority` variant effective from the 2026-11-19 verification date; earlier priority
  tier history is not modeled. Model IDs overlap with upstream model names, so requests require an
  explicit `abliteratedllm` provider ID or API URL.
extractors:
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

  - api_flavor: responses
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: [input_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [output_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: output_tokens
        dest: output_tokens

  - api_flavor: anthropic
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: cache_read_input_tokens
        dest: input_tokens
        required: false
      - path: cache_read_input_tokens
        dest: cache_read_tokens
        required: false
      - path: output_tokens
        dest: output_tokens

models:
  - id: deepseek-v4.1-flash-1017
    name: DeepSeek V4.1 Flash 1017
    match:
      equals: deepseek-v4.1-flash-1017
    context_window: 1048576
    prices_checked: 2026-11-19
    prices:
      input_mtok: 0.27
      cache_read_mtok: 0.0054
      output_mtok: 1.08
    price_variants:
      - when: { service_tier: default }
        prices: {}
      - when: { service_tier: priority }
        constraint: { start_date: 2026-11-19 }
        prices:
          input_mtok: 0.3375
