# yaml-language-server: $schema=.schema.json
id: arcee
name: Arcee
description: OpenAI-compatible hosted inference through the Arcee Platform API.
pricing_urls:
  - https://docs.arcee.ai/get-started/pricing
  - https://api.arcee.ai/api/v1/models
api_pattern: 'https://api\.arcee\.ai(?:/|$)'
provider_match:
  contains: arcee
price_comments: >-
  Covers the complete public Text Models pricing table. The table publishes input, cached-input, and output token rates.
  Context windows and rates for images, requests, and cache writes are omitted because the public pricing page does not publish
  them. Model IDs use third-party namespaces, so they do not infer the Arcee provider without an Arcee provider ID or API URL.

# Arcee returns an OpenAI-compatible chat completion response with standard model and usage fields.
# https://docs.arcee.ai/api-reference/chat-completion
extractors:
  - api_flavor: default
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

