# yaml-language-server: $schema=.schema.json
name: Arcee
id: arcee
pricing_urls:
  - https://docs.arcee.ai/get-started/pricing
  - https://api.arcee.ai/api/v1/models
api_pattern: 'https://api\.arcee\.ai(?:/|$)'
provider_match:
  contains: arcee
price_comments: >-
  USD prices per million tokens. The public pricing page lists every model except
  deepseek/deepseek-v4-pro-0813; its pricing and all context windows were checked against the authenticated models endpoint.

# Arcee exposes an OpenAI-compatible Chat Completions API.
# https://docs.arcee.ai/api-reference/chat-completion
extractors:
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

models:
  - id: deepseek/deepseek-v4-flash-latest
    name: DeepSeek V4 Flash
    match:
      equals: deepseek/deepseek-v4-flash-latest
    context_window: 1048576
    prices_checked: 2026-08-17
    prices:
      input_mtok: 0.14
      cache_read_mtok: 0.028
      output_mtok: 0.28

  - id: deepseek/deepseek-v4-pro
    name: DeepSeek V4 Pro
    match:
      equals: deepseek/deepseek-v4-pro
    context_window: 512000
    prices_checked: 2026-08-17
    prices:
      input_mtok: 1.74
      cache_read_mtok: 0.20
      output_mtok: 3.48

  - id: deepseek/deepseek-v4-pro-0813
    name: DeepSeek V4 Pro 0813
    match:
      equals: deepseek/deepseek-v4-pro-0813
    context_window: 1048576
    prices_checked: 2026-08-17
    price_comments: >-
      Pricing is exposed by Arcee's authenticated models endpoint and is not yet listed on the public pricing page.
    prices:
      input_mtok: 1.32
      cache_read_mtok: 0.044
      output_mtok: 3.96

  - id: moonshotai/kimi-k3
    name: Kimi K3
    match:
      equals: moonshotai/kimi-k3
    context_window: 1048576
    prices_checked: 2026-08-17
    prices:
      input_mtok: 3.00
      cache_read_mtok: 0.30
