# yaml-language-server: $schema=.schema.json
id: huggingface_deepinfra
name: HuggingFace (deepinfra)
pricing_urls:
  - https://router.huggingface.co/v1/models
  - https://huggingface.co/inference/models
api_pattern: https://router\.huggingface\.co/deepinfra
provider_match:
  and:
    - contains: huggingface
    - contains: deepinfra
extractors:
  - api_flavor: default
    root: usage
    model_path: model
    mappings:
      - path: prompt_tokens
        dest: input_tokens
        required: true
      - path:
          - prompt_tokens_details
          - cached_tokens
        dest: cache_read_tokens
        required: false
      - path:
          - prompt_tokens_details
          - cache_write_tokens
        dest: cache_write_tokens
        required: false
      - path:
          - prompt_tokens_details
          - audio_tokens
        dest: input_audio_tokens
        required: false
      - path:
          - completion_tokens_details
          - audio_tokens
        dest: output_audio_tokens
        required: false
      - path:
          - completion_tokens_details
          - reasoning_tokens
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens
        required: true
  - api_flavor: chat
    root: usage
    model_path: model
    mappings:
      - path: prompt_tokens
        dest: input_tokens
        required: true
      - path:
          - prompt_tokens_details
          - cached_tokens
        dest: cache_read_tokens
        required: false
      - path:
          - prompt_tokens_details
          - cache_write_tokens
        dest: cache_write_tokens
        required: false
      - path:
          - prompt_tokens_details
          - audio_tokens
        dest: input_audio_tokens
        required: false
      - path:
          - completion_tokens_details
          - audio_tokens
        dest: output_audio_tokens
        required: false
      - path:
          - completion_tokens_details
          - reasoning_tokens
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens
        required: true
