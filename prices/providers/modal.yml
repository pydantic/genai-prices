# yaml-language-server: $schema=.schema.json
name: Modal
id: modal
pricing_urls:
  - https://modal.com/library
api_pattern: 'https://[^/]+\.modal\.(?:run|direct)(?:/|$)'
provider_match:
  contains: modal

# Modal Shared Endpoints use the OpenAI-compatible chat completions and responses APIs.
extractors:
  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [prompt_tokens_details, cache_write_tokens]
        dest: cache_write_tokens
        required: false
      - path: reasoning_tokens
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

  - api_flavor: responses
    root: usage
    mappings:
      - path: input_tokens
        dest: input_tokens
      - path: [input_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [input_tokens_details, cache_write_tokens]
        dest: cache_write_tokens
        required: false
      - path: [output_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: output_tokens
        dest: output_tokens

models:
  - id: Qwen/Qwen3.8-2.4T-A95B
    name: Qwen3.8-Max
    match:
      equals: Qwen/Qwen3.8-2.4T-A95B
